<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shake</title>
<meta name="description" content="Dagens shake: rätt mängder i rätt ordning, glas för glas.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shake">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1D1426">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preload" href="fonts/sofia-sans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/sofia-sans-extra-condensed.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Layout: one narrow column for a phone on the kitchen counter. The measuring jug is the one loud thing:
   it fills as ingredients go in, churns while the mixer runs and drains glass by glass through the day.
   Amounts are set big and condensed so they read at arm's length. Colour only ever means an ingredient
   (inside the jug and on the dot beside its name) or, in scale-red, a measurement mark or a limit. */
@font-face { font-family: "Sofia Sans"; src: url("fonts/sofia-sans.woff2") format("woff2"); font-weight: 1 1000; font-display: swap; }
@font-face { font-family: "Sofia Sans XC"; src: url("fonts/sofia-sans-extra-condensed.woff2") format("woff2"); font-weight: 1 1000; font-display: swap; }

:root {
  --bg: #F4F2F6;          /* porcelain with a breath of blueberry in it */
  --ink: #1D1426;         /* blackcurrant */
  --muted: #655A74;
  --line: #DED8E5;        /* hairlines */
  --edge: #B6ABC4;        /* outlines of things you tap */
  --field: #FFFFFF;
  --berry: #5E2B97;       /* the shake itself: main buttons, things that are done */
  --on-berry: #FFFFFF;
  --berry-soft: #EAE1F4;
  --scale: #CF3527;       /* the red print on a measuring jug: ticks, marks, limits */
  --glass: #8F839E;       /* the jug's outline */
  --glass-fill: #E9E4EF;
  --band: #1D1426;        /* behind the phone's clock and battery */
  --display: "Sofia Sans XC", "Arial Narrow", "Helvetica Neue", sans-serif;
  --body: "Sofia Sans", "Helvetica Neue", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #150E1C; --ink: #F2EDF8; --muted: #A99DB9; --line: #2D2240; --edge: #54446A; --field: #1E1529;
    --berry: #B892F2; --on-berry: #1A0F26; --berry-soft: #2C1E40; --scale: #FF6F5B;
    --glass: #7B6C8E; --glass-fill: #1B1324; --band: #0D0812;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 1.0625rem/1.35 var(--body);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 30;
  background: var(--band);
}
button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
h1, h2, h3, p, dl, dd, ul, ol { margin: 0; padding: 0; }
ul, ol { list-style: none; }

.app {
  max-width: 30rem;
  margin-inline: auto;
  padding: calc(env(safe-area-inset-top, 0px) + 1rem) max(20px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 6.25rem) max(20px, env(safe-area-inset-left, 0px));
}

/* ---------- Type ---------- */
.title { font: 800 2.75rem/0.92 var(--display); letter-spacing: 0.005em; }
.sub { color: var(--muted); font-size: 0.9375rem; }
.h2 { font: 800 1.625rem/1 var(--display); letter-spacing: 0.01em; }
.label { font-size: 0.9375rem; font-weight: 700; }
.hint { color: var(--muted); font-size: 0.9375rem; line-height: 1.4; }
.num { font-family: var(--display); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: 0.01em; }

.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; padding-bottom: 1.125rem; }
.top .sub { padding-bottom: 0.3125rem; text-align: right; }

.view { display: grid; gap: 1.75rem; }
.block { display: grid; gap: 0.625rem; }

/* ---------- Buttons ---------- */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 0.5rem;
  width: 100%; min-height: 3.5rem; padding: 0 1.25rem;
  border: 2px solid var(--edge); border-radius: 0.875rem;
  background: transparent; color: var(--ink);
  font-weight: 700; font-size: 1.0625rem; cursor: pointer;
}
.btn.primary { border-color: var(--berry); background: var(--berry); color: var(--on-berry); font-size: 1.1875rem; min-height: 3.75rem; }
.btn.quiet { width: auto; min-height: 2.75rem; padding: 0 0.25rem; border: 0; color: var(--muted); font-weight: 600; font-size: 0.9375rem; text-decoration: underline; text-underline-offset: 0.2em; }
.btn:active { transform: translateY(1px); }
.btnrow { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.25rem 1rem; }

/* ---------- The jug ---------- */
.jug { position: relative; flex: none; width: var(--jw, 7.5rem); height: var(--jh, 12.5rem); margin: 3px 1.875rem 0 2.25rem; }
.jug::before {            /* the rim, a little wider than the glass, with a pouring lip */
  content: ""; position: absolute; left: -0.5rem; right: -0.1875rem; top: -3px; height: 3px;
  border-radius: 3px; background: var(--glass);
}
.jug-handle {
  position: absolute; right: -1.75rem; top: 14%; width: 1.75rem; height: 46%;
  border: 3px solid var(--glass); border-left: 0; border-radius: 0 1rem 1.375rem 0;
}
.jug-glass {
  position: absolute; inset: 0;
  border: 3px solid var(--glass); border-top: 0; border-radius: 3px 3px 1.25rem 1.25rem;
  background: var(--glass-fill); overflow: hidden; isolation: isolate;
}
.jug-liquid { position: absolute; inset: 0; display: flex; flex-direction: column-reverse; }
.jug-liquid i {
  flex: none; display: block; width: 100%; height: 0;
  transition: height 0.55s cubic-bezier(0.2, 0.7, 0.2, 1), background-color 2.2s ease;
}
.jug-liquid i.crest { box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.42); }
.jug-liquid.glasses i { box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.5); }
.jug-vortex {             /* the dip a running mixer pulls into the surface */
  position: absolute; left: 22%; right: 22%; bottom: var(--level, 0%); height: 1.125rem; margin-bottom: -0.5625rem;
  border-radius: 50%; background: var(--glass-fill); opacity: 0; transform: scale(0.6, 0.2);
  transition: opacity 0.25s ease, bottom 0.55s ease;
}
.jug.is-mixing .jug-vortex { opacity: 1; animation: vortex 0.42s ease-in-out infinite alternate; }
@keyframes vortex { from { transform: scale(0.86, 0.5); } to { transform: scale(1.08, 1); } }
.jug-scale { position: absolute; left: -2.25rem; top: 0; bottom: 3px; width: 2.25rem; }
.jug-scale i { position: absolute; right: 0; width: 0.4375rem; height: 0; border-top: 1.5px solid var(--scale); }
.jug-scale i.major { width: 0.8125rem; border-top-width: 2px; }
.jug-scale span {
  position: absolute; right: 1.0625rem; transform: translateY(50%);
  font: 700 0.75rem/1 var(--body); font-variant-numeric: tabular-nums; color: var(--scale);
}
.jug-unit { position: absolute; left: -2.25rem; top: -1.375rem; width: 1.9375rem; text-align: right; font: 700 0.75rem/1 var(--body); color: var(--scale); }

/* ---------- Today ---------- */
.hero { display: flex; align-items: flex-start; gap: 0.75rem; padding-top: 1.25rem; }
.hero-side { flex: 1; min-width: 0; display: grid; gap: 0.875rem; padding-top: 0.125rem; }
.big { display: flex; align-items: baseline; flex-wrap: wrap; gap: 0 0.375rem; }
.big b { font: 800 4rem/0.82 var(--display); font-variant-numeric: tabular-nums; letter-spacing: 0.005em; }
.big span { font-weight: 700; font-size: 1.0625rem; }
.facts { display: grid; gap: 0.375rem; }
.facts div { display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem; padding-bottom: 0.375rem; border-bottom: 1px solid var(--line); }
.facts dt { color: var(--muted); font-size: 0.9375rem; }
.facts dd { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }

.alert { display: grid; grid-template-columns: auto 1fr; gap: 0.625rem; align-items: start; font-size: 0.9375rem; line-height: 1.4; }
.alert::before { content: ""; width: 0.8125rem; margin-top: 0.5625rem; border-top: 2.5px solid var(--scale); }
.alert b { font-weight: 700; }

/* Ingredient rows, shared by Today, the recipe table and the mixing screen */
.rows { display: grid; }
.row {
  display: grid; grid-template-columns: 1.5rem minmax(0, 1fr) auto; align-items: center; gap: 0.75rem;
  width: 100%; min-height: 3.375rem; padding: 0.375rem 0; border: 0; border-bottom: 1px solid var(--line);
  background: none; text-align: left;
}
.rows .row:first-child { border-top: 1px solid var(--line); }
.dot { width: 1.25rem; height: 1.25rem; border-radius: 50%; background: var(--c, transparent); box-shadow: inset 0 0 0 1.5px rgba(29, 20, 38, 0.28); }
@media (prefers-color-scheme: dark) { .dot { box-shadow: inset 0 0 0 1.5px rgba(242, 237, 248, 0.3); } }
.row-name { min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
.row-name small { display: block; margin-top: 0.125rem; color: var(--muted); font-size: 0.8125rem; font-weight: 500; line-height: 1.3; }
.row-amt { font: 800 1.625rem/1 var(--display); font-variant-numeric: tabular-nums; letter-spacing: 0.01em; white-space: nowrap; text-align: right; }
.row-amt small { font: 600 0.8125rem/1 var(--body); color: var(--muted); letter-spacing: 0; }
.row-amt .delta { display: block; margin-top: 0.1875rem; font: 700 0.75rem/1 var(--body); letter-spacing: 0; color: var(--scale); }
.row.is-out .row-name { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.row.is-out .dot { background: transparent; }
.row.has-toggle { grid-template-columns: 1.5rem minmax(0, 1fr) auto auto; }
.out {
  min-width: 3.25rem; min-height: 2.25rem; padding: 0 0.625rem; border: 1.5px solid var(--edge); border-radius: 999px;
  background: transparent; color: var(--muted); font-size: 0.8125rem; font-weight: 700; cursor: pointer;
}
.out[aria-pressed="true"] { border-color: var(--scale); background: var(--scale); color: #fff; }
@media (prefers-color-scheme: dark) { .out[aria-pressed="true"] { color: #1A0F26; } }

/* Glasses */
.glass {
  display: grid; grid-template-columns: 2rem minmax(0, 1fr) auto; align-items: center; gap: 0.75rem;
  width: 100%; min-height: 4rem; padding: 0.5rem 0; border: 0; border-bottom: 1px solid var(--line);
  background: none; text-align: left; cursor: pointer;
}
.glasses-list .glass:first-child { border-top: 1px solid var(--line); }
.tick {
  position: relative; width: 1.875rem; height: 1.875rem; border: 2px solid var(--edge); border-radius: 50%;
  transition: background-color 0.15s ease, border-color 0.15s ease;
}
.tick::after {
  content: ""; position: absolute; left: 50%; top: 50%; width: 0.75rem; height: 0.375rem;
  border-left: 2.5px solid var(--on-berry); border-bottom: 2.5px solid var(--on-berry);
  transform: translate(-50%, -68%) rotate(-45deg); opacity: 0;
}
[aria-pressed="true"] > .tick, .is-done > .tick { background: var(--berry); border-color: var(--berry); }
[aria-pressed="true"] > .tick::after, .is-done > .tick::after { opacity: 1; }
.glass-name { font-weight: 700; }
.glass-name small { display: block; margin-top: 0.125rem; color: var(--muted); font-size: 0.875rem; font-weight: 500; }
.glass-time { color: var(--muted); font-size: 0.9375rem; font-variant-numeric: tabular-nums; }
.glass.is-next .tick { border-color: var(--berry); box-shadow: 0 0 0 4px var(--berry-soft); }
.glass.is-next .glass-time { color: var(--ink); font-weight: 700; }

/* The last two weeks: one small jug per day, filled by how many glasses were drunk */
.days { display: grid; grid-template-columns: repeat(14, 1fr); gap: 0.3125rem; align-items: end; }
.day { display: grid; gap: 0.3125rem; justify-items: center; }
.day i {
  position: relative; display: block; width: 100%; max-width: 1.125rem; height: 2.25rem;
  border: 1.5px solid var(--edge); border-top: 0; border-radius: 1px 1px 0.3125rem 0.3125rem; overflow: hidden;
}
.day i::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: var(--f, 0%); background: var(--berry); }
.day.is-today i { border-color: var(--ink); }
.day span { font-size: 0.6875rem; font-weight: 600; color: var(--muted); }
.day.is-today span { color: var(--ink); font-weight: 800; }

/* ---------- Controls ---------- */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 3px; border: 1.5px solid var(--edge); border-radius: 0.875rem; }
.seg button {
  min-height: 2.875rem; padding: 0 0.375rem; border: 0; border-radius: 0.625rem; background: transparent;
  color: var(--muted); font-weight: 700; font-size: 1rem; cursor: pointer; font-variant-numeric: tabular-nums;
}
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.switch {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 1rem;
  width: 100%; min-height: 3.5rem; padding: 0.625rem 0; border: 0; border-bottom: 1px solid var(--line);
  background: none; text-align: left; cursor: pointer;
}
.switches .switch:first-child { border-top: 1px solid var(--line); }
.switch b { display: block; font-weight: 700; }
.switch small { display: block; margin-top: 0.125rem; color: var(--muted); font-size: 0.875rem; line-height: 1.35; }
.knob { position: relative; width: 3.125rem; height: 1.875rem; border-radius: 999px; background: var(--edge); transition: background-color 0.15s ease; }
.knob::after {
  content: ""; position: absolute; left: 3px; top: 3px; width: 1.5rem; height: 1.5rem; border-radius: 50%;
  background: var(--field); transition: transform 0.15s ease;
}
.switch[aria-pressed="true"] .knob { background: var(--berry); }
.switch[aria-pressed="true"] .knob::after { transform: translateX(1.25rem); }
@media (prefers-color-scheme: dark) { .switch[aria-pressed="true"] .knob::after { background: var(--on-berry); } }

.stepper { display: grid; grid-template-columns: 3.5rem 1fr 3.5rem; align-items: center; border: 1.5px solid var(--edge); border-radius: 0.875rem; }
.stepper button { min-height: 3.25rem; border: 0; background: none; font: 800 1.75rem/1 var(--display); cursor: pointer; }
.stepper button:disabled { color: var(--edge); }
.stepper output { text-align: center; font-weight: 700; }
.stepper output b { font: 800 1.75rem/1 var(--display); font-variant-numeric: tabular-nums; }

.totals { display: flex; justify-content: space-between; gap: 1rem; padding-top: 0.75rem; font-weight: 700; }

/* ---------- Nutrition: laid out like the declaration on a pack ---------- */
.decl { border: 2px solid var(--ink); border-radius: 0.375rem; padding: 0.875rem 0.875rem 0.5rem; }
.decl h3 { font: 800 1.625rem/1 var(--display); letter-spacing: 0.01em; padding-bottom: 0.5rem; border-bottom: 6px solid var(--ink); }
.decl-row { display: flex; justify-content: space-between; gap: 1rem; padding: 0.4375rem 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.decl-row.in { padding-left: 1rem; color: var(--muted); }
.decl-row b { font-weight: 700; }
.decl-row:last-child { border-bottom: 0; }
.cov { display: grid; }
.cov-head { display: flex; justify-content: space-between; align-items: baseline; padding: 0 0 0.5rem; border-bottom: 3px solid var(--ink); }
.cov-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.25rem 0.75rem; padding: 0.5625rem 0 0.625rem; border-bottom: 1px solid var(--line); }
.cov-name { font-weight: 600; }
.cov-name small { color: var(--muted); font-weight: 500; font-size: 0.8125rem; }
.cov-pct { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.cov-bar { grid-column: 1 / -1; position: relative; height: 0.5rem; border-radius: 2px; background: var(--line); }
.cov-bar i { position: absolute; left: 0; top: 0; bottom: 0; width: var(--w, 0%); border-radius: 2px; background: var(--ink); }
.cov-bar i.extra { left: var(--from, 0%); background: var(--berry); border-radius: 0 2px 2px 0; }
.cov-bar::after { content: ""; position: absolute; left: 66.667%; top: -0.25rem; bottom: -0.25rem; border-left: 2px solid var(--scale); }
.cov-row.is-low .cov-pct { color: var(--scale); }
.cov-note { grid-column: 1 / -1; color: var(--scale); font-size: 0.8125rem; font-weight: 600; }
.key { display: flex; flex-wrap: wrap; gap: 0.375rem 1rem; color: var(--muted); font-size: 0.8125rem; }
.key span { display: inline-flex; align-items: center; gap: 0.375rem; }
.key i { display: inline-block; width: 0.875rem; height: 0.5rem; border-radius: 2px; background: var(--ink); }
.key i.extra { background: var(--berry); }
.key i.need { width: 0; height: 0.875rem; border-left: 2px solid var(--scale); border-radius: 0; background: none; }

.status { min-height: 1.4em; font-size: 0.9375rem; font-weight: 700; }

/* ---------- Bottom tabs ---------- */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: flex; justify-content: center;
  padding: 0 max(8px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left, 0px));
  background: var(--bg); border-top: 1px solid var(--line);
}
.tabs button {
  position: relative; flex: 1; max-width: 8rem; min-height: 3.5rem; border: 0; background: none;
  color: var(--muted); font-weight: 700; font-size: 1rem; cursor: pointer;
}
.tabs button[aria-pressed="true"] { color: var(--ink); }
.tabs button[aria-pressed="true"]::before { content: ""; position: absolute; left: 22%; right: 22%; top: -1px; border-top: 3px solid var(--berry); }

/* ---------- The mixing screen ---------- */
.mix {
  position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column;
  padding: env(safe-area-inset-top, 0px) max(20px, env(safe-area-inset-right, 0px)) 0 max(20px, env(safe-area-inset-left, 0px));
  background: var(--bg); overflow: hidden;
}
.mix::before {            /* the same dark band behind the phone's clock as on the other screens */
  content: ""; position: absolute; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--band);
}
.mix-top { flex: none; display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 0.75rem; min-height: 3.25rem; }
.mix-top .btn.quiet { justify-self: start; }
.mix-round { justify-self: end; font-weight: 700; font-size: 0.9375rem; }
.mix-prog { flex: none; display: flex; gap: 4px; }
.mix-prog i { flex: 1; height: 5px; border-radius: 2px; background: var(--line); }
.mix-prog i.on { background: var(--berry); }
.mix-prog i.cur { background: var(--ink); }
.mix-stage { flex: none; display: flex; justify-content: center; padding: 2.125rem 0 1rem; }
.mix-stage .jug { --jw: 9rem; --jh: 11.25rem; }
.mix-scroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding-bottom: 1rem; }
html.is-mixing, html.is-mixing body { overflow: hidden; }   /* the page behind stays put */
.mix-title { font: 800 2.125rem/0.98 var(--display); letter-spacing: 0.005em; text-wrap: balance; }
.mix-tip { margin-top: 0.4375rem; color: var(--muted); font-size: 1rem; line-height: 1.35; }
.mix .rows { margin-top: 0.875rem; }
.mix .row { min-height: 3.75rem; cursor: pointer; }
.mix .row-amt { font-size: 2.125rem; }
.mix .row.is-in .row-name, .mix .row.is-in .row-amt { color: var(--muted); }
.mix .row .tick { width: 1.5rem; height: 1.5rem; background: var(--c); border-color: var(--edge); }
.mix .row .tick::after { width: 0.625rem; height: 0.3125rem; border-width: 2px; }
.mix .row.is-in .tick { background: var(--berry); border-color: var(--berry); }
.mix .row.is-in .tick::after { opacity: 1; }
.mix-foot {
  flex: none; display: grid; gap: 0.5rem;
  padding: 0.75rem 0 calc(env(safe-area-inset-bottom, 0px) + 0.875rem);
  border-top: 1px solid var(--line); background: var(--bg);
}
.timer { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 1rem; }
.timer-num { font: 800 4.75rem/0.8 var(--display); font-variant-numeric: tabular-nums; }
.timer-num small { font: 700 1.0625rem/1 var(--body); margin-left: 0.375rem; }
.timer-track { grid-column: 1 / -1; position: relative; height: 0.625rem; border-radius: 2px; background: var(--line); overflow: hidden; }
.timer-track i { position: absolute; inset: 0; background: var(--berry); transform-origin: left center; transform: scaleX(var(--left, 1)); }

/* ---------- The smallest phones ---------- */
@media (max-width: 359px) {
  .app { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .mix { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .hero { gap: 0.375rem; }
  .hero .jug { --jw: 5.5rem; --jh: 11rem; margin-right: 1.5rem; }
  .hero .jug-handle { right: -1.375rem; width: 1.375rem; }
  .big b { font-size: 3.25rem; }
  .title { font-size: 2.375rem; }
  .mix-stage { padding: 1.875rem 0 0.75rem; }
  .mix-stage .jug { --jh: 8.5rem; }

<script>
/* ---------- The recipe and the calculator. No screen code in here. ---------- */
var SHAKE = (function () {
  "use strict";

  // Nutrients per 100 g. Standard values (Livsmedelsverket / USDA, rounded):
  // the same table the recipe sheet was calculated from, so energy and protein agree with it.
  // The milk's carbohydrate follows the pack of a lactose-free milk drink, which is lower than ordinary milk.
  var KEYS = ["kcal", "prot", "carb", "fat", "fiber", "sugar", "vitA", "vitD", "vitE", "vitK", "vitC",
    "B1", "B2", "niacin", "B6", "folate", "B12", "Ca", "P", "Mg", "Fe", "Zn", "Cu", "I", "Se", "K", "Na", "Mn",
    "choline", "EPADHA"];
  var FOODS = {
    milk:    { kcal: 51, prot: 3.0, carb: 2.5, fat: 3.0, sugar: 2.4, vitA: 32, vitD: 1.0, vitE: 0.08, vitK: 0.3, vitC: 1, B1: 0.04, B2: 0.16, niacin: 0.1, B6: 0.04, folate: 5, B12: 0.4, Ca: 120, P: 95, Mg: 11, Fe: 0.03, Zn: 0.4, Cu: 0.01, I: 15, Se: 1.5, K: 150, Na: 40, Mn: 0.003, choline: 15 },
    milk15:  { kcal: 38, prot: 3.0, carb: 2.5, fat: 1.5, sugar: 2.4, vitA: 18, vitD: 1.0, vitE: 0.04, vitK: 0.2, vitC: 1, B1: 0.04, B2: 0.16, niacin: 0.1, B6: 0.04, folate: 5, B12: 0.4, Ca: 120, P: 95, Mg: 11, Fe: 0.03, Zn: 0.4, Cu: 0.01, I: 15, Se: 1.5, K: 150, Na: 40, Mn: 0.003, choline: 15 },
    smp:     { kcal: 358, prot: 36, carb: 52, fat: 0.8, sugar: 52, vitA: 10, vitK: 0.1, vitC: 3, B1: 0.4, B2: 1.55, niacin: 0.95, B6: 0.36, folate: 50, B12: 4.0, Ca: 1250, P: 970, Mg: 110, Fe: 0.3, Zn: 4.0, Cu: 0.04, I: 140, Se: 15, K: 1700, Na: 535, Mn: 0.02, choline: 169 },
    yog:     { kcal: 133, prot: 5.0, carb: 4.0, fat: 10, sugar: 4.0, vitA: 95, vitD: 0.1, vitE: 0.2, vitK: 0.5, vitC: 0.5, B1: 0.04, B2: 0.2, niacin: 0.15, B6: 0.05, folate: 10, B12: 0.5, Ca: 110, P: 100, Mg: 11, Fe: 0.1, Zn: 0.5, Cu: 0.02, I: 20, Se: 2, K: 140, Na: 40, Mn: 0.004, choline: 15 },
    oat:     { kcal: 380, prot: 14, carb: 58, fat: 7, fiber: 10, sugar: 1, vitE: 1.0, vitK: 2, B1: 0.6, B2: 0.1, niacin: 1.0, B6: 0.12, folate: 50, Ca: 54, P: 410, Mg: 140, Fe: 4.3, Zn: 3.6, Cu: 0.4, I: 1, Se: 5, K: 400, Na: 2, Mn: 3.6, choline: 40 },
    whey:    { kcal: 400, prot: 80, carb: 6, fat: 5, sugar: 4, vitA: 10, B1: 0.1, B2: 0.8, niacin: 0.3, B6: 0.1, folate: 10, B12: 1.0, Ca: 400, P: 300, Mg: 60, Fe: 0.5, Zn: 1.0, Cu: 0.05, I: 30, Se: 15, K: 500, Na: 200, choline: 50 },
    blue:    { kcal: 53, prot: 0.7, carb: 10, fat: 0.5, fiber: 2.4, sugar: 9, vitA: 3, vitE: 0.6, vitK: 19, vitC: 7, B1: 0.03, B2: 0.04, niacin: 0.4, B6: 0.05, folate: 6, Ca: 10, P: 12, Mg: 6, Fe: 0.3, Zn: 0.1, Cu: 0.06, Se: 0.1, K: 70, Na: 1, Mn: 0.3, choline: 6 },
    currant: { kcal: 60, prot: 1.4, carb: 8, fat: 0.4, fiber: 5, sugar: 7, vitA: 12, vitE: 1.0, vitK: 5, vitC: 150, B1: 0.05, B2: 0.05, niacin: 0.3, B6: 0.066, folate: 10, Ca: 55, P: 59, Mg: 24, Fe: 1.5, Zn: 0.27, Cu: 0.086, Se: 1, K: 322, Na: 2, Mn: 0.26, choline: 10 },
    spinach: { kcal: 29, prot: 3.6, carb: 1.3, fat: 0.6, fiber: 2.9, sugar: 0.5, vitA: 580, vitE: 2.0, vitK: 372, vitC: 6, B1: 0.08, B2: 0.17, niacin: 0.5, B6: 0.15, folate: 140, Ca: 129, P: 48, Mg: 72, Fe: 1.9, Zn: 0.6, Cu: 0.14, I: 2, Se: 1.3, K: 346, Na: 74, Mn: 0.85, choline: 20 },
    banana:  { kcal: 89, prot: 1.1, carb: 20.2, fat: 0.33, fiber: 2.6, sugar: 12.2, vitA: 3, vitE: 0.1, vitK: 0.5, vitC: 8.7, B1: 0.031, B2: 0.073, niacin: 0.665, B6: 0.367, folate: 20, Ca: 5, P: 22, Mg: 27, Fe: 0.26, Zn: 0.15, Cu: 0.078, Se: 1, K: 358, Na: 1, Mn: 0.27, choline: 9.8 },
    honey:   { kcal: 305, prot: 0.3, carb: 82, sugar: 82, vitC: 0.5, B2: 0.04, B6: 0.02, folate: 2, Ca: 6, P: 4, Mg: 2, Fe: 0.4, Zn: 0.2, Cu: 0.04, K: 52, Na: 4, Mn: 0.08, choline: 2 },
    salt:    { Na: 39000 },
    oil:     { kcal: 884, fat: 100, vitE: 14.4, vitK: 60, Fe: 0.56, Ca: 1, Na: 2, choline: 0.3 },
    water:   {}
  };

  // One entry per thing that goes in the mixer, in the order it goes in.
  //   g     grams in one household unit       step  smallest amount that is practical to measure
  //   vol   how much room one gram takes once mixed, in ml
  //   tint  how strongly it colours the shake (berries stain far more than milk does)
  var ING = [
    { key: "milk",    name: "Laktosfri mjölk 3 %",    short: "mjölk",        buy: "Laktosfri standardmjölk 3 %", unit: "dl",    g: 103,  step: 0.5, vol: 1.0, color: "#F3EFE6", tint: 1 },
    { key: "water",   name: "Vatten",                 short: "vatten",       buy: "",                            unit: "dl",    g: 100,  step: 0.5, vol: 1.0, color: "#DCE9F0", tint: 0.4 },
    { key: "smp",     name: "Skummjölkspulver",       short: "mjölkpulver",  buy: "Skummjölkspulver",            unit: "msk",   g: 7.5,  step: 1,   vol: 0.6, color: "#EDE0C0", tint: 1 },
    { key: "yog",     name: "Grekisk yoghurt 10 %",   short: "yoghurt",      buy: "Grekisk yoghurt 10 %",        unit: "dl",    g: 100,  step: 0.5, vol: 1.0, color: "#FBF8F1", tint: 1 },
    { key: "oat",     name: "Havremjöl",              short: "havremjöl",    buy: "Havremjöl",                   unit: "dl",    g: 50,   step: 0.5, vol: 1.2, color: "#D6BF94", tint: 1.4 },
    { key: "whey",    name: "Whey",                   short: "whey",         buy: "Whey",                        unit: "skopa", g: 30,   step: 0.5, vol: 0.8, color: "#E9D79C", tint: 1 },
    { key: "blue",    name: "Blåbär, frysta",         short: "blåbär",       buy: "Blåbär, frysta",              unit: "dl",    g: 60,   step: 0.5, vol: 1.0, color: "#5A36B8", tint: 120 },
    { key: "currant", name: "Svarta vinbär, frysta",  short: "vinbär",       buy: "Svarta vinbär, frysta",       unit: "dl",    g: 65,   step: 0.5, vol: 1.0, color: "#6E1F86", tint: 120 },
    { key: "spinach", name: "Spenat, fryst hackad",   short: "spenat",       buy: "Spenat, fryst hackad",        unit: "dl",    g: 65,   step: 0.5, vol: 1.0, color: "#2F6B3A", tint: 8 },
    { key: "banana",  name: "Banan",                  short: "banan",        buy: "Bananer",                     unit: "st",    g: 120,  step: 0.5, vol: 1.0, color: "#F0DA78", tint: 1 },
    { key: "honey",   name: "Honung",                 short: "honung",       buy: "Honung",                      unit: "msk",   g: 21,   step: 0.5, vol: 0.7, color: "#D9981E", tint: 1 },
    { key: "salt",    name: "Salt",                   short: "salt",         buy: "",                            unit: "krm",   g: 1.2,  step: 1,   vol: 0,   color: "#FFFFFF", tint: 0 },
    { key: "oil",     name: "Olivolja",               short: "olivolja",     buy: "Olivolja, extra virgin",      unit: "msk",   g: 13.6, step: 0.5, vol: 1.0, color: "#C9B23A", tint: 1 }
  ];
  var BY = {};
  ING.forEach(function (it) { it.stepG = it.g * it.step; BY[it.key] = it; });

  // The three sizes, in household units. 3 000 and 2 000 are the two recipe sheets; 2 500 sits halfway.
  var SIZES = {
    3000: { milk: 5,   smp: 8, yog: 4,   oat: 4, whey: 2,   blue: 2,   currant: 1, spinach: 1, banana: 2,   honey: 1, salt: 1, oil: 5 },
    2500: { milk: 3.5, smp: 8, yog: 3.5, oat: 3, whey: 1.5, blue: 1.5, currant: 1, spinach: 1, banana: 1.5, honey: 1, salt: 1, oil: 5 },
    2000: { milk: 2,   smp: 8, yog: 3,   oat: 2, whey: 1,   blue: 1,   currant: 1, spinach: 1, banana: 1,   honey: 1, salt: 1, oil: 5 }
  };

  // What may be turned up or down to get back to the energy target when something is missing,
  // how far (in steps above the recipe), and how reluctantly (higher = moved less).
  var FLEX = {
    oat:    { up: 2, down: 0, w: 0.25 },
    banana: { up: 2, down: 0, w: 0.30 },
    yog:    { up: 3, down: 2, w: 0.30 },
    oil:    { up: 2, down: 0, w: 0.35 },
    whey:   { up: 2, down: 0, w: 0.50 },
    milk:   { up: 2, down: 0, w: 0.50 },
    blue:   { up: 2, down: 0, w: 0.60 },
    smp:    { up: 0, down: 4, w: 0.80 }
  };
  var FLEX_KEYS = Object.keys(FLEX);

  var CA_LIMIT = 2500;   // mg per day from everything eaten, the upper level for adults
  var LEAVE_ALONE = 75;  // kcal: gaps smaller than this are not worth changing the recipe for
  var GLASS_MAX = 5.2;   // dl: a glass bigger than this becomes one more glass

  // Daily needs: NNR 2023, men 18–24, at 2 900 kcal (12.1 MJ). `ul` is the upper level where one applies.
  var MJ = 2900 * 4.184 / 1000;
  var REF = [
    { key: "vitC",    name: "C-vitamin",   unit: "mg", ref: 110, dec: 0, group: "vit" },
    { key: "vitA",    name: "A-vitamin",   unit: "µg", ref: 800, dec: 0, group: "vit" },
    { key: "vitD",    name: "D-vitamin",   unit: "µg", ref: 10, dec: 1, group: "vit", ul: 100 },
    { key: "vitE",    name: "E-vitamin",   unit: "mg", ref: 11, dec: 1, group: "vit" },
    { key: "vitK",    name: "K-vitamin",   unit: "µg", ref: 75, dec: 0, group: "vit" },
    { key: "B1",      name: "Tiamin (B1)", unit: "mg", ref: Math.round(0.1 * MJ * 100) / 100, dec: 2, group: "vit" },
    { key: "B2",      name: "Riboflavin (B2)", unit: "mg", ref: 1.6, dec: 2, group: "vit" },
    { key: "NE",      name: "Niacin",      unit: "mg", ref: Math.round(1.6 * MJ), dec: 0, group: "vit" },
    { key: "B6",      name: "B6",          unit: "mg", ref: 1.8, dec: 2, group: "vit", ul: 12 },
    { key: "folate",  name: "Folat",       unit: "µg", ref: 330, dec: 0, group: "vit" },
    { key: "B12",     name: "B12",         unit: "µg", ref: 4.0, dec: 1, group: "vit" },
    { key: "Ca",      name: "Kalcium",     unit: "mg", ref: 1000, dec: 0, group: "min", ul: CA_LIMIT },
    { key: "P",       name: "Fosfor",      unit: "mg", ref: 520, dec: 0, group: "min" },
    { key: "Mg",      name: "Magnesium",   unit: "mg", ref: 350, dec: 0, group: "min" },
    { key: "K",       name: "Kalium",      unit: "mg", ref: 3500, dec: 0, group: "min" },
    { key: "Fe",      name: "Järn",        unit: "mg", ref: 9, dec: 1, group: "min" },
    { key: "Zn",      name: "Zink",        unit: "mg", ref: 12.7, dec: 1, group: "min", ul: 25 },
    { key: "Cu",      name: "Koppar",      unit: "mg", ref: 0.9, dec: 2, group: "min", ul: 5 },
    { key: "I",       name: "Jod",         unit: "µg", ref: 150, dec: 0, group: "min", ul: 600 },
    { key: "Se",      name: "Selen",       unit: "µg", ref: 90, dec: 0, group: "min", ul: 255 },
    { key: "Mn",      name: "Mangan",      unit: "mg", ref: 3.0, dec: 1, group: "min" },
    { key: "choline", name: "Kolin",       unit: "mg", ref: 400, dec: 0, group: "other" },
    { key: "fiber",   name: "Fiber",       unit: "g",  ref: 35, dec: 0, group: "other" },
    { key: "EPADHA",  name: "Omega-3 (EPA + DHA)", unit: "g", ref: 0.25, dec: 1, group: "other", ul: 5 }
  ];

  // The three supplements that ride along with the shake. Amounts as the makers state them.
  var SUPPS = [
    { key: "puori",  name: "Puori O3",   amount: "1 tsk",    how: "Flytande fiskolja. Åker i mixern tillsammans med olivoljan.", adds: { EPADHA: 2 } },
    { key: "selen",  name: "Selen",      amount: "1 kapsel", how: "Öppna kapseln och häll pulvret i mixern. Smakar inget.",     adds: { Se: 100 } },
    { key: "dpearl", name: "D-pärla",    amount: "1 pärla",  how: "Tuggas till första glaset.",                                adds: { vitD: 38 } },
    { key: "kreatin", name: "Kreatin",   amount: "5 g",      how: "Kreatinmonohydrat, 1 tsk. Rör ner i mixern. Smakar inget. Varje dag, även vilodagar.", adds: {} }
  ];

  function toSteps(units) {
    var n = {};
    ING.forEach(function (it) { n[it.key] = Math.round((units[it.key] || 0) / it.step); });
    return n;
  }
  function grams(n, key) { return (n[key] || 0) * BY[key].stepG; }

  var milkNow = FOODS.milk;   // which carton the milk comes from; build() sets it from the settings
  function totals(n) {
    var t = {}, i, k, g, f;
    for (i = 0; i < KEYS.length; i++) t[KEYS[i]] = 0;
    for (k in n) {
      g = grams(n, k); f = k === "milk" ? milkNow : FOODS[k];
      if (!g || !f) continue;
      for (i = 0; i < KEYS.length; i++) if (f[KEYS[i]]) t[KEYS[i]] += f[KEYS[i]] * g / 100;
    }
    // Niacin equivalents: niacin itself plus what the body makes from tryptophan (about 1.1 % of protein, 60:1).
    t.NE = t.niacin + (t.prot * 0.011 * 1000) / 60;
    t.lactose = (FOODS.smp.sugar * grams(n, "smp") + FOODS.yog.sugar * grams(n, "yog")) / 100;
    t.addedSugar = FOODS.honey.sugar * grams(n, "honey") / 100;
    t.saltG = t.Na * 2.5 / 1000;
    return t;
  }
  function volumeDl(n) {
    var ml = 0, k;
    for (k in n) ml += grams(n, k) * BY[k].vol;
    return ml / 100;
  }

  // Start from the chosen size, take out what is missing, then walk in small measurable steps
  // towards the energy target. Calcium and lactose never go above what the plain recipe has.
  function build(s) {
    var size = SIZES[s.size] ? s.size : 3000;
    milkNow = s.milk15 ? FOODS.milk15 : FOODS.milk;
    var plain = toSteps(SIZES[size]);
    var plainT = totals(plain), plainVol = volumeDl(plain);
    var target = plainT.kcal;
    var missing = s.missing || {};
    var base = {}, k;
    for (k in plain) base[k] = plain[k];
    base.water = 0;

    var noSmp = !!s.noSmp || !!missing.smp;
    if (noSmp) {
      base.smp = 0;
      if (!missing.whey) base.whey += 2;           // one more scoop stands in for the powder
    }
    if (s.honey === false || missing.honey) base.honey = 0;
    ING.forEach(function (it) {
      if (missing[it.key] && it.key !== "water") {
        if (it.key === "milk") base.water += base.milk;   // still needs the liquid to mix at all
        base[it.key] = 0;
      }
    });
    var thickSteps = Math.max(2, Math.round(plainVol / 9) * 2);   // about one dl per nine
    if (s.thick === -1) base.water += thickSteps;
    if (s.thick === 1) {
      if (base.milk > 0) base.milk = Math.max(2, base.milk - thickSteps);
      else base.water = Math.max(2, base.water - thickSteps);
    }

    var lo = {}, hi = {};
    FLEX_KEYS.forEach(function (key) {
      if (missing[key] || (key === "smp" && noSmp)) { lo[key] = hi[key] = 0; return; }
      lo[key] = Math.max(0, base[key] - FLEX[key].down);
      hi[key] = base[key] + FLEX[key].up;
      if (key === "milk" && s.thick === 1) hi[key] = base[key];   // thicker means the milk stays down
      if (key === "whey" && noSmp) hi[key] = base[key];           // the extra scoop is already in
    });

    var caCap = Math.max(plainT.Ca, 2300) + 10;
    var lacCap = plainT.lactose + 3;
    var protFloor = 0.85 * plainT.prot;

    function ok(n) {
      var t = totals(n);
      return t.Ca <= caCap && t.lactose <= lacCap;
    }
    function score(n) {
      var t = totals(n), sc = Math.pow((t.kcal - target) / 50, 2), i, key;
      for (i = 0; i < FLEX_KEYS.length; i++) {
        key = FLEX_KEYS[i];
        sc += FLEX[key].w * Math.pow(n[key] - base[key], 2);
      }
      if (t.prot < protFloor) sc += 0.5 * Math.pow((protFloor - t.prot) / 10, 2);
      return sc;
    }
    function tryMove(n, up, down) {
      var m = {}, key;
      for (key in n) m[key] = n[key];
      if (up) { if (m[up] + 1 > hi[up]) return null; m[up] += 1; }
      if (down) { if (m[down] - 1 < lo[down]) return null; m[down] -= 1; }
      return ok(m) ? m : null;
    }

    // A gap of a few percent is left alone: a missing spoon of honey should not change the rest.
    var cur = base, curScore = score(cur), guard = 0;
    var improved = Math.abs(totals(base).kcal - target) > LEAVE_ALONE;
    while (improved && guard++ < 80) {
      improved = false;
      var best = null, bestScore = curScore, a, b, cand, sc;
      for (a = -1; a < FLEX_KEYS.length; a++) {
        for (b = -1; b < FLEX_KEYS.length; b++) {
          if (a === -1 && b === -1) continue;
          if (a === b) continue;
          cand = tryMove(cur, a === -1 ? null : FLEX_KEYS[a], b === -1 ? null : FLEX_KEYS[b]);
          if (!cand) continue;
          sc = score(cand);
          if (sc < bestScore - 1e-9) { bestScore = sc; best = cand; }
        }
      }
      if (best) { cur = best; curScore = bestScore; improved = true; }
    }

    var t = totals(cur), vol = volumeDl(cur);
    var mixerDl = (s.mixer || 1.5) * 10;
    var rounds = Math.max(1, Math.ceil(vol / (0.75 * mixerDl) - 1e-9));
    var glasses = size === 2000 ? 3 : 4;
    while (vol / glasses > GLASS_MAX) glasses++;

    var supps = s.supps || {};
    var withSupps = {};
    for (k in t) withSupps[k] = t[k];
    SUPPS.forEach(function (sp) {
      if (supps[sp.key] === false) return;
      for (var nk in sp.adds) withSupps[nk] = (withSupps[nk] || 0) + sp.adds[nk];
    });

    return {
      size: size, target: target, steps: cur, plain: plain, totals: t, withSupps: withSupps, plainTotals: plainT,
      volume: vol, rounds: rounds, glasses: glasses, mixerDl: mixerDl,
      short: target - t.kcal > LEAVE_ALONE ? Math.round((target - t.kcal) / 10) * 10 : 0
    };
  }

  // Split the day's amounts over the rounds so every round can be measured with ordinary spoons and cups.

        if (!day || day.phase !== "pour") return;
        var id = rid(day.pos.r, day.pos.s, k);
        if (day.checked[id]) delete day.checked[id]; else day.checked[id] = true;
        save(); renderMix(); return;
      case "go": if (day) go(); return;
      case "skip": if (day) nextStep(); return;
      case "glass":
        if (!day || !day.mixedAt) return;
        day.glasses[+b.getAttribute("data-i")] = day.glasses[+b.getAttribute("data-i")] ? 0 : Date.now();
        save(); render(); return;
      case "dpearl": if (day) { day.dpearl = !day.dpearl; save(); render(); } return;
      case "out":
        if (s.missing[k]) delete s.missing[k]; else s.missing[k] = true;
        if (k === "honey" && !s.missing[k]) s.honey = true;      // marking it as back in also switches it on again
        if (k === "smp" && !s.missing[k]) s.noSmp = false;
        save(); render(); return;
      case "supp": s.supps[k] = s.supps[k] === false; save(); render(); return;
      case "size": s.size = +v; save(); render(); return;
      case "thick": s.thick = +v; save(); render(); return;
      case "honey": s.honey = !(s.honey !== false && !s.missing.honey); delete s.missing.honey; save(); render(); return;
      case "smp": s.noSmp = !s.noSmp && !s.missing.smp; delete s.missing.smp; save(); render(); return;
      case "mixer": s.mixer = +v; save(); render(); return;
      case "milk": s.milk15 = v === "1"; save(); render(); return;
      case "grams": s.grams = v === "1"; save(); render(); return;
      case "reset": s.size = 3000; s.thick = 0; s.honey = true; s.noSmp = false; s.milk15 = false; s.missing = {}; save(); render(); window.scrollTo(0, 0); return;
      case "per": state.perGlass = v === "1"; save(); render(); return;
      case "days": state.shop.days = Math.min(14, Math.max(1, state.shop.days + (+v))); save(); render(); return;
      case "have": if (state.shop.have[k]) delete state.shop.have[k]; else state.shop.have[k] = true; save(); render(); return;
      case "copy":
        copy(shopText(shopItems(S.build(s), state.shop.days), state.shop.days), function (ok) {
          renderShop(ok ? "Listan är kopierad." : "Det gick inte att kopiera härifrån.");
        });
        return;
    }
  });

  // A new day, or coming back to the phone in the middle of a timer.
  function wakeUp() {
    var was = state.day ? state.day.date : "";
    rollDay();
    if (was && !state.day && mixOpen) closeMix();
    if (state.day && state.day.timer && !state.day.mixedAt) { if (mixOpen) startTick(); else if (Date.now() >= state.day.timer.end) nextStep(); }
    if (mixOpen) keepAwake(true);
    if (!mixOpen) render();
  }
  document.addEventListener("visibilitychange", function () { if (!document.hidden) wakeUp(); });
  window.addEventListener("pageshow", wakeUp);
  setInterval(function () { if (state.day && state.day.date !== today()) wakeUp(); }, 60000);

  rollDay();
  if (state.day && state.day.timer && !state.day.mixedAt && Date.now() >= state.day.timer.end) { mixOpen = false; nextStep(); }
  render();
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () { /* online only then */ }); });
  }
})();
</script>
