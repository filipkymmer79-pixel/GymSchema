<style>
/* Layout: one narrow column for a phone. A sticky strip of segments, one per task,
   sits over a numbered checklist; the task to do now is the single lit row.
   The list itself is plain text the owner writes or dictates, kept on the phone only. */
:root {
  --bg: #F3F5FA;        /* snow with a little blue in it */
  --ink: #0D1530;       /* night-blue ink */
  --muted: #5B6584;
  --line: #D9DEEC;      /* hairlines, empty segments */
  --edge: #B4BDD6;      /* outlines of things you tap */
  --done: #7C86A3;      /* crossed-off text */
  --field: #FFFFFF;     /* the text box */
  --band: #0B1226;      /* behind the phone's clock and battery */
  --lamp: #FFB627;      /* the lit window: now, and done marks */
  --lamp-ink: #1B1300;
  --lamp-soft: rgba(27, 19, 0, 0.64);
  --lamp-edge: rgba(27, 19, 0, 0.45);
  --lamp-line: rgba(27, 19, 0, 0.24);
  --mark: var(--lamp);
  --mark-ink: var(--lamp-ink);
  /* Important lines: the gold that glows */
  --gold: #C98A12;
  --gold-hi: #FFD36B;
  --gold-grad: linear-gradient(135deg, #FFE7A3 0%, #F2B734 42%, #C98A12 68%, #FFD877 100%);
  --gold-ink: #2A1A05;      /* text on gold */
  --glow: rgba(255, 176, 32, 0.42);
  --vip-bg: rgba(255, 182, 39, 0.10);
  --vip-ink: var(--ink);
  --font-display: "Bricolage Grotesque", "Arial Narrow", "Helvetica Neue", system-ui, sans-serif;
  --font-body: "Instrument Sans", "Helvetica Neue", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "DM Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0B1226; --ink: #EDF0FA; --muted: #98A2C3; --line: #1F2947;
    --edge: #3B4878; --done: #6F7A9C; --field: #121A33; --lamp: #FFBE3D;
    --gold: #FFC24D; --glow: rgba(255, 190, 61, 0.40); --vip-bg: rgba(255, 190, 61, 0.09); --vip-ink: #FFE6AE;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body {
  margin: 0;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 1.0625rem;
  line-height: 1.3;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--band);
}
button, textarea { font: inherit; color: inherit; }
.page {
  max-width: 34rem;
  margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 1.375rem 6.5rem;
}

/* Header */
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; padding-bottom: 0.875rem; }
.headtext { display: grid; gap: 0.5rem; min-width: 0; }
.pup {
  flex: none;
  width: 3.5rem;
  height: 3.5rem;
  margin: 0 4px 4px 0;
  border-radius: 50%;
  object-fit: cover;
  box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--lamp);
}
.eyebrow {
  margin: 0;
  font: 500 0.75rem/1 var(--font-mono);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}
h1 {
  margin: 0;
  font: 800 clamp(2.25rem, 10.5vw, 3.25rem)/0.95 var(--font-display);
  letter-spacing: -0.02em;
  text-wrap: balance;
}

/* Buttons */
.btn {
  min-height: 3rem;
  padding: 0 1.125rem;
  border: 1.5px solid var(--edge);
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.btn.primary { border-color: var(--lamp); background: var(--lamp); color: var(--lamp-ink); }
.btn.small { min-height: 2.5rem; padding: 0 0.875rem; font-size: 0.9375rem; }

/* Writing the list */
.compose { display: grid; gap: 0.75rem; padding-top: 0.25rem; }
.lede { margin: 0; color: var(--muted); font-size: 1rem; line-height: 1.4; }
textarea {
  display: block;
  width: 100%;
  min-height: 17rem;
  padding: 0.875rem;
  border: 1.5px solid var(--edge);
  border-radius: 1rem;
  background: var(--field);
  color: var(--ink);
  font-size: 1.0625rem;
  line-height: 1.45;
  resize: vertical;
}
textarea::placeholder { color: var(--done); }
.hint { margin: 0; font: 400 0.75rem/1.5 var(--font-mono); color: var(--muted); }
.ask { display: grid; gap: 0.5rem; }
a.btn { display: flex; align-items: center; justify-content: center; text-decoration: none; }
.actions { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.actions .primary { flex: 1; }
.msg { margin: 0; min-height: 1.4em; font-size: 0.9375rem; font-weight: 600; line-height: 1.4; color: var(--ink); }

/* A list left over from another day */
.old {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  margin-bottom: 0.5rem;
  padding: 0.5rem 0.5rem 0.5rem 0.875rem;
  border: 1.5px solid var(--edge);
  border-radius: 1rem;
  font-size: 0.9375rem;
}
.old .btn { flex: none; }

/* Sticky progress strip */
.bar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  display: grid;
  gap: 0.625rem;
  padding-block: 0.625rem 0.75rem;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.segs { display: flex; gap: 6px; min-height: 7px; }
.segs:empty { display: none; }
.segs > span { display: flex; gap: 2px; min-width: 0; }
.segs i {
  flex: 1 1 0%;
  height: 7px;
  border-radius: 2px;
  background: var(--line);
  transition: background-color 0.2s ease;
}
.segs i.on { background: var(--lamp); }
.segs i.cur { background: var(--ink); }
.barrow { display: flex; align-items: center; gap: 0.75rem; }
.nowbtn {
  flex: 1;
  min-width: 0;
  min-height: 2rem;
  display: flex;
  align-items: center;
  gap: 0.625rem;
  margin: 0;
  padding: 0;
  border: 0;
  border-radius: 0.5rem;
  background: none;
  text-align: left;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.tag {
  flex: none;
  padding: 0.3125rem 0.4375rem 0.25rem;
  border-radius: 0.375rem;
  background: var(--lamp);
  color: var(--lamp-ink);
  font: 500 0.6875rem/1 var(--font-mono);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.nowtext { min-width: 0; font: 700 1.0625rem/1.2 var(--font-display); overflow-wrap: anywhere; }
.count {
  flex: none;
  font: 500 0.9375rem/1 var(--font-mono);
  font-variant-numeric: tabular-nums;
  color: var(--muted);
}
.count b { font-weight: 500; color: var(--ink); }

/* Sections */
main { display: grid; gap: 1.625rem; padding-top: 1.375rem; }
section.block { display: grid; gap: 0.5rem; }
.sec {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 0.75rem;
  margin: 0;
  padding-inline: 0.75rem;
  font: 500 0.75rem/1.2 var(--font-mono);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}
.sec .num { flex: none; letter-spacing: 0.02em; font-variant-numeric: tabular-nums; }
.rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }

/* One task */
.task { position: relative; border-radius: 1rem; transition: background-color 0.2s ease; }
.chk {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: 0;
  opacity: 0;
  overflow: hidden;
  clip-path: inset(50%);
}
.task > label,
.ghead {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  min-height: 3.125rem;
  padding: 0.375rem 0.75rem;
}
.task > label,
.opt label {
  cursor: pointer;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.dot {
  position: relative;
  flex: none;
  display: grid;
  place-items: center;
  width: 1.875rem;
  height: 1.875rem;
  border: 1.5px solid var(--edge);
  border-radius: 50%;
  font: 500 0.75rem/1 var(--font-mono);
  font-variant-numeric: tabular-nums;
  color: var(--muted);
  transition: background-color 0.15s ease, border-color 0.15s ease;
}
.dot::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  width: 0.7rem;
  height: 0.36rem;
  border-left: 2px solid var(--mark-ink);
  border-bottom: 2px solid var(--mark-ink);
  transform: translate(-50%, -68%) rotate(-45deg);
  opacity: 0;
}
.txt { flex: 1; min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
.note {
  display: block;
  margin-top: 0.1875rem;
  font-size: 0.8125rem;
  font-weight: 500;
  line-height: 1.3;
  color: var(--muted);
}

.task.is-done .dot { background: var(--mark); border-color: var(--mark); color: transparent; }
.task.is-done .dot::after { opacity: 1; }
.task.is-done .txt {
  color: var(--done);
  text-decoration: line-through;
  text-decoration-thickness: 1.5px;
}
.task.is-done .note { color: var(--done); }

/* The task to do now: the one lit row. Its children read the lamp tokens. */
.task.now {
  background: var(--lamp);
  color: var(--lamp-ink);
  --ink: var(--lamp-ink);
  --muted: var(--lamp-soft);
  --edge: var(--lamp-edge);
  --line: var(--lamp-line);
  --done: var(--lamp-soft);
  --mark: var(--lamp-ink);
  --mark-ink: var(--lamp);
}
.task.now .dot { border-color: var(--lamp-ink); color: var(--lamp-ink); }
.task.now .txt { font-weight: 700; }
.task.now > label::after {
  content: "Nu";
  flex: none;
  font: 500 0.6875rem/1 var(--font-mono);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

/* A task with parts of its own */
.gcount {
  flex: none;
  font: 500 0.8125rem/1 var(--font-mono);
  font-variant-numeric: tabular-nums;
  color: var(--muted);
}
.gbody { padding: 0 0.75rem 0.875rem 3.375rem; }
.opts {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(8.25rem, 1fr));
  gap: 0 0.5rem;
}
.opt { position: relative; min-width: 0; }
.opt.wide { grid-column: 1 / -1; }
.opt label {
  display: flex;
  align-items: center;
  gap: 0.5625rem;
  min-height: 2.5rem;
  font-size: 0.9375rem;
  font-weight: 600;
  color: var(--ink);
  overflow-wrap: anywhere;
}
.opt label::before {
  content: "";
  flex: none;
  width: 1.125rem;
  height: 1.125rem;
  border: 1.5px solid var(--edge);
  border-radius: 50%;
  transition: background-color 0.15s ease, border-color 0.15s ease;
}
.opt .chk:checked + label { color: var(--done); text-decoration: line-through; }
.opt .chk:checked + label::before { background: var(--mark); border-color: var(--mark); }

/* Many notes fold away under their task */
.more { padding: 0 0.75rem 0.75rem 3.375rem; margin-top: -0.25rem; }
.more summary {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  min-height: 2.25rem;
  list-style: none;
  border-radius: 0.5rem;
  font: 500 0.8125rem/1 var(--font-mono);
  font-variant-numeric: tabular-nums;
  color: var(--muted);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.more summary::-webkit-details-marker { display: none; }
.more summary::before {
  content: "+";
  flex: none;
  display: grid;
  place-items: center;
  width: 1.125rem;
  height: 1.125rem;
  border: 1.5px solid var(--edge);
  border-radius: 50%;
  line-height: 1;
}
.more[open] summary::before { content: "\2212"; }
.cart { list-style: none; margin: 0.375rem 0 0; padding: 0; display: grid; gap: 0.5rem; }
.cart li {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 0.75rem;
  font-size: 0.875rem;
  line-height: 1.3;
}
.cart span { min-width: 0; overflow-wrap: anywhere; }
.cart b {
  flex: none;
  font: 500 0.8125rem/1.3 var(--font-mono);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.cart .sum { padding-top: 0.5rem; border-top: 1px solid var(--line); font-weight: 700; }

/* Things with no order: no numbers, outside the strip and the count */
.secnote { margin: 0 0.75rem; font-size: 0.875rem; line-height: 1.35; color: var(--muted); }

.foot { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 2rem; }
.foot .btn { flex: 1; }

/* Shopping list: add one more thing without opening the editor */
.add { display: flex; gap: 0.5rem; padding-top: 0.875rem; }
.add input {
  flex: 1;
  min-width: 0;
  min-height: 2.75rem;
  padding: 0 1rem;
  border: 1.5px solid var(--edge);
  border-radius: 999px;
  background: var(--field);
  color: var(--ink);
  font: inherit;
}
.add input::placeholder { color: var(--done); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* The two lists: the day and the shopping */
.tabs {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 6;
  display: flex;
  justify-content: center;
  gap: 0.5rem;
  padding: 0.5rem max(16px, env(safe-area-inset-right, 0px)) calc(0.5rem + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: var(--bg);
  border-top: 1px solid var(--line);
}
.tab {
  flex: 1;
  max-width: 16rem;
  min-height: 2.75rem;
  border: 1.5px solid var(--edge);
  border-radius: 999px;
  background: transparent;
  color: var(--muted);
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.tab[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); }

/* Keyboard focus */
.chk:focus-visible + label,
.btn:focus-visible,
.tab:focus-visible,
.add input:focus-visible,
.nowbtn:focus-visible,
textarea:focus-visible,
.more summary:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.task > .chk:focus-visible + label { outline-offset: -3px; border-radius: 1rem; }

/* Important lines glow gold. A note under the line that says so ("> Viktigt",
   "> Ett måste i dag"), or a star in the line itself, makes it important. */
.task.vip:not(.now) { background: var(--vip-bg); }
.task.vip::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  box-shadow: inset 0 0 0 1.5px var(--gold), 0 0 14px 1px var(--glow), 0 0 34px 4px var(--glow);
  animation: breathe 2.8s ease-in-out infinite alternate;
}
@keyframes breathe { from { opacity: 0.45; } to { opacity: 1; } }
.task.vip:not(.now):not(.is-done) .txt { color: var(--vip-ink); }
.task.vip:not(.now):not(.is-done) .dot { border-color: var(--gold); color: var(--gold); }
.task.vip:not(.now) .opt label::before { border-color: var(--gold); }
.task.vip.is-done:not(.now) { background: transparent; }
.task.vip.is-done::before { animation: none; opacity: 0.4; box-shadow: inset 0 0 0 1px var(--gold); }
.later .task.vip::before { animation: none; opacity: 0.6; }
/* The badge is an inline box on a line of its own, so a crossed-off line does not cross it out */
.vipline { display: block; margin-top: 0.4375rem; }
.vipnote {
  display: inline-flex;
  align-items: center;
  gap: 0.375em;
  max-width: 100%;
  padding: 0.3125rem 0.625rem 0.25rem;
  border-radius: 999px;
  background: var(--gold-grad);
  background-size: 220% 100%;
  color: var(--gold-ink);
  font: 700 0.6875rem/1.2 var(--font-mono);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  text-decoration: none;
  box-shadow: 0 0 12px var(--glow);
  animation: sheen 3.4s ease-in-out infinite;
}
.vipnote::before { content: "\2605"; flex: none; }
@keyframes sheen { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
.task.vip.is-done .vipnote { background: none; color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); animation: none; }
.task.vip.now .vipnote { background: var(--gold-ink); color: var(--gold-hi); box-shadow: none; animation: none; }
.nowbtn.vip .tag { background: var(--gold-grad); color: var(--gold-ink); box-shadow: 0 0 12px var(--glow); }
.segs i.vip:not(.on):not(.cur) { background: transparent; box-shadow: inset 0 0 0 1.5px var(--gold); }
.segs i.vip.on, .segs i.vip.cur { box-shadow: 0 0 8px var(--glow); }

/* The important ones gathered at the top; a tap jumps to the line */
.vipcard {
  display: grid;
  gap: 0.25rem;
  padding: 0.875rem 0.875rem 0.375rem;
  border-radius: 1rem;
  background: var(--vip-bg);
  box-shadow: inset 0 0 0 1px var(--gold), 0 0 26px -6px var(--glow);
}
.vipcard h2 {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 0.75rem;
  margin: 0;
  font: 500 0.75rem/1.2 var(--font-mono);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--gold);
}
.vipcard h2 .num { flex: none; letter-spacing: 0.02em; font-variant-numeric: tabular-nums; }
.vipcard.alldone h2 .num::after { content: " \2713"; }
.vipcard ol { list-style: none; margin: 0; padding: 0; display: grid; }
.vipcard button {
  width: 100%;
  min-height: 2.75rem;
  display: flex;
  align-items: center;
  gap: 0.625rem;
  margin: 0;
  padding: 0.25rem 0;
  border: 0;
  background: none;
  color: var(--vip-ink);
  font-weight: 600;
  text-align: left;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.vipcard .vt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.vipcard .star {
  flex: none;
  display: grid;
  place-items: center;
  width: 1.5rem;
  height: 1.5rem;
  border-radius: 50%;
  box-shadow: inset 0 0 0 1.5px var(--gold);
  color: var(--gold);
  font-size: 0.75rem;
  line-height: 1;
}
.vipcard .go { flex: none; padding-right: 0.125rem; font: 500 0.875rem/1 var(--font-mono); color: var(--muted); }
.vipcard li.done button { color: var(--done); text-decoration: line-through; text-decoration-color: var(--gold); }
.vipcard li.done .star { background: var(--gold-grad); color: var(--gold-ink); box-shadow: none; }
.vipcard li.done .go { visibility: hidden; }

/* An important line that gets done answers in gold: sparks, a flash, a short note */
.task.flash { animation: flash 1.2s ease-out; }
@keyframes flash {
  0% { box-shadow: 0 0 0 0 rgba(0, 0, 0, 0); }
  25% { box-shadow: 0 0 0 3px var(--gold-hi), 0 0 44px 12px var(--glow); }
  100% { box-shadow: 0 0 0 0 rgba(0, 0, 0, 0); }
}
.spark {
  position: fixed;
  z-index: 40;
  width: 9px;
  height: 9px;
  margin: -4.5px 0 0 -4.5px;
  border-radius: 50%;
  pointer-events: none;
  background: radial-gradient(circle, #FFFBEA 0 22%, var(--gold-hi) 40%, rgba(255, 200, 90, 0) 72%);
  animation: spark 0.75s cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
}
.spark.star {
  width: 14px;
  height: 14px;
  margin: -7px 0 0 -7px;
  background: none;
  color: var(--gold-hi);
  font: 400 13px/14px system-ui, sans-serif;
  text-align: center;
  text-shadow: 0 0 6px var(--glow);
}
@keyframes spark {
  0% { transform: translate(0, 0) scale(0.3) rotate(0deg); opacity: 1; }
  65% { opacity: 1; }
  100% { transform: translate(var(--dx), var(--dy)) scale(var(--s, 1)) rotate(var(--r, 0deg)); opacity: 0; }
}
.toast {
  position: fixed;
  z-index: 41;
  left: 50%;
  bottom: calc(5.25rem + env(safe-area-inset-bottom, 0px));
  width: max-content;
  max-width: calc(100vw - 2rem);
  padding: 0.75rem 1.25rem;
  border-radius: 999px;
  background: var(--band);
  color: var(--gold-hi);
  font: 700 1.0625rem/1.2 var(--font-display);
  text-align: center;
  box-shadow: inset 0 0 0 1px var(--gold), 0 0 28px var(--glow);
  pointer-events: none;
  transform: translate(-50%, 0);
  animation: toast 2.8s ease forwards;
}
@keyframes toast {
  0% { opacity: 0; transform: translate(-50%, 12px); }
  12%, 80% { opacity: 1; transform: translate(-50%, 0); }
  100% { opacity: 0; transform: translate(-50%, -6px); }
}

.vipcard button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 0.5rem; }

@keyframes pop { 40% { transform: scale(1.22); } }
.task.pop .dot { animation: pop 0.28s ease; }
@media (prefers-reduced-motion: reduce) {
  .task, .dot, .segs i, .opt label::before { transition: none; }
  .task.pop .dot { animation: none; }
  .task.vip::before { animation: none; opacity: 0.9; }
  .task.vip.is-done::before { opacity: 0.4; }
  .vipnote, .task.flash { animation: none; }
  .spark { display: none; }
  .toast { animation: none; }
}
</style>
</head>
<body>
<div class="page">
  <header class="head">
    <div class="headtext">
      <p class="eyebrow" id="dayLabel">Dagsschema</p>
      <h1 id="title">Idag</h1>
    </div>
    <img class="pup" src="kira-192.png" alt="Kira" width="56" height="56">
  </header>

  <section class="compose" id="compose" hidden>
    <label class="lede" id="lede" for="src">Skriv, diktera eller klistra in allt du ska göra idag. En sak per rad, i vilken ordning som helst.</label>
    <textarea id="src" spellcheck="false" autocapitalize="sentences" placeholder="Äta frukost&#10;Gå med hunden&#10;Betala räkningar"></textarea>
    <p class="hint" id="vipHint">Skriv &gt; Viktigt på raden under något, så lyser det guld.</p>
    <div class="ask">
      <a class="btn" id="askBtn" href="https://claude.ai/new" target="_blank" rel="noopener">Ordna med Claude</a>
      <p class="hint" id="askHint">Claude lägger listan i bra ordning. Kopiera svaret, kom tillbaka hit och tryck Klistra in.</p>
    </div>
    <div class="actions">
      <button type="button" class="btn" id="pasteBtn">Klistra in</button>
      <button type="button" class="btn primary" id="makeBtn">Gör schema</button>
      <button type="button" class="btn" id="cancelBtn" hidden>Avbryt</button>
    </div>
    <p class="msg" id="msg" role="status"></p>
  </section>

  <div id="sched" hidden>
    <div class="old" id="old" hidden>
      <span id="oldText"></span>
      <button type="button" class="btn small" id="oldNew">Ny dag</button>
    </div>
    <div class="bar">
      <div class="segs" id="segs" aria-hidden="true"></div>
      <div class="barrow">
        <button type="button" class="nowbtn" id="nowBtn">
          <span class="tag" id="nowTag">Nu</span><span class="nowtext" id="nowText"></span>
        </button>
        <span class="count"><b id="doneN">0</b>/<span id="totalN">0</span></span>
      </div>
    </div>
    <form class="add" id="addForm" hidden>
      <label class="vh" for="addInput">Lägg till vara</label>
      <input id="addInput" type="text" placeholder="Lägg till vara" autocomplete="off" enterkeyhint="done">
      <button type="submit" class="btn small">Lägg till</button>
    </form>
    <main id="list"></main>
    <div class="foot">
      <button type="button" class="btn" id="editBtn">Ändra listan</button>
      <button type="button" class="btn" id="newBtn">Ny dag</button>
      <button type="button" class="btn" id="clearBtn" hidden>Rensa avbockade</button>
    </div>
  </div>
</div>

<nav class="tabs" aria-label="Listor">
  <button type="button" class="tab" id="tabDay" aria-pressed="true">Idag</button>
  <button type="button" class="tab" id="tabShop" aria-pressed="false">Handla</button>
</nav>

<script>
(function () {
  "use strict";

  // Two lists share this screen: the day ("day") and the shopping list ("shop").
  var KEYS = { day: "dagsschema.v1", shop: "dagsschema.handla.v1" };
  var UIKEYS = { day: "dagsschema.ui", shop: "dagsschema.handla.ui" };
  var TABKEY = "dagsschema.tab";
  var WEEKDAYS = ["Söndag", "Måndag", "Tisdag", "Onsdag", "Torsdag", "Fredag", "Lördag"];
  var MONTHS = ["januari", "februari", "mars", "april", "maj", "juni", "juli", "augusti",
                "september", "oktober", "november", "december"];
  var FIRST = "Skriv, diktera eller klistra in allt du ska göra idag. En sak per rad, i vilken ordning som helst.";
  var LEFT = "Det här blev kvar. Ta bort det du inte vill ha med och fyll på med dagens.";
  var EDIT = "Ändra, lägg till eller ta bort rader. Det du har bockat av ligger kvar.";
  var PASTE_HELP = "Håll fingret i rutan och välj Klistra in.";
  var ASKED = "Listan är kopierad. Klistra in den i Claude och skicka. Kopiera sedan svaret, kom tillbaka hit och tryck Klistra in.";
  var BACK = "Kopiera Claudes svar och tryck Klistra in.";
  // What Claude is asked to do with the messy list. The answer comes back in the
  // plain format parse() reads, so it can be pasted straight in.
  var ASK_HEAD = "Ordna min lista för idag så att den blir lätt att följa.";
  var ASK_RULES = [
    "Svara bara med listan i ett kodblock, ingen annan text. Regler:",
    "- En sak per rad, i den ordning jag ska göra dem.",
    "- Använd mina egna ord. Rätta stavfel, men lägg inte till och ta inte bort något.",
    "- Dela upp listan med rubriker som börjar med \"# \", till exempel \"# Först\", \"# Kvällen\" och \"# Sist\".",
    "- Sådant som inte har någon ordning eller tid läggs sist under rubriken \"# Bra att ha\".",
    "- Sådant som ska göras längre fram, inte i dag, läggs allra sist under rubriken \"# Längre fram\".",
    "- Hör flera småsaker ihop, skriv dem som delsaker under en rad, med \"- \" först på raden.",
    "- Rader som börjar med \"> \" hör till raden ovanför. Låt dem ligga kvar under den raden.",
    "- Står det att något är viktigt eller ett måste, skriv det på en egen rad under, med \"> \" först, till exempel \"> Viktigt\"."
  ].join("\n");
  var SHOP_HEAD = "Sortera min handlingslista så att den blir lätt att följa i butiken.";
  var SHOP_RULES = [
    "Svara bara med listan i ett kodblock, ingen annan text. Regler:",
    "- En vara per rad. Använd mina egna ord. Rätta stavfel, men lägg inte till och ta inte bort något.",
    "- Dela upp listan efter var i butiken varorna står, med rubriker som börjar med \"# \", till exempel \"# Frukt och grönt\", \"# Mejeri\", \"# Kött och fisk\", \"# Skafferi\" och \"# Frys\".",
    "- Sådant som köps någon annanstans, till exempel på apotek, får en egen rubrik."
  ].join("\n");
  var WORDS = {
    day: {
      first: FIRST,
      edit: EDIT,
      sample: "Äta frukost\nGå med hunden\nBetala räkningar",
      ask: "Ordna med Claude",
      askHint: "Claude lägger listan i bra ordning. Kopiera svaret, kom tillbaka hit och tryck Klistra in.",
      make: "Gör schema",
      fresh: "Ny dag"
    },
    shop: {
      first: "Skriv, diktera eller klistra in det du ska köpa. En vara per rad.",
      edit: "Ändra, lägg till eller ta bort varor. Det du har bockat av ligger kvar.",
      sample: "Mjölk\nÄgg\nBananer",
      ask: "Sortera med Claude",
      askHint: "Claude sorterar varorna efter var de står i butiken. Kopiera svaret, kom tillbaka hit och tryck Klistra in.",
      make: "Gör lista",
      fresh: "Handla"
    }
  };
  function isAsk(t) { return t.indexOf(ASK_HEAD) === 0 || t.indexOf(SHOP_HEAD) === 0; }

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  var dayLabel = $("dayLabel"), title = $("title");
  var compose = $("compose"), lede = $("lede"), src = $("src"), msg = $("msg");
  var pasteBtn = $("pasteBtn"), makeBtn = $("makeBtn"), cancelBtn = $("cancelBtn"), askBtn = $("askBtn");
  var sched = $("sched"), old = $("old"), oldText = $("oldText");
  var segsEl = $("segs"), listEl = $("list");
  var nowBtn = $("nowBtn"), nowTag = $("nowTag"), nowText = $("nowText");
  var doneN = $("doneN"), totalN = $("totalN");
  var askHint = $("askHint"), addForm = $("addForm"), addInput = $("addInput");
  var newBtn = $("newBtn"), clearBtn = $("clearBtn"), tabDay = $("tabDay"), tabShop = $("tabShop");
  var vipHint = $("vipHint");

  // Everything lives on this phone: each list as plain text, its day, and what is ticked.
  function loadStore(k) {
    var st = { text: "", day: "", done: {} };
    try {
      var raw = JSON.parse(localStorage.getItem(k) || "null");
      if (raw && typeof raw.text === "string") {
        st.text = raw.text;
        st.day = typeof raw.day === "string" ? raw.day : "";
        if (raw.done && typeof raw.done === "object") st.done = raw.done;
      }
    } catch (e) { /* storage unavailable: start clean */ }
    return st;
  }
  // The half-written list and where we are, kept so a trip to Claude and back loses nothing.
  function loadUi(k) {
    var u = { compose: "", draft: "", awaiting: false };
    try {
      var raw = JSON.parse(localStorage.getItem(k) || "null");
      if (raw && typeof raw === "object") {
        u.compose = typeof raw.compose === "string" ? raw.compose : "";
        u.draft = typeof raw.draft === "string" ? raw.draft : "";
        u.awaiting = raw.awaiting === true;
      }
    } catch (e) { /* start clean */ }
    return u;
  }
  var stores = { day: loadStore(KEYS.day), shop: loadStore(KEYS.shop) };
  var uis = { day: loadUi(UIKEYS.day), shop: loadUi(UIKEYS.shop) };
  var tab = "day";
  try { if (localStorage.getItem(TABKEY) === "shop") tab = "shop"; } catch (e) { /* day it is */ }
  var store = stores[tab], ui = uis[tab];
  function save() {
    try { localStorage.setItem(KEYS[tab], JSON.stringify(store)); } catch (e) { /* fine without it */ }
  }
  function saveUi() {
    try { localStorage.setItem(UIKEYS[tab], JSON.stringify(ui)); } catch (e) { /* fine without it */ }
  }
  function clearUi() { ui = uis[tab] = { compose: "", draft: "", awaiting: false }; saveUi(); }

  // The day turns over at 04:00, so a late night still counts as today.
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function today() {
    var t = new Date(Date.now() - 4 * 3600 * 1000);
    return t.getFullYear() + "-" + pad(t.getMonth() + 1) + "-" + pad(t.getDate());
  }
  function asDate(day) { var p = day.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function longDay(day) {
    var d = asDate(day);
    return WEEKDAYS[d.getDay()] + " " + d.getDate() + " " + MONTHS[d.getMonth()];
  }
  function daysAgo(day) { return Math.round((asDate(today()) - asDate(day)) / 86400000); }

  // Text -> sections of tasks. Written to take a list straight from a chat as well.
  //   "# Rubrik" or "**Rubrik**"  starts a section. One called "Bra att ha", "Utan ordning"
  //                               or "När det passar" has no order: no numbers, not in the count.
  //   "- delsak"                  is a part of the task above, with a box of its own. In a section
  //                               written as a bullet list the bullets are the tasks themselves,
  //                               and indented bullets are their parts.
  //   "> rad"                     is a note under the task above
  //   "[x] "                      in front of a task or part means it is already done
  var LOOSE = /bra att ha|utan ordning|när det passar|om jag hinner|längre fram/i;
  var LATER = /längre fram/i;   // plans for later: shown, but not part of today
  // Important lines glow gold: a note under the line that says so ("> Viktigt",
  // "> Ett måste i dag", "> Otroligt viktigt"), or a star or "viktig" in the line itself.
  var VIP = /viktig|måste|prio|akut|bråttom|deadline/i;
  var VIP_TEXT = /★|⭐|viktig/i;
  function isVip(t) {
    return VIP_TEXT.test(t.text) || t.notes.some(function (n) { return VIP.test(n); });
  }
  function norm(s) { return s.toLowerCase().replace(/\s+/g, " ").trim(); }
  function plain(s) {
    return s.replace(/\*\*(.+?)\*\*/g, "$1").replace(/__(.+?)__/g, "$1").replace(/`([^`]+)`/g, "$1").trim();
  }
  function parse(text) {
    var sections = [], sec = null, task = null, seen = {};
    var lines = String(text || "").split(/\r?\n/);
    var BULLET = /^[-–•*]\s+(.*)$/, NUMBER = /^\d{1,3}[.)]\s+/;
    function key(prefix, t) {
      var base = prefix + norm(t);
      seen[base] = (seen[base] || 0) + 1;
      return base + "#" + seen[base];
    }
    function mark(line) {
      var m = line.match(/^\[([xX ]?)\]\s*/);
      if (!m) return { text: line.trim(), done: false };
      return { text: line.slice(m[0].length).trim(), done: /x/i.test(m[1]) };
    }
    function listAhead(i) {
      for (var j = i + 1; j < lines.length; j++) {
        var l = lines[j].trim();
        if (l) return BULLET.test(l) || NUMBER.test(l);
      }
      return false;
    }
    function open(title) {
      sec = { title: title, loose: LOOSE.test(title), bullets: false, tasks: [] };
      sections.push(sec);
      task = null;
    }
    function addTask(str) {
      var it = mark(plain(str));
      if (!it.text) return;
      if (!sec) open("");
      task = { text: it.text, done0: it.done, key: key("t:", it.text), subs: [], notes: [] };
      sec.tasks.push(task);
    }
    lines.forEach(function (rawLine, i) {
      var indented = /^(\s{2,}|\t)/.test(rawLine);
      var line = rawLine.trim(), m, it;
      if (!line || /^```/.test(line) || /^([-*_])\1{2,}$/.test(line)) return;
      if ((m = line.match(/^#+\s*(.*)$/))) { open(plain(m[1]).replace(/:$/, "")); return; }
      if ((m = line.match(/^(\*\*|__)(.+?)\1:?$/))) { open(m[2].trim().replace(/:$/, "")); return; }
      if (/:$/.test(line) && line.length <= 40 && !BULLET.test(line) && !NUMBER.test(line) &&
          line.charAt(0) !== ">" && listAhead(i)) {
        open(plain(line.replace(/:$/, "")));
        return;
      }
      if (task && (m = line.match(/^>\s*(.*)$/))) {
        if (m[1].trim()) task.notes.push(plain(m[1]));
        return;
      }
      if ((m = line.match(BULLET))) {
        if (task && (indented || !(sec && sec.bullets))) {
          it = mark(plain(m[1]));
          if (it.text) task.subs.push({ text: it.text, done0: it.done, key: key(task.key + ">", it.text) });
        } else {
          if (!sec) open("");
          sec.bullets = true;
          addTask(m[1]);
        }
        return;
      }
      addTask(line.replace(/^>\s*/, "").replace(NUMBER, ""));
    });
    return sections.filter(function (s) { return s.tasks.length; });
  }
  function isDone(t) {
    if (!t.subs.length) return store.done[t.key] === true;
    return t.subs.every(function (u) { return store.done[u.key] === true; });
  }
  // Sections -> the same plain text. onlyOpen keeps what is still left to do.
  function toText(sections, onlyOpen) {
    var out = [];
    sections.forEach(function (s) {
      var lines = [];
      s.tasks.forEach(function (t) {
        if (onlyOpen && isDone(t)) return;
        lines.push(t.text);
        t.subs.forEach(function (u) {
          if (onlyOpen && store.done[u.key] === true) return;
          lines.push("- " + u.text);
        });
        t.notes.forEach(function (n) { lines.push("> " + n); });
      });
      if (!lines.length) return;
      if (s.title) out.push("# " + s.title);
      out = out.concat(lines);
    });
    return out.join("\n");
  }

  // Build the list
  var model = [], tasks = [], groups = [], nowTask = null, idSeq = 0;

  function box(k) {
    var input = el("input", "chk");
    input.type = "checkbox";
    input.id = "c" + (++idSeq);
    input.setAttribute("data-key", k);
    return input;
  }
  // "Namn – 122 kr" splits into a name and a price column.
  function noteRow(n) {
    var li = el("li"), m = n.match(/^(.*\S)\s+[–-]\s+(\d[\d\s  ]*(?:,\d+)?\s*kr)$/);
    if (m) {
      li.appendChild(el("span", null, m[1]));
      li.appendChild(el("b", null, m[2]));
      if (/^summa$/i.test(m[1])) li.className = "sum";
    } else {
      li.appendChild(el("span", null, n));
    }
    return li;
  }
  function buildTask(t, n) {
    var li = el("li", "task"), txt = el("span", "txt"), head;
    var dot = el("span", "dot", n ? String(n) : "");
    // Notes that say the line is important become gold badges; the rest stay notes.
    // A first note that ends with ":" names the folded notes ("Så gör du:").
    var notes = [], badges = [], noteLabel = "";
    t.notes.forEach(function (note) { (VIP.test(note) ? badges : notes).push(note); });
    if (notes.length > 1 && /:$/.test(notes[0])) noteLabel = notes.shift().replace(/:$/, "");
    var foldNotes = !!noteLabel || notes.length > 2;
    txt.appendChild(el("span", "t", t.text));
    badges.forEach(function (note) {
      var line = el("span", "vipline");
      line.appendChild(el("small", "vipnote", note));
      txt.appendChild(line);
    });
    if (!foldNotes) notes.forEach(function (note) { txt.appendChild(el("small", "note", note)); });

    var vip = isVip(t);
    if (vip) li.classList.add("vip");
    var view = { t: t, el: li, boxes: [], counter: null, seg: null, done: false, loose: false,
                 vip: vip, later: false };
    if (!t.subs.length) {
      var input = box(t.key);
      head = el("label");
      head.htmlFor = input.id;
      head.appendChild(dot);
      head.appendChild(txt);
      li.appendChild(input);
      li.appendChild(head);
      view.boxes.push(input);
    } else {
      head = el("div", "ghead");
      view.counter = el("span", "gcount", "0/" + t.subs.length);
      head.appendChild(dot);
      head.appendChild(txt);
      head.appendChild(view.counter);
      li.appendChild(head);
      var body = el("div", "gbody"), opts = el("div", "opts");
      t.subs.forEach(function (u) {
        var wrap = el("span", u.text.length > 14 ? "opt wide" : "opt");
        var sub = box(u.key), lab = el("label", null, u.text);
        lab.htmlFor = sub.id;
        wrap.appendChild(sub);
        wrap.appendChild(lab);
        opts.appendChild(wrap);
        view.boxes.push(sub);
      });
      body.appendChild(opts);
      li.appendChild(body);
    }
    if (foldNotes) {
      var more = el("details", "more"), cart = el("ul", "cart"), priced = 0, sum = "";
      notes.forEach(function (note) {
        var row = noteRow(note);
        if (row.className === "sum") sum = row.lastChild.textContent;
        else if (row.childNodes.length === 2) priced++;
        cart.appendChild(row);
      });
      more.appendChild(el("summary", null, noteLabel || (sum && priced ? priced + " varor · " + sum : notes.length + " rader")));
      more.appendChild(cart);
      li.appendChild(more);
    }
    return view;
  }

  // The important ones, gathered at the top. A tap goes to the line and lights it up.
  var card = null;
  function reduced() {
    return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  }
  function goTo(v) {
    var calm = reduced();
    v.el.scrollIntoView({ behavior: calm ? "auto" : "smooth", block: "center" });
    if (calm) return;
    v.el.classList.remove("flash");
    setTimeout(function () {
      v.el.classList.add("flash");
      setTimeout(function () { v.el.classList.remove("flash"); }, 1300);
    }, 350);
  }
  function buildCard(list) {
    var box = el("section", "vipcard"), h = el("h2"), num = el("span", "num"), ol = el("ol");
    box.setAttribute("aria-label", "Viktigast i dag");
    h.appendChild(el("span", null, "★ Viktigast i dag"));
    h.appendChild(num);
    box.appendChild(h);
    var rows = list.map(function (v) {
      var li = el("li"), b = el("button"), star = el("span", "star", "★"), go = el("span", "go", "↓");
      b.type = "button";
      star.setAttribute("aria-hidden", "true");
      go.setAttribute("aria-hidden", "true");
      b.appendChild(star);
      b.appendChild(el("span", "vt", v.t.text));
      b.appendChild(go);
      b.addEventListener("click", function () { goTo(v); });
      li.appendChild(b);
      ol.appendChild(li);
      return { v: v, li: li, star: star };
    });
    box.appendChild(ol);
    return { el: box, num: num, rows: rows };
  }

  function render() {
    model = parse(store.text);
    tasks = [];
    groups = [];
    card = null;
    listEl.textContent = "";
    segsEl.textContent = "";
    var n = 0;
    model.forEach(function (s) {
      var loose = s.loose || tab === "shop", later = tab === "day" && LATER.test(s.title);
      var secEl = el("section", "block" + (loose ? " loose" : "") + (later ? " later" : "")), num = null;
      if (s.title) {
        var h = el("h2", "sec");
        num = el("span", "num");
        h.appendChild(el("span", null, s.title));
        h.appendChild(num);
        secEl.appendChild(h);
      }
      if (s.loose && tab === "day") secEl.appendChild(el("p", "secnote", LATER.test(s.title) ? "Inte för i dag. Bocka av när det är gjort." : "Ingen ordning. Ta dem när det passar."));
      var rows = el(loose ? "ul" : "ol", "rows"), strip = el("span"), mine = [];
      if (!loose) rows.start = n + 1;
      s.tasks.forEach(function (t) {
        var view = buildTask(t, loose ? 0 : ++n);
        view.loose = loose;
        view.later = later;
        if (!loose) {
          view.seg = el("i");
          strip.appendChild(view.seg);
        }
        rows.appendChild(view.el);
        tasks.push(view);
        mine.push(view);
      });
      if (!loose) {
        strip.style.flex = mine.length + " 1 0%";
        segsEl.appendChild(strip);
      }
      secEl.appendChild(rows);
      listEl.appendChild(secEl);
      groups.push({ num: num, tasks: mine });
    });
    if (tab === "day") {
      var vips = tasks.filter(function (v) { return v.vip && !v.later; });
      if (vips.length) {
        card = buildCard(vips);
        listEl.insertBefore(card.el, listEl.firstChild);
      }
    }
    totalN.textContent = n;
    apply();
  }

  function apply() {
    var nDone = 0;
    nowTask = null;
    tasks.forEach(function (v) {
      var c = 0;
      v.boxes.forEach(function (b) {
        var on = store.done[b.getAttribute("data-key")] === true;
        if (b.checked !== on) b.checked = on;
        if (on) c++;
      });
      v.done = c === v.boxes.length;
      if (!v.loose) {
        if (v.done) nDone++;
        else if (!nowTask) nowTask = v;
      }
      if (v.counter) v.counter.textContent = c + "/" + v.boxes.length;
    });
    tasks.forEach(function (v) {
      var cur = v === nowTask;
      v.el.classList.toggle("is-done", v.done);
      v.el.classList.toggle("now", cur);
      if (cur) v.el.setAttribute("aria-current", "step");
      else v.el.removeAttribute("aria-current");
      if (v.seg) v.seg.className = (v.done ? "on" : cur ? "cur" : "") + (v.vip ? " vip" : "");
    });
    groups.forEach(function (g) {
      if (!g.num) return;
      var d = g.tasks.filter(function (v) { return v.done; }).length;
      g.num.textContent = d + "/" + g.tasks.length;
    });
    if (card) {
      var vd = 0;
      card.rows.forEach(function (r) {
        r.li.classList.toggle("done", r.v.done);
        r.star.textContent = r.v.done ? "✓" : "★";
        if (r.v.done) vd++;
      });
      card.num.textContent = vd + "/" + card.rows.length;
      card.el.classList.toggle("alldone", vd === card.rows.length);
    }
    nowBtn.classList.toggle("vip", tab === "day" && !!nowTask && nowTask.vip);
    if (tab === "shop") {
      var got = tasks.filter(function (v) { return v.done; }).length, left = tasks.length - got;
      doneN.textContent = got;
      totalN.textContent = tasks.length;
      nowTag.textContent = left ? "Kvar" : "Klart";
      nowText.textContent = left ? left + (left === 1 ? " vara" : " varor") : "Allt i korgen";
      return;
    }
    doneN.textContent = nDone;
    if (nowTask) {
      nowTag.textContent = nowTask.vip ? "Nu ★" : "Nu";
      nowText.textContent = nowTask.t.text;
    } else if (!tasks.some(function (v) { return !v.loose; })) {
      nowTag.textContent = "Fritt";
      nowText.textContent = "Ta dem när det passar";
    } else {
      nowTag.textContent = "Klart";
      nowText.textContent = "Allt avbockat";
    }
  }

  // The two screens
  var mode = "first";   // "first" | "new" | "edit"

  function showSched() {
    var day = store.day || today(), ago = daysAgo(day), shop = tab === "shop";
    dayLabel.textContent = shop ? "Handlingslista" : longDay(day);
    title.textContent = shop ? "Handla" : ago <= 0 ? "Idag" : ago === 1 ? "Igår" : WEEKDAYS[asDate(day).getDay()];
    old.hidden = shop || ago <= 0;
    oldText.textContent = "Listan är från " + longDay(day).toLowerCase() + ".";
    addForm.hidden = !shop;
    clearBtn.hidden = !shop;
    newBtn.hidden = shop;
    compose.hidden = true;
    sched.hidden = false;
    render();
  }

  function showCompose(next, restore) {
    mode = next;
    var text = "";
    if (mode === "edit") text = toText(model, false);
    if (mode === "new") text = toText(model, true);
    var leftovers = mode === "new" && !!text && !restore;
    if (restore) text = ui.draft;
    else { ui.draft = text; ui.awaiting = false; }
    ui.compose = mode;
    saveUi();
    src.value = text;
    msg.textContent = ui.awaiting ? BACK : "";
    var w = WORDS[tab];
    lede.textContent = mode === "edit" ? w.edit : leftovers ? LEFT : w.first;
    dayLabel.textContent = tab === "shop" ? "Handlingslista" : mode === "edit" ? longDay(store.day || today()) : longDay(today());
    title.textContent = mode === "edit" ? "Ändra listan" : w.fresh;
    makeBtn.textContent = mode === "edit" ? "Spara" : w.make;
    src.placeholder = w.sample;
    askBtn.textContent = w.ask;
    askHint.textContent = w.askHint;
    vipHint.hidden = tab !== "day";
    cancelBtn.hidden = mode === "first";
    sched.hidden = true;
    compose.hidden = false;
    window.scrollTo(0, 0);
  }

  function commit() {
    var parsed = parse(src.value);
    if (!parsed.length) { msg.textContent = "Skriv minst en rad först."; return; }
    if (mode !== "edit") { store.done = {}; store.day = today(); }
    if (!store.day) store.day = today();
    var valid = {};
    parsed.forEach(function (s) {
      s.tasks.forEach(function (t) {
        valid[t.key] = true;
        if (t.done0 && !t.subs.length) store.done[t.key] = true;
        t.subs.forEach(function (u) {
          valid[u.key] = true;
          if (u.done0 || t.done0) store.done[u.key] = true;
        });
      });
    });
    Object.keys(store.done).forEach(function (k) { if (!valid[k]) delete store.done[k]; });
    store.text = toText(parsed, false);
    save();
    clearUi();
    showSched();
    window.scrollTo(0, 0);
  }

  makeBtn.addEventListener("click", commit);
  cancelBtn.addEventListener("click", function () { clearUi(); showSched(); });
  src.addEventListener("input", function () { ui.draft = src.value; saveUi(); });

  // Hand the messy list to Claude: the request goes on the clipboard and Claude opens.
  function askText(dump) {
    if (tab === "shop") return SHOP_HEAD + "\n\n" + SHOP_RULES + "\n\nMin lista:\n" + dump;
    var d = new Date();
    return ASK_HEAD + " Det är " + WEEKDAYS[d.getDay()].toLowerCase() + " klockan " +
      pad(d.getHours()) + ":" + pad(d.getMinutes()) + ".\n\n" + ASK_RULES + "\n\nMin lista:\n" + dump;
  }
  function copyNow(text) {
    try {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;font-size:16px";
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      document.execCommand("copy");
      document.body.removeChild(ta);
    } catch (e) { /* the clipboard call below is the other way in */ }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(function () { /* already tried above */ });
    }
  }
  askBtn.addEventListener("click", function (e) {
    var dump = src.value.trim();
    if (!dump) {
      e.preventDefault();
      msg.textContent = "Skriv listan först.";
      src.focus();
      return;
    }
    copyNow(askText(dump));
    ui.awaiting = true;
    ui.draft = src.value;
    saveUi();
    msg.textContent = ASKED;
  });
  // While Claude's answer is expected, a paste replaces the messy list instead of adding to it.
  function takeAnswer(t) {
    src.value = t;
    ui.awaiting = false;
    ui.draft = t;
    saveUi();
    msg.textContent = "Bytte till listan du kopierade.";
  }
  src.addEventListener("paste", function (e) {
    if (!ui.awaiting) return;
    var data = e.clipboardData || window.clipboardData;
    var t = data ? data.getData("text") : "";
    if (!t || !t.trim() || isAsk(t)) return;
    e.preventDefault();
    takeAnswer(t);
  });
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && ui.awaiting && !compose.hidden) msg.textContent = BACK;
  });
  $("editBtn").addEventListener("click", function () { showCompose("edit"); });
  $("newBtn").addEventListener("click", function () { showCompose("new"); });
  $("oldNew").addEventListener("click", function () { showCompose("new"); });

  // Shopping list: a new item goes on top, above the first heading.
  addForm.addEventListener("submit", function (e) {
    e.preventDefault();
    var item = addInput.value.replace(/^[#>\-–•*\s]+/, "").trim();
    if (!item) return;
    store.text = item + (store.text ? "\n" + store.text : "");
    save();
    addInput.value = "";
    render();
  });
  clearBtn.addEventListener("click", function () {
    var left = toText(model, true), valid = {};
    parse(left).forEach(function (s) {
      s.tasks.forEach(function (t) {
        valid[t.key] = true;
        t.subs.forEach(function (u) { valid[u.key] = true; });
      });
    });
    Object.keys(store.done).forEach(function (k) { if (!valid[k]) delete store.done[k]; });
    store.text = left;
    save();
    if (left) render();
    else showCompose("first");
  });

  pasteBtn.addEventListener("click", function () {
    if (!navigator.clipboard || !navigator.clipboard.readText) {
      src.focus();
      msg.textContent = PASTE_HELP;
      return;
    }
    navigator.clipboard.readText().then(function (t) {
      if (!t || !t.trim()) { msg.textContent = "Det finns inget kopierat att klistra in."; return; }
      if (isAsk(t)) { msg.textContent = "Det där är texten till Claude. Kopiera Claudes svar först."; return; }
      var have = src.value.replace(/\s+$/, "");
      // Claude's answer, or any copied list with headings, replaces what is in the box
      if (have && (ui.awaiting || /^\s*(#|\*\*|```)/.test(t))) { takeAnswer(t); return; }
      src.value = have ? have + "\n" + t : t;
      ui.awaiting = false;
      ui.draft = src.value;
      saveUi();
      msg.textContent = "";
    }, function () {
      src.focus();
      msg.textContent = PASTE_HELP;
    });
  });

  // An important line that gets done answers in gold: sparks from its box and a flash,
  // and a short note when all the important ones are done.
  function vipAllDone() { return !!card && card.rows.every(function (r) { return r.v.done; }); }
  function originOf(b) {
    var main = b.parentNode && b.parentNode.classList.contains("task");
    var target = main ? b.parentNode.querySelector(".dot") : b.nextElementSibling;
    if (!target) return null;
    var r = target.getBoundingClientRect();
    // a part's round box sits at the left of its label
    return main ? { x: r.left + r.width / 2, y: r.top + r.height / 2 } : { x: r.left + 9, y: r.top + r.height / 2 };
  }
  function wait(fn, ms) { setTimeout(fn, ms); }
  function sparks(at, count, big) {
    if (!at || reduced()) return;
    for (var i = 0; i < count; i++) {
      var star = i % 3 === 0;
      var s = el("span", star ? "spark star" : "spark", star ? "✦" : null);
      var a = (Math.PI * 2 * i) / count + Math.random() * 0.6;
      var d = (big ? 44 : 26) + Math.random() * (big ? 46 : 22);
      s.style.left = at.x + "px";
      s.style.top = at.y + "px";
      s.style.setProperty("--dx", Math.round(Math.cos(a) * d) + "px");
      s.style.setProperty("--dy", Math.round(Math.sin(a) * d) + "px");
      s.style.setProperty("--s", (0.7 + Math.random() * 0.8).toFixed(2));
      s.style.setProperty("--r", Math.round(Math.random() * 180 - 90) + "deg");
      s.setAttribute("aria-hidden", "true");
      document.body.appendChild(s);
      wait((function (n) { return function () { n.remove(); }; })(s), 900);
    }
  }
  var toastEl = null;
  function toast(text) {
    if (toastEl) toastEl.remove();
    var mine = toastEl = el("div", "toast", text);
    mine.setAttribute("role", "status");
    document.body.appendChild(mine);
    wait(function () { mine.remove(); if (toastEl === mine) toastEl = null; }, 2900);
  }
  function flash(v) {
    if (reduced()) return;
    v.el.classList.remove("flash");
    void v.el.offsetWidth;   // start the animation again
    v.el.classList.add("flash");
    wait(function () { v.el.classList.remove("flash"); }, 1300);
  }

  listEl.addEventListener("change", function (e) {
    var b = e.target;
    if (!b || !b.classList || !b.classList.contains("chk")) return;
    var k = b.getAttribute("data-key");
    var li = b.closest(".task"), view = null;
    tasks.forEach(function (v) { if (v.el === li) view = v; });
    var wasDone = !!(view && view.done), vipBefore = vipAllDone();
    if (b.checked) store.done[k] = true;
    else delete store.done[k];
    save();
    apply();
    if (li && li.classList.contains("is-done")) {
      li.classList.add("pop");
      setTimeout(function () { li.classList.remove("pop"); }, 320);
    }
    if (b.checked && view && view.vip && view.done && !wasDone) {
      sparks(originOf(b), 18, true);
      flash(view);
      if (!vipBefore && vipAllDone()) toast("\u2605 Det viktigaste är klart");
    }
  });

  nowBtn.addEventListener("click", function () {
    if (!nowTask) return;
    var calm = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    nowTask.el.scrollIntoView({ behavior: calm ? "auto" : "smooth", block: "center" });
  });

  // Open the list in front: its schedule, or the writing screen it was left on.
  function start() {
    tabDay.setAttribute("aria-pressed", String(tab === "day"));
    tabShop.setAttribute("aria-pressed", String(tab === "shop"));
    var hasList = parse(store.text).length > 0;
    if (hasList && (ui.compose === "new" || ui.compose === "edit")) showCompose(ui.compose, true);
    else if (hasList) showSched();
    else showCompose("first", ui.compose === "first");
  }
  function setTab(next) {
    if (next === tab) return;
    tab = next;
    store = stores[tab];
    ui = uis[tab];
    try { localStorage.setItem(TABKEY, tab); } catch (e) { /* fine without it */ }
    start();
    window.scrollTo(0, 0);
  }
  tabDay.addEventListener("click", function () { setTab("day"); });
  tabShop.addEventListener("click", function () { setTab("shop"); });
  start();

  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () { /* works without it */ });
    });
  }
})();
</script>
</body>
</html>
