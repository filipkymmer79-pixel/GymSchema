<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Idag</title>
<meta name="description" content="Dagens lista, en sak i taget.">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Idag">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F3F4F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1114" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400..700&amp;display=swap">
<style>
/* Idag: one thing at a time. Quiet paper, one typeface (Familjen Grotesk, drawn in Stockholm) and a single
   block of colour, for the thing to do now. That colour follows the clock: morning yellow, day blue,
   evening orange, night violet. Everything else is ink on paper, left-aligned, no cards. */
:root{
  --bg:#F3F4F6; --ink:#15171B; --muted:#646B78; --line:#DDE0E6; --field:#E8EAEF;
  --morgon:#F4B740; --dag:#6AA6FF; --kvall:#FF8A65; --natt:#A99BFF;
  --accent:var(--dag); --on-accent:#15171B;
  --bad:#B3261E;
  --font:"Familjen Grotesk",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1114; --ink:#F1F2F4; --muted:#9BA2AE; --line:#272B33; --field:#1C1F25; --bad:#FF8A80;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1114; --ink:#F1F2F4; --muted:#9BA2AE; --line:#272B33; --field:#1C1F25; --bad:#FF8A80;
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.35;font-weight:500;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent;cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.app,.lock{max-width:520px;margin:0 auto;padding:14px 20px calc(104px + env(safe-area-inset-bottom,0px))}

/* ---------- Top: the date, and the way to the shopping list ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.when{font-size:14.5px;color:var(--muted)}
.cart{position:relative;flex:0 0 auto;border:0;background:transparent;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;margin-right:-8px}
.badge{position:absolute;top:1px;right:-2px;min-width:20px;height:20px;border-radius:10px;background:var(--ink);color:var(--bg);font-size:12px;font-weight:700;line-height:20px;text-align:center;padding:0 5px;font-variant-numeric:tabular-nums}

/* ---------- The day ---------- */
h1{margin:8px 0 0;font-size:62px;line-height:.95;letter-spacing:-.045em;font-weight:700;text-wrap:balance}
.progress{display:flex;align-items:center;gap:12px;margin-top:14px}
.progress span{font-size:15px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.bar{flex:1 1 auto;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ink);border-radius:2px;transition:width .3s ease}
.facts{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:2px;font-size:15px;color:var(--muted)}
.facts b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.days{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.days button{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:8px 16px;min-height:42px;font-size:15px;font-weight:600}
.days button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* ---------- Now: the one block of colour ---------- */
.now{background:var(--accent);color:var(--on-accent);border-radius:26px;padding:18px 20px 20px;margin-top:16px;transition:background-color .6s ease}
.now .label{font-size:14.5px;font-weight:700}
.now .title{margin-top:2px;font-size:28px;line-height:1.1;letter-spacing:-.025em;font-weight:700;overflow-wrap:anywhere;text-wrap:balance}
.now .time{margin-top:6px;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.now .note{margin-top:4px;font-size:15.5px;opacity:.82}
.now .acts{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;margin-top:14px}
.now .more{padding:10px 0 0}
.now .more li{border-color:rgba(21,23,27,.18)}
.now .more p{color:inherit;opacity:.82}
.now.empty{background:var(--field);color:var(--ink)}
.btn{border:0;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:700;font-size:16px;padding:12px 24px;min-height:48px}
.now .btn{background:#15171B;color:#FFFFFF;padding:12px 34px}
.link{border:0;background:transparent;padding:10px 0;min-height:44px;font-size:15px;font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px}
.link.sure{color:var(--bad)}
.now .link.sure{color:inherit}

/* ---------- Then: the rest, in order ---------- */
.rows{list-style:none;margin:8px 0 0;padding:0}
.row{border-bottom:1px solid var(--line)}
.row .line{display:flex;align-items:center;gap:10px}
.row-main{all:unset;box-sizing:border-box;flex:1 1 auto;min-width:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;padding:13px 0;min-height:54px;cursor:pointer}
.row-main:focus-visible{outline:3px solid var(--ink);outline-offset:-2px;border-radius:10px}
.tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;color:transparent}
.row.done .tick{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.row .t{display:block;font-size:17px;font-weight:600;letter-spacing:-.01em;overflow-wrap:anywhere}
.row.done .t{color:var(--muted);text-decoration:line-through}
.row .note{display:block;font-size:14.5px;color:var(--muted);margin-top:1px}
.row .time{flex:0 0 auto;font-size:15px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.row .sub{display:flex;flex-wrap:wrap;gap:0 16px;padding:0 0 4px 40px;margin-top:-8px}
.more{padding:0 0 14px 40px}
.more ol{list-style:none;margin:0;padding:0}
.more li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:15px;border-top:1px solid var(--line)}
.more li b{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.more p{margin:8px 0 0;font-size:14.5px;color:var(--muted)}
.group{margin-top:26px}
.group h2{margin:0;font-size:21px;letter-spacing:-.02em;font-weight:700}
.group h2 small{font-size:14.5px;font-weight:500;letter-spacing:0;color:var(--muted);margin-left:8px}
.group .rows{margin-top:2px}
.callout{margin-top:22px;border-radius:14px;background:var(--field);padding:12px 14px;font-size:15.5px;font-weight:600}
.back{border:0;background:transparent;padding:10px 0;min-height:44px;font-size:15px;font-weight:600;color:var(--muted);text-decoration:underline;text-underline-offset:3px}

/* ---------- Adding, and the quiet tools at the bottom ---------- */
.add{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:24px}
.add input,.add select{border:0;border-radius:14px;background:var(--field);padding:13px 14px;min-height:50px;font-size:16px;width:100%}
.add input::placeholder{color:var(--muted);opacity:1}
.add .where{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:15px;color:var(--muted)}
.add .where select{width:auto;min-height:42px;padding:8px 12px;color:var(--ink);font-weight:600}
.foot{display:flex;flex-wrap:wrap;align-items:center;gap:0 20px;margin-top:22px}
.status{margin-left:auto;font-size:14px;color:var(--muted)}
.hint{flex-basis:100%;margin:4px 0 0;font-size:14.5px;color:var(--muted)}
.foot textarea{flex-basis:100%;width:100%;min-height:150px;margin-top:8px;border:0;border-radius:14px;background:var(--field);padding:12px 14px;font-size:14.5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:10;display:flex;align-items:center;gap:10px;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);border-radius:999px;padding:6px 6px 6px 18px;font-size:15px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.toast span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast button{flex:0 0 auto;border:0;border-radius:999px;background:var(--bg);color:var(--ink);font-weight:700;font-size:14.5px;padding:8px 16px;min-height:38px}

/* ---------- Locked (only the app on GitHub, before the link has been opened) ---------- */
.lock p{margin:14px 0 0;color:var(--muted);max-width:34ch}
.lock .add{grid-template-columns:minmax(0,1fr)}
.lock .btn{justify-self:start}

@media (max-width:350px){
  h1{font-size:52px}
  .now .title{font-size:25px}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none !important;scroll-behavior:auto !important}
}
</style>
</head>
<body>
<section class="lock" id="v-lock" hidden aria-label="Lås upp schemat">
  <h1>Låst</h1>
  <p>Schemat öppnas med länken du fick av Claude.</p>
  <form class="add" id="lockForm" novalidate>
    <input id="lockText" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Klistra in länken här" aria-label="Länken från Claude">
    <button class="btn" type="submit">Lås upp</button>
  </form>
  <p id="lockMsg">Länken sparas på telefonen, så det här behövs bara en gång.</p>
</section>

<div class="app" id="app" hidden>
  <header class="top">
    <div class="when" id="dateLine"></div>
    <button class="cart" id="shopBtn" type="button" aria-label="Öppna inköpslistan">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2.3l2.2 10.3a1.6 1.6 0 0 0 1.6 1.2h8.1a1.6 1.6 0 0 0 1.5-1.2L20.3 8H6.3"/><circle cx="9.6" cy="19.3" r="1.2"/><circle cx="16.9" cy="19.3" r="1.2"/></svg>
      <span class="badge" id="shopLeft" hidden></span>
    </button>
  </header>

  <main>
    <section id="v-dag" aria-label="Schema">
      <h1 id="dayName"></h1>
      <div class="progress"><span id="dayCount"></span><div class="bar"><i id="dayBar"></i></div></div>
      <ul class="facts" id="facts"></ul>
      <div class="days" id="days" role="group" aria-label="Välj dag"></div>

      <div id="nowBox"></div>
      <ul class="rows" id="rows"></ul>
      <div id="doneBox"></div>

      <form class="add" id="addForm" novalidate>
        <input id="addText" type="text" maxlength="140" autocomplete="off" placeholder="Lägg till en punkt" aria-label="Lägg till en punkt">
        <button class="btn" type="submit">Lägg till</button>
        <label class="where" for="addPos">Den hamnar
          <select id="addPos">
            <option value="next">näst på tur</option>
            <option value="last">sist i listan</option>
          </select>
        </label>
      </form>

      <div class="foot">
        <button class="link" id="copyDay" type="button">Kopiera listan</button>
        <button class="link" id="resetDay" type="button">Nollställ bockarna</button>
        <span class="status" id="status" role="status"></span>
        <p class="hint" id="dayMsg" hidden></p>
        <textarea id="dayBox" hidden readonly aria-label="Dagens lista som text"></textarea>
      </div>
    </section>

    <section id="v-handla" hidden aria-label="Handla">
      <button class="back" id="shopBack" type="button">Tillbaka till schemat</button>
      <h1>Handla</h1>
      <div class="progress"><span id="shopCount"></span><div class="bar"><i id="shopBar"></i></div></div>
      <ul class="facts"><li id="shopEyebrow"></li></ul>
      <div id="shopLists"></div>
      <div class="callout" id="shopCallout" hidden></div>

      <form class="add" id="shopForm" novalidate>
        <input id="shopText" type="text" maxlength="80" autocomplete="off" placeholder="Lägg till en vara" aria-label="Lägg till en vara">
        <button class="btn" type="submit">Lägg till</button>
      </form>

      <div class="foot">
        <button class="link" id="copyShop" type="button">Kopiera det som är kvar</button>
        <p class="hint" id="shopMsg" hidden></p>
        <textarea id="shopBox" hidden readonly aria-label="Inköpslistan som text"></textarea>
      </div>
    </section>
  </main>
</div>

<div class="toast" id="toast" hidden role="status">
  <span id="toastText"></span>
  <button id="toastUndo" type="button">Ångra</button>
</div>

    if (Array.isArray(raw.d)) raw.d.forEach(function (id) { if (typeof id === "string") S.done[id] = true; });
    if (raw.x && typeof raw.x === "object") Object.keys(raw.x).forEach(function (id) { var c = cleanExtra(raw.x[id]); if (c) S.extra[id] = c; });
    if (raw.p && typeof raw.p === "object") Object.keys(raw.p).forEach(function (k) { pend[k] = raw.p[k]; });
  }
} catch (e) { /* ingen lagring: börja tomt */ }
function saveLocal() {
  try { localStorage.setItem(KEY, JSON.stringify({ d: Object.keys(S.done), x: S.extra, p: pend })); } catch (e) { /* går bra utan */ }
}

function ownIds(dayKey) {              // egna punkter för en dag (eller "shop"), äldst först
  return Object.keys(S.extra).filter(function (id) { return S.extra[id].day === dayKey; })
    .sort(function (a, b) { return S.extra[a].ts - S.extra[b].ts || (a < b ? -1 : 1); });
}
function ownItem(id) { return { id: id, t: S.extra[id].text, own: true, after: S.extra[id].after }; }
function itemsOf(day) {                // dagens lista i ordning; egna punkter där de lades in, annars sist
  var list = day.items.slice(), last = [];
  ownIds(day.id).forEach(function (id) {
    var after = S.extra[id].after, at = -1, i;
    if (after) for (i = 0; i < list.length; i++) if (list[i].id === after) { at = i + 1; break; }
    if (at === -1) { last.push(ownItem(id)); return; }
    while (at < list.length && list[at].own && list[at].after === after) at++;
    list.splice(at, 0, ownItem(id));
  });
  return list.concat(last);
}
function shopSections() {
  return SHOP.map(function (s) {
    var own = s.id === "h-eget" ? ownIds("shop").map(ownItem) : [];
    return { id: s.id, title: s.title, sub: s.sub, items: s.items.concat(own) };
  }).filter(function (s) { return s.items.length; });
}
function flat(secs) { var out = []; secs.forEach(function (s) { s.items.forEach(function (it) { out.push(it); }); }); return out; }
function notDone(it) { return !S.done[it.id]; }
function isDone(it) { return !!S.done[it.id]; }

/* ---------- Saving ---------- */
var LOCAL = "Sparas på den här telefonen", SAVED = "Sparat", SAVING = "Sparar", FAILED = "Kunde inte spara, bocka igen", STALE = "Väntar på nätet";
var db = null, busy = {}, retried = {}, confirmed = false, loadTimer = null;
function say(msg) { $("status").textContent = msg; }
function goLocal() { db = null; say(LOCAL); }
function put(col, id, val) { pend[col + "/" + id] = val; saveLocal(); flush(col + "/" + id); }
function flush(key) {
  if (!db || busy[key] || !(key in pend)) return;
  var want = pend[key], ref;
  busy[key] = true;
  try { ref = db.doc(key); } catch (e) { busy[key] = false; goLocal(); return; }
  if (confirmed) say(SAVING);
  (want === null ? ref.delete() : ref.set(want)).then(function () {
    busy[key] = false; retried[key] = false;
    if (pend[key] === want) { delete pend[key]; saveLocal(); if (confirmed) say(SAVED); }
    else flush(key);
  }, function (err) {
    busy[key] = false;
    var code = err && err.code;
    if (code === "resource_exhausted" || code === "quota_exceeded") { say(FAILED); return; }
    if (code === "invalid_argument" || code === "transform_error" || code === "revoked" || code === "not_granted" ||
        code === "not_writer" || code === "capability_disabled" || code === "capability_removed") { goLocal(); return; }
    if (!retried[key]) { retried[key] = true; setTimeout(function () { flush(key); }, 500 + Math.random() * 1000); }
    else { retried[key] = false; say(FAILED); }
  });
}
function listen(col, take) {
  db.collection(col).onSnapshot(function (snap) {
    var fromCache = !!(snap.metadata && snap.metadata.fromCache);
    if (fromCache && !confirmed) return;        // vänta på servern, annars kan en tom cache blinka bort bockarna
    var remote = {};
    snap.docs.forEach(function (d) { remote[d.id] = d.data() || {}; });
    take(remote);
    saveLocal();
    paint();
    if (!fromCache && !confirmed) { confirmed = true; clearTimeout(loadTimer); say(SAVED); }
  }, function () { clearTimeout(loadTimer); goLocal(); });
}
function free(col, id) { var k = col + "/" + id; return !(k in pend) && !busy[k]; }
function connect(ns) {
  if (!ns) { say(LOCAL); return; }
  db = ns;
  loadTimer = setTimeout(function () { if (!confirmed) say(STALE); }, 10000);
  try {
    listen("checks", function (remote) {
      Object.keys(S.done).concat(Object.keys(remote)).forEach(function (id) {
        if (!free("checks", id)) return;
        if (remote[id] && remote[id].done === true) S.done[id] = true; else delete S.done[id];
      });
    });
    listen("extra", function (remote) {
      Object.keys(S.extra).concat(Object.keys(remote)).forEach(function (id) {
        if (!free("extra", id)) return;
        var c = cleanExtra(remote[id]);
        if (c) S.extra[id] = c; else delete S.extra[id];
      });
    });
  } catch (e) { clearTimeout(loadTimer); goLocal(); return; }
  Object.keys(pend).forEach(flush);
}
function setDone(id, on) {
  if (on) S.done[id] = true; else delete S.done[id];
  put("checks", id, on ? { done: true } : null);
}

/* ---------- Drawing ---------- */
function tableOf(it) { return typeof it.more.rows === "string" ? TABLES[it.more.rows] || [] : it.more.rows || []; }
function moreEl(it) {                  // det som fälls ut under en punkt: passets övningar
  var kids = [el("ol", null, tableOf(it).map(function (r) { return el("li", null, [el("span", { text: r[0] }), r[1] ? el("b", { text: r[1] }) : null]); }))];
  if (it.more.foot) kids.push(el("p", { text: it.more.foot }));
  return el("div", { class: "more" }, kids);
}
function linksOf(it) {                 // små textknappar som hör till en punkt
  var out = [];
  if (it.more) out.push(el("button", { class: "link", type: "button", "data-more": it.id, "aria-expanded": ui.open[it.id] ? "true" : "false", text: ui.open[it.id] ? "Dölj passet" : "Visa passet" }));
  if (it.go === "handla") out.push(el("button", { class: "link", type: "button", "data-go": "handla", text: "Öppna inköpslistan" }));
  if (it.own) out.push(el("button", { class: "link" + (ui.del === it.id ? " sure" : ""), type: "button", "data-del": it.id, text: ui.del === it.id ? "Tryck igen för att ta bort" : "Ta bort" }));
  return out;
}
function rowEl(it) {
  var done = isDone(it);
  var txt = el("span", null, [el("span", { class: "t", text: it.t }), it.note ? el("span", { class: "note", text: it.note }) : null]);
  var main = el("button", { class: "row-main", type: "button", role: "checkbox", "aria-checked": done ? "true" : "false", "data-id": it.id, id: "b-" + it.id },
    [el("span", { class: "tick", icon: "check" }), txt]);
  var li = el("li", { class: "row" + (done ? " done" : "") }, [el("div", { class: "line" }, [main, it.time ? el("span", { class: "time", text: it.time }) : null])]);
  var links = done ? [] : linksOf(it);
  if (links.length) li.appendChild(el("div", { class: "sub" }, links));
  if (!done && it.more && ui.open[it.id]) li.appendChild(moreEl(it));
  return li;
}
function nowEl(it, isToday) {
  if (!it) {
    return el("div", { class: "now empty" }, [
      el("div", { class: "title", text: "Allt är avbockat" }),
      el("div", { class: "note", text: "Det finns inget kvar på listan den här dagen." })
    ]);
  }
  var kids = [el("div", { class: "label", text: isToday ? "Nu" : "Först" }), el("div", { class: "title", text: it.t })];
  if (it.time) kids.push(el("div", { class: "time", text: it.time }));
  if (it.note) kids.push(el("div", { class: "note", text: it.note }));
  kids.push(el("div", { class: "acts" }, [el("button", { class: "btn", type: "button", "data-id": it.id, id: "b-" + it.id, text: "Klar" })].concat(linksOf(it))));
  if (it.more && ui.open[it.id]) kids.push(moreEl(it));
  return el("div", { class: "now" }, kids);
}
function keepFocus(fn) {
  var a = document.activeElement, id = a && a.id;
  fn();
  var back = id ? $(id) : null;
  if (back && back !== document.activeElement) { try { back.focus({ preventScroll: true }); } catch (e) {} }
}
function paintFacts(left, now) {       // nästa klockslag, och veckans nedräkning om schemat har någon
  var f = $("facts"); f.textContent = "";
  var up = left.filter(function (it) { return it.ts && it.ts > now; }).sort(function (a, b) { return a.ts - b.ts; })[0];
  if (up) f.appendChild(el("li", null, ["Nästa tid ", el("b", { text: up.time.replace(/^(ca|senast) /, "").replace(/–.*$/, "") + " " + up.t }), ", om " + dur(up.ts - now)]));
  if (EVENT) f.appendChild(el("li", null, now < EVENT.at ? [el("b", { text: EVENT.label }), " om " + dur(EVENT.at - now, true)] : [el("b", { text: EVENT.label }), " " + EVENT.after]));
}
function paintShared(now) {            // det som följer klockan
  $("dateLine").textContent = dateLine(now);
  document.documentElement.style.setProperty("--accent", "var(--" + partOfDay(now) + ")");
  var left = flat(shopSections()).filter(notDone).length;
  $("shopLeft").textContent = left;
  $("shopLeft").hidden = left === 0;
  $("shopBtn").setAttribute("aria-label", "Öppna inköpslistan, " + left + " kvar");
  [].forEach.call($("days").children, function (b) {
    var d = dayOf(b.getAttribute("data-day"));
    b.textContent = dayLabel(d, now);
    b.setAttribute("aria-pressed", d.id === ui.day ? "true" : "false");
  });
}
function paintDay() {
  var day = dayOf(ui.day), all = itemsOf(day), now = Date.now();
  var left = all.filter(notDone), done = all.filter(isDone), cur = left[0] || null;
  $("dayName").textContent = day.name;
  $("dayCount").textContent = done.length + " av " + all.length + " klara";
  $("dayBar").style.width = (all.length ? Math.round(done.length / all.length * 100) : 0) + "%";
  paintFacts(left, now);
  keepFocus(function () {
    var nb = $("nowBox"), rows = $("rows"), db2 = $("doneBox");
    nb.textContent = ""; nb.appendChild(nowEl(cur, day.id === todayId(now)));
    rows.textContent = ""; left.slice(1).forEach(function (it) { rows.appendChild(rowEl(it)); });
    db2.textContent = "";
    if (done.length) {
      db2.appendChild(el("button", { class: "link", type: "button", id: "doneToggle", "aria-expanded": ui.showDone ? "true" : "false",
        text: ui.showDone ? "Dölj det som är klart" : "Visa det som är klart (" + done.length + ")" }));
      if (ui.showDone) db2.appendChild(el("ul", { class: "rows" }, done.map(rowEl)));
    }
  });
  $("resetDay").textContent = ui.reset ? "Tryck igen för att nollställa" : "Nollställ bockarna";
  $("resetDay").className = "link" + (ui.reset ? " sure" : "");
  $("resetDay").hidden = done.length === 0;
}
function paintShop() {
  var secs = shopSections(), all = flat(secs), got = all.filter(isDone).length;
  $("shopCount").textContent = got + " av " + all.length + " köpta";
  $("shopBar").style.width = (all.length ? Math.round(got / all.length * 100) : 0) + "%";
  keepFocus(function () {
    var box = $("shopLists"); box.textContent = "";
    secs.forEach(function (s) {
      box.appendChild(el("section", { class: "group", "aria-label": s.title }, [
        el("h2", null, [s.title, s.sub ? el("small", { text: s.sub }) : null]),
        el("ul", { class: "rows" }, s.items.map(rowEl))
      ]));
    });
  });
}
function paint() {
  paintShared(Date.now());
  if (ui.view === "dag") paintDay(); else paintShop();
}
function showView(name) {
  ui.view = name; ui.del = null; ui.reset = false;
  $("v-dag").hidden = name !== "dag";
  $("v-handla").hidden = name !== "handla";
  $("shopBtn").hidden = name === "handla";
  paint();
  window.scrollTo(0, 0);
}

/* ---------- Text out: the format Dagsschema reads ---------- */
function dayText() {
  return itemsOf(dayOf(ui.day)).map(function (it) {
    return (isDone(it) ? "[x] " : "") + (it.time ? it.time + " " : "") + it.t + (it.note ? "\n> " + it.note : "");
  }).join("\n");
}
function shopText() {
  var out = [];
  shopSections().forEach(function (s) {
    var left = s.items.filter(notDone);
    if (!left.length) return;
    if (out.length) out.push("");
    out.push("# " + s.title);
    left.forEach(function (it) { out.push(it.t); });
  });
  return out.join("\n");
}
function copier(btnId, msgId, boxId, make, okMsg) {
  $(btnId).addEventListener("click", function () {
    var text = make(), msg = $(msgId), box = $(boxId);
    function tell(t) { msg.textContent = t; msg.hidden = false; }
    function byHand() {
      box.value = text; box.hidden = false;
      tell("Markera texten här under och kopiera den.");
      try { box.focus(); box.select(); } catch (e) {}
    }
    if (!text) { tell("Det finns inget kvar att kopiera."); return; }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { box.hidden = true; tell(okMsg); }, byHand);
      } else byHand();
    } catch (e) { byHand(); }
  });
}

/* ---------- Taps ---------- */
var toastTimer = null;
function hideToast() { ui.undo = null; $("toast").hidden = true; clearTimeout(toastTimer); }
function showToast(id, text) {
  ui.undo = id;
  $("toastText").textContent = "Klart: " + text;
  $("toast").hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, 6000);
}
function textOf(id) {
  var all = flat(DAYS.map(function (d) { return { items: itemsOf(d) }; })).concat(flat(shopSections())), i;
  for (i = 0; i < all.length; i++) if (all[i].id === id) return all[i].t;
  return "";
}
function onTap(e) {
  var b = e.target.closest ? e.target.closest("button") : null, id;
  if (!b) return;
  if ((id = b.getAttribute("data-id"))) {
    ui.del = null; ui.reset = false;
    var on = !S.done[id];
    setDone(id, on);
    if (on && ui.view === "dag") showToast(id, textOf(id)); else if (ui.undo === id) hideToast();
    paint();
  } else if ((id = b.getAttribute("data-more"))) {
    ui.open[id] = !ui.open[id];
    paint();
  } else if ((id = b.getAttribute("data-del"))) {
    if (ui.del !== id) { ui.del = id; paint(); return; }
    ui.del = null;
    delete S.extra[id];
    put("extra", id, null);
    if (S.done[id]) setDone(id, false);
    paint();
  } else if ((id = b.getAttribute("data-day"))) {
    ui.day = id; ui.del = null; ui.reset = false; ui.showDone = false;
    paint();
  } else if (b.getAttribute("data-go") === "handla") {
    showView("handla");
  } else if (b.id === "doneToggle") {
    ui.showDone = !ui.showDone;
    paint();
  }
}
function addOwn(dayKey, after, input) {
  var text = input.value.replace(/\s+/g, " ").trim().slice(0, 140);
  if (!text) { input.focus(); return; }
  var id = "x" + Date.now().toString(36) + Math.floor(Math.random() * 1296).toString(36);
  var x = { day: dayKey, after: after, text: text, ts: Date.now() };
  S.extra[id] = x;
  put("extra", id, x);
  input.value = "";
  paint();
}

DAYS.forEach(function (d) { $("days").appendChild(el("button", { type: "button", "data-day": d.id, "aria-pressed": "false", text: d.name })); });
$("days").hidden = DAYS.length < 2;
$("shopEyebrow").textContent = PLAN.shop.eyebrow || "";
if (PLAN.shop.callout) { $("shopCallout").textContent = PLAN.shop.callout; $("shopCallout").hidden = false; }
if (!flat(shopSections()).length) $("shopBtn").hidden = true;

$("v-dag").addEventListener("click", onTap);
$("v-handla").addEventListener("click", onTap);
$("shopBtn").addEventListener("click", function () { showView("handla"); });
$("shopBack").addEventListener("click", function () { showView("dag"); });
$("toastUndo").addEventListener("click", function () {
  if (ui.undo) setDone(ui.undo, false);
  hideToast();
  paint();
});
$("addForm").addEventListener("submit", function (e) {
  e.preventDefault();
  var left = itemsOf(dayOf(ui.day)).filter(notDone);
  addOwn(dayOf(ui.day).id, $("addPos").value === "next" && left.length ? left[0].id : "", $("addText"));
});
$("shopForm").addEventListener("submit", function (e) { e.preventDefault(); addOwn("shop", "", $("shopText")); });
$("resetDay").addEventListener("click", function () {
  if (!ui.reset) { ui.reset = true; paint(); return; }
  ui.reset = false; ui.showDone = false;
  itemsOf(dayOf(ui.day)).forEach(function (it) { if (S.done[it.id]) setDone(it.id, false); });
  hideToast();
  paint();
});
copier("copyDay", "dayMsg", "dayBox", dayText, "Kopierat. Listan går att klistra in i Dagsschema.");
copier("copyShop", "shopMsg", "shopBox", shopText, "Kopierat. Listan går att klistra in under Handla i Dagsschema.");

showView("dag");
setInterval(function () { if (!document.hidden) tick(); }, 20000);
document.addEventListener("visibilitychange", function () { if (!document.hidden) tick(); });
function tick() {
  /* Only what follows the clock, so a tap in progress is never redrawn away. */
  var now = Date.now();
  paintShared(now);
  if (ui.view === "dag") paintFacts(itemsOf(dayOf(ui.day)).filter(notDone), now);
}

if (window.claude && typeof window.claude.use === "function") {
  try { window.claude.use("db").then(connect, function () { say(LOCAL); }); } catch (e) { say(LOCAL); }
} else {
  say(LOCAL);
}
}   // boot

/* ---------- Unlocking: the schedule is sealed in this file and the key is the last part of the link ---------- */
var APP = document.getElementById("app"), LOCK = document.getElementById("v-lock");
function bytes(s) {
  s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "=";
  var bin = atob(s), u = new Uint8Array(bin.length), i;
  for (i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u;
}
function keyFrom(text) {
  var s = String(text || "");
  if (s.indexOf("#") !== -1) s = s.slice(s.lastIndexOf("#") + 1);
  s = s.trim();
  return /^[A-Za-z0-9_-]{22}$/.test(s) ? s : null;
}
function unseal(k) {
  if (!window.crypto || !crypto.subtle) return Promise.reject(new Error("no crypto"));
  var buf = bytes(SEALED);
  return crypto.subtle.importKey("raw", bytes(k), "AES-GCM", false, ["decrypt"])
    .then(function (key) { return crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(0, 12) }, key, buf.slice(12)); })
    .then(function (plain) { return JSON.parse(new TextDecoder().decode(plain)); });
}
function opened(plan, k) {
  try { localStorage.setItem("schema.k", k); } catch (e) { /* then the link has to carry it */ }
  /* Keep the key in the address, so that "Lägg till på hemskärmen" saves it with the app. */
  if (keyFrom(location.hash) !== k) { try { history.replaceState(null, "", "#" + k); } catch (e) {} }
  LOCK.hidden = true; APP.hidden = false;
  boot(plan);
}
var savedKey = null;
try { savedKey = localStorage.getItem("schema.k"); } catch (e) {}
var tries = [keyFrom(location.hash), keyFrom(savedKey)].filter(function (k, i, a) { return k && a.indexOf(k) === i; });
(function next() {
  if (!tries.length) { LOCK.hidden = false; return; }
  var k = tries.shift();
  unseal(k).then(function (plan) { opened(plan, k); }, next);
})();
document.getElementById("lockForm").addEventListener("submit", function (e) {
  e.preventDefault();
  var msg = document.getElementById("lockMsg"), k = keyFrom(document.getElementById("lockText").value);
  if (!k) { msg.textContent = "Det där är inte hela länken. Kopiera den från Claude och klistra in den igen."; return; }
  unseal(k).then(function (plan) { opened(plan, k); }, function () {
    msg.textContent = "Länken passar inte det här schemat. Klistra in den senaste länken från Claude.";
  });
});
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () { /* works without it */ }); });
}
})();
