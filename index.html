/* Vanor: sömn och löpdagens pass bockas av från Garmin */
function gmAuto(date, hb){
  if (!gmOn() || !gm) return false;
  if (hb.k === "somn"){ const w = gmW(date); return !!(w && w.sl >= 36000); }
  if (hb.k === "pass") return habitPlan(date).kind === "run" && gmRunOn(date).length > 0;
  return false;
}
function gmHabitNote(date, hb){
  if (hb.k === "somn"){
    const w = gmOn() ? gmW(date) : null, parts = [];
    if (w && w.sl) parts.push("Garmin: " + gmHM(w.sl) + (w.sl >= 36000 ? " ✓" : " – målet är 10 h"));
    if (date === iso(today())) parts.push("släck " + gmBedtime().hm + " i kväll");
    return parts.join(" · ");
  }
  if (!gmOn() || !gm) return "";
  if (hb.k === "pass" && habitPlan(date).kind === "run"){ const r = gmRunOn(date); return r.length ? "Garmin: " + r.map(x => fmt(x.km, 1) + " km på " + gmDur(x.s)).join(" + ") + " ✓" : ""; }
  return "";
}

/* Dagens läge: HRV och vilopuls mot dina senaste 4 veckor */
function gmVerdict(){
  const t = today(), w = gmW(iso(t));
  if (!w || (w.sl == null && w.hrv == null && w.rhr == null)) return {c: "", ic: "⌚", txt: "Inget från i natt än. Öppna Garmin Connect-appen så synkar klockan – sen kommer det hit."};
  const from = iso(addDays(t, -28)), to = iso(addDays(t, -1)), bh = gmStats("hrv", from, to), br = gmStats("rhr", from, to), warn = [];
  if (w.hrv != null && bh && bh.n >= 7 && w.hrv < bh.m - Math.max(bh.sd, bh.m * .06)) warn.push("HRV lägre än vanligt");
  if (w.rhr != null && br && br.n >= 7 && w.rhr > br.m + Math.max(br.sd, 2)) warn.push("vilopulsen högre än vanligt");
  if (w.sl != null && w.sl < 6 * 3600) warn.push("kort sömn");
  if (warn.length) return {c: "warn", ic: "!", txt: gmCap(warn.join(", ")) + ". Kör lugnare i dag: lättare vikter eller pratfart."};
  if (!(bh && bh.n >= 7) && !(br && br.n >= 7)) return {c: "", ic: "i", txt: "När det finns en veckas data jämför appen varje morgon med ditt vanliga läge."};
  return {c: "good", ic: "✓", txt: "HRV och vilopuls som vanligt – kör som planerat."};
}

function gmStat(l, v, u, sub){ return '<div class="stat"><div class="stat-l">' + esc(l) + '</div><div class="stat-v num">' + v + (u ? '<small>' + u + '</small>' : '') + '</div>' + (sub ? '<div class="stat-s">' + esc(sub) + '</div>' : '') + '</div>'; }
function gmKmBars(){
  const ws = weekStart(today()), rows = [];
  for (let i = 7; i >= 0; i--){ const a = addDays(ws, -7 * i), A = iso(a), B = iso(addDays(a, 7)); rows.push({km: gmRuns().filter(r => r.d >= A && r.d < B).reduce((x, r) => x + r.km, 0), n: gmWeekNo(a), cur: i === 0}); }
  const W = 340, H = 132, L = 8, R = 8, T = 18, Bm = 22, bw = (W - L - R) / rows.length, max = Math.max(5, Math.max.apply(null, rows.map(r => r.km)));
  let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Löpning, kilometer per vecka"><line class="gl" x1="' + L + '" x2="' + (W - R) + '" y1="' + (H - Bm) + '" y2="' + (H - Bm) + '"/>';
  rows.forEach((r, i) => {
    const h = (H - T - Bm) * r.km / max, w = Math.min(bw * .64, 30), x = L + i * bw + (bw - w) / 2, y = H - Bm - h;
    if (r.km > 0) s += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="4" fill="' + (r.cur ? "var(--ink)" : "var(--faint)") + '" opacity="' + (r.cur ? 1 : .55) + '"/>' +
      '<text x="' + (x + w / 2).toFixed(1) + '" y="' + (y - 5).toFixed(1) + '" text-anchor="middle"' + (r.cur ? ' class="end"' : '') + '>' + fmt(r.km, r.km >= 100 ? 0 : 1) + '</text>';
    s += '<text x="' + (x + w / 2).toFixed(1) + '" y="' + (H - 7) + '" text-anchor="middle">v' + r.n + '</text>';
  });
  return s + '</svg>';
}
function gmSleepBars(){

  const W = 340, H = 140, L = 8, R = 8, T = 16, Bm = 22, bw = (W - L - R) / days.length, max = 11 * 3600, Y = v => T + (1 - Math.min(v, max) / max) * (H - T - Bm);

  days.forEach((d, i) => {
    const r = gmW(d), v = r && r.sl, w = Math.min(bw * .62, 16), x = L + i * bw + (bw - w) / 2;
    if (v){ const y = Y(v); s += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + (H - Bm - y).toFixed(1) + '" rx="3" fill="' + (v >= 36000 ? "var(--good)" : "var(--blue)") + '" opacity="' + (i === days.length - 1 ? 1 : .75) + '"/>'; }
    s += '<text x="' + (x + w / 2).toFixed(1) + '" y="' + (H - 7) + '" text-anchor="middle"' + (i === days.length - 1 ? ' class="end"' : '') + '>' + parseIso(d).getDate() + '</text>';

}
function gmRunCard(){

function gmSleepCard(){

/* ---------- Prognos: din egen takt, rak linje genom de senaste 8 veckorna ---------- */
function trendFit(pts){
  const n = pts.length; if (n < 2) return null;
  const xs = pts.map(p => p.t / 864e5), ys = pts.map(p => p.y), mx = xs.reduce((a, b) => a + b, 0) / n, my = ys.reduce((a, b) => a + b, 0) / n;
  let sxx = 0, sxy = 0; for (let i = 0; i < n; i++){ sxx += (xs[i] - mx) * (xs[i] - mx); sxy += (xs[i] - mx) * (ys[i] - my); }
  if (!sxx) return null;
  const k = sxy / sxx; return {k, at: d => my + k * (d - mx)};
}
const progWeeks = days => days < 4 ? "om några dagar" : days < 10 ? "nästa vecka" : days < 17 ? "om ca två veckor" : "om ca " + Math.round(days / 7) + " veckor";
const progDate = days => { const d = addDays(today(), Math.round(days)); return d.getDate() + " " + MON[d.getMonth()] + (d.getFullYear() !== today().getFullYear() ? " " + d.getFullYear() : ""); };
function progHTML(ex0, pts){
  const ex = OVER_EX.concat(UNDER_EX).find(e => e.k === ex0.k) || ex0;
  const rec = pts.filter(p => p.t >= Date.now() - 56 * 864e5 && p.y != null);
  const head = '<div class="card prog"><div class="stat-l">Prognos' + (ex.lr ? " · höger arm" : "") + '</div>';
  if (ex.unit === "reps") return "";
  if (rec.length < 3 || (rec[rec.length - 1].t - rec[0].t) / 864e5 < 12) return head + '<div class="small">Kommer när du loggat övningen minst tre gånger under två veckor. Då räknar appen ut när du når nästa vikt i din egen takt.</div></div>';
  const f = trendFit(rec), now = Date.now() / 864e5, cur = f.at(now), perW = f.k * 7, step = ex.step || (ex.unit === "sek" ? 5 : 1);
  const lower = ex.unit === "hjalp", unit = ex.unit === "sek" ? " s" : " kg";
  if (lower ? perW > -step / 8 : perW < step / 8) return head + '<div class="prog-big">Står still</div><div class="small">' + (lower ? "Hjälpen har inte minskat" : "Vikten har inte ökat") + ' de senaste veckorna. Sikta på fler reps med samma vikt – när alla set når ' + (ex.hi || "") + ' reps är det dags att ' + (lower ? "minska hjälpen" : "öka") + '.</div></div>';
  const best = rec[rec.length - 1].y, goals = [];
  if (lower){ const a = Math.round((best - step) / step) * step; if (a > 0) goals.push(a); goals.push(0); }
  else { const a = (Math.floor(best / step + 1e-9) + 1) * step, r5 = Math.ceil((best + step) / 5) * 5; goals.push(+a.toFixed(1)); if (r5 > a + 1e-9) goals.push(r5); }
  const rows = goals.map(g => ({g, days: (g - cur) / f.k})).filter(x => x.days > 0 && x.days < 200);
  if (!rows.length) return "";
  const lbl = g => lower ? (g === 0 ? "Utan hjälp" : fmt(g) + " kg hjälp") : fmt(g) + unit;
  return head + '<div class="prog-rows">' + rows.map(x => '<div><b class="num">' + lbl(x.g) + '</b><span>' + progWeeks(x.days) + ' · runt ' + progDate(x.days) + '</span></div>').join("") + '</div>' +
    '<div class="small">Takt: ' + (perW > 0 ? "+" : "−") + fmt(Math.abs(perW), 1) + unit + ' i veckan de senaste veckorna. Håller takten är du där då.</div></div>';
}
function weightProgHTML(pts){
  const rec = pts.filter(p => p.t >= Date.now() - 56 * 864e5);
  if (rec.length < 3 || (rec[rec.length - 1].t - rec[0].t) / 864e5 < 13) return "";
  const f = trendFit(rec), cur = f.at(Date.now() / 864e5), perM = f.k * 30;
  if (perM < 0.15) return '<div class="card prog"><div class="stat-l">Prognos</div><div class="prog-big">Vikten står still</div><div class="small">Med den här takten når du inte ' + GOAL_KG + ' kg. Rådet om shake-storlek här under visar vad du ska ändra.</div></div>';
  const goals = [70, GOAL_KG].filter((g, i, a) => g > cur + 0.3 && a.indexOf(g) === i);
  if (!goals.length) return "";
  return '<div class="card prog"><div class="stat-l">Prognos · din takt +' + fmt(perM, 1) + ' kg i månaden</div><div class="prog-rows">' +
    goals.map(g => { const days = (g - cur) / f.k; return '<div><b class="num">' + g + ' kg</b><span>runt ' + progDate(days) + ' · om ca ' + Math.max(1, Math.round(days / 30.4)) + ' mån</span></div>'; }).join("") + '</div></div>';
}

/* ---------- Hållningsmätare: AI:n (MediaPipe Pose) körs i telefonen och hittar öra, axel, höft, knä och fotled ---------- */
const MP_VER = "0.10.35", MP_BASE = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@" + MP_VER;

  if (poseLm) return poseLm;
  if (posePending) return posePending;
  posePending = (async () => {
    msg && msg("Laddar AI:n – första gången tar det en stund (ca 20 MB)…");
    const mp = await import(MP_BASE + "/vision_bundle.mjs");

// Mått från 2D-punkterna. Skala: öra–fotled ≈ 89 % av längden.
function poseMeasure(lm, w, h, view, height){

  const torso = Math.hypot(shMid.x - hipMid.x, shMid.y - hipMid.y) || 1;

  const pxcm = Math.abs(ankY - earY) / (0.89 * height);
  if (!(pxcm > 0)) return {err: "Kunde inte räkna på bilden. Ta om den."};
  if (view === "sida"){
    if (shW > torso * .45) return {err: "Det ser ut som att du står framifrån. Vänd sidan mot kameran och ta om bilden."};
    const S = avgV(L) >= avgV(R) ? L : R, [ear, sh, hip, knee, ank] = S;

    return {view, pts: {ear, sh, hip, knee, ank}, facing, pxcm, m: {headAng: Math.round(ang), earSh: +fwd(ear, sh).toFixed(1), shHip: +fwd(sh, hip).toFixed(1), hipAnk: +fwd(hip, ank).toFixed(1)}};
  }
  if (shW < torso * .45) return {err: "Det ser ut som att du står från sidan. Vänd dig mot kameran och ta om bilden."};

if (/[?&]selftest\b/.test(location.search)) window.__gs = {poseMeasure};

    x.setLineDash([u * 4, u * 4]); x.strokeStyle = "rgba(255,255,255,.85)"; x.beginPath(); x.moveTo(ank.x, ank.y); x.lineTo(ank.x, Math.max(0, ear.y - u * 30)); x.stroke(); x.setLineDash([]);
    x.strokeStyle = "#6B95FF"; x.beginPath(); [ear, sh, hip, knee, ank].forEach((p, i) => i ? x.lineTo(p.x, p.y) : x.moveTo(p.x, p.y)); x.stroke();

  } else {
    const p = r.pts;
    [[p.lSh, p.rSh], [p.lHip, p.rHip], [p.lEar, p.rEar]].forEach(([a, b], i) => {

function poseTexts(r){

  if (r.view === "sida") return [
    ["Huvudet", m.earSh > 0.5 ? "Örat " + cm(m.earSh) + " framför axeln" : m.earSh < -0.5 ? "Örat " + cm(m.earSh) + " bakom axeln" : "Örat rakt över axeln", "Mindre = bättre. Hakindrag och ryggövningarna flyttar huvudet bakåt."],

function postureStart(viewName){

/* ---------- Kalorimål: grund + det klockan säger att du bränt + justering från vågen ---------- */
// Grund: Mifflin–St Jeor (vikt från Vikt, 183 cm, 20 år) × 1,4 för vardagen + 300 kcal för ca +1 kg i månaden.
// Klockan: kcal från dagens pass i intervals.icu minus vilan under passet (den finns redan i grunden).
// Vågen: går vikten upp långsammare/snabbare än +1 kg/mån de senaste 4 veckorna flyttas målet, högst −300/+500.
const KC_H = 183, KC_AGE = 20, KC_GAIN = 1, KC_SURPLUS = 300;
const KC_TY = {Run: "Löpning", TrailRun: "Löpning", VirtualRun: "Löpning", Treadmill: "Löpband", WeightTraining: "Gym", Workout: "Träning", Walk: "Promenad", Hike: "Vandring", Ride: "Cykling", VirtualRide: "Cykling", Swim: "Simning", Boxing: "Boxning", Yoga: "Yoga", HighIntensityIntervalTraining: "Intervaller", Crossfit: "Crossfit", Elliptical: "Crosstrainer", Rowing: "Rodd"};
(function(){ if (!foodSet.v27){ foodSet.size = 2700; foodSet.v27 = 1; try { store(FOOD_SET, foodSet); } catch(e){} } })();
function kcWeight(date){ const w = weights.filter(x => x.date <= date); return w.length ? w[w.length - 1].kg : weights.length ? weights[0].kg : 62; }
const kcBmr = kg => 10 * kg + 6.25 * KC_H - 5 * KC_AGE + 5;
function kcTrend(date){
  const from = iso(addDays(parseIso(date), -28)), pts = weights.filter(w => w.date > from && w.date <= date).map(w => ({t: parseIso(w.date).getTime(), y: w.kg}));
  if (pts.length < 4 || (pts[pts.length - 1].t - pts[0].t) / 864e5 < 14) return null;
  const f = trendFit(pts); return f ? f.k * 30.44 : null;
}
const kcLabel = a => (KC_TY[a.ty] || a.n || "Träning") + (a.km > 0.3 && /Run|Walk|Hike|Ride/.test(a.ty) ? " " + fmt(a.km, 1) + " km" : "");
function kcalGoal(date){
  const kg = kcWeight(date), bmr = kcBmr(kg), base = Math.round(bmr * 1.4 / 10) * 10, tr = kcTrend(date);
  const adj = tr == null ? 0 : Math.max(-300, Math.min(500, Math.round((KC_GAIN - tr) / 30.44 * 7700 / 50) * 50));
  const acts = (gmOn() && gm ? gm.a.filter(a => a.d === date && a.kc > 0) : []).map(a => ({a, kc: Math.max(0, Math.round(a.kc - bmr / 1440 * (a.s || 0) / 60))})).filter(x => x.kc > 0);
  const watch = acts.reduce((s, x) => s + x.kc, 0);
  return {goal: base + KC_SURPLUS + adj + watch, base, adj, tr, watch, acts, kg, bmr: Math.round(bmr)};
}

  let eq = gmSteps(g.base + KC_SURPLUS) + " grund";
  if (g.watch) eq += " + " + gmSteps(g.watch) + " från klockan";
  if (g.adj) eq += (g.adj > 0 ? " + " : " − ") + gmSteps(Math.abs(g.adj)) + " från vågen";
  return '<div class="card fd-sum" id="kcCard">' +
    '<div class="fd-big"><div><div class="stat-l">Kalorier</div><b class="num' + (t.kcal >= g.goal ? " ok" : "") + '">' + gmSteps(t.kcal) + '</b><small>av ' + gmSteps(g.goal) + '</small><div class="fd-bar kc"><i style="width:' + pk + '%"></i></div></div>' +

    '<div class="kc-eq"><b>Mål ' + gmSteps(g.goal) + ' kcal</b> = ' + eq + '</div>' +
    (g.acts.length ? '<div class="kc-acts">' + g.acts.map(x => '<span>⌚ ' + esc(kcLabel(x.a)) + ' <b class="num">+' + gmSteps(x.kc) + '</b></span>').join("") + '</div>' : '') +

      '<p><b>Grund:</b> ' + fmt(g.kg, 1) + ' kg, ' + KC_H + ' cm och ' + KC_AGE + ' år gör ca ' + gmSteps(g.bmr) + ' kcal i vila, gånger 1,4 för vardagen = ' + gmSteps(g.base) + '. Plus ' + KC_SURPLUS + ' för att gå upp ca 1 kg i månaden.</p>' +

  '</div>';
}

let nt = Object.assign({on: false, url: "", key: "", set: {}}, store(NT_KEY) || {});

const ntSave = () => store(NT_KEY, nt);
const ntUrl = () => sbNormUrl(nt.url || (sb && sb.url) || "");

const ntHm = m => { m = ((m % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + "." + pad(m % 60); };

const ntU8 = s => { s = String(s).replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };

async function ntApi(path, body){
  if (!/^https:\/\/[^/]+\.[^/]+/.test(ntUrl())) throw sbErr("url");
  let r, j = null;
  try { r = await fetch(ntUrl() + path, body ? {method: "POST", headers: {"Content-Type": "application/json", "X-GS-Key": ntKey()}, body: JSON.stringify(body), cache: "no-store"} : {cache: "no-store"}); }
  catch(e){ throw sbErr("net"); }
  try { j = await r.json(); } catch(e){}
  if (r.status === 503 && j && j.error === "kv") throw sbErr("kv");
  if (r.status === 403 && j && j.message === "not allowed") throw sbErr("old");
  if (r.status === 409) throw sbErr("taken");
  if (r.status === 404 && j && j.error === "off") throw sbErr("off");
  if (!r.ok || !j) throw sbErr("worker");
  return j;
}
// Notiserna för 7 dagar framåt. id är unikt per dag så att workern aldrig skickar samma två gånger.

  for (let i = 0; i < 7; i++){

    if (ntSet("bed").on){
      let b = at(d, bed.hm); if (+bed.hm.split(".")[0] < 12) b += 864e5;
      out.push({id: "bed30-" + ds, at: b - 30 * 60e3, title: "Läggdags om 30 min 🌙", body: "Släck " + bed.hm + " så får du 10 timmar till " + wake + ". Bocka av vanorna och lägg undan mobilen.", url: "./#vanor"});
      out.push({id: "bed-" + ds, at: b, title: "Dags att sova 😴", body: "Släck nu – då får du 10 timmar till " + wake + ".", url: "./#vanor"});
    }

      out.push({id: "gym-" + ds, at: at(d, ntSet("gym").t), title: "Gymdag: " + PROGRAM[gk].name + " 💪", body: PROGRAM[gk].ex.length + " övningar i dag. Passet ligger under Pass.", url: "./#pass"});
    if (RUN_DAYS[dow] && ntSet("run").on && !(ds === ti && gmOn() && gm && gmRunOn(ti).length))
      out.push({id: "run-" + ds, at: at(d, ntSet("run").t), title: RUN_DAYS[dow] + " 🏃", body: "Pratfart. Kolla löpvädret i appen – bästa timmen och vad du ska ha på dig.", url: "./#pass"});
    if (ntSet("shake").on && !(ds === ti && (shakeGl[ti] || 0) > 0))
      out.push({id: "shake-" + ds, at: at(d, ntSet("shake").t), title: "Shaken 🥤", body: "Mixa dagens shake – " + gmSteps(foodSet.size) + " kcal i " + foodSet.glasses + " glas.", url: "./#vikt"});

      out.push({id: "hall-" + ds, at: at(d, ntSet("hall").t), title: "Hållning + fascia · 12 min 🧍", body: "Hållningspasset och 2 min fascia-håll per sida.", url: "./#vanor"});
  }
  if (nt.ct && nt.ct > now) out.push({id: "crontest-" + nt.ct, at: nt.ct, title: "Schemat funkar också ✓", body: "Den här kom från schemat i Cloudflare. Nu kommer påminnelserna av sig själva.", url: "./#vanor"});
  return out.filter(e => e.at > now + 30e3).sort((a, b) => a.at - b.at);
}
async function ntSub(){ const reg = await navigator.serviceWorker.ready; return reg.pushManager.getSubscription(); }
async function ntSync(force){
  if (!nt.on || !ntCan()) return;
  try {
    const sub = await ntSub();
    if (!sub){ nt.on = false; nt.err = "Notiserna har stängts av i telefonen – slå på igen."; ntSave(); ntPaint(); return; }
    const sj = sub.toJSON(), events = ntEvents(), sig = JSON.stringify([sj.endpoint, events.map(e => e.id + "@" + e.at)]);
    if (!force && sig === nt.sig && Date.now() - (nt.ts || 0) < 6 * 3600e3) return;
    const j = await ntApi("/push/save", {sub: {endpoint: sj.endpoint, keys: sj.keys}, events});
    nt.sig = sig; nt.ts = Date.now(); nt.err = ""; nt.cron = j.cron || nt.cron || 0; ntSave();
  } catch(e){ nt.err = ntText(e); ntSave(); }
  ntPaint();
}
const ntSoon = () => { clearTimeout(ntTimer); ntTimer = setTimeout(() => ntSync(false), 1500); };
async function ntCheck(){

    let sub = await reg.pushManager.getSubscription();
    if (sub && nt.vk && nt.vk !== j.key){ await sub.unsubscribe(); sub = null; }
    if (!sub){
      try { sub = await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: ntU8(j.key)}); }
      catch(e){ const old = await reg.pushManager.getSubscription(); if (old){ await old.unsubscribe(); sub = await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: ntU8(j.key)}); } else throw sbErr("sub"); }
    }
    nt.vk = j.key; nt.on = true; nt.sig = ""; nt.err = ""; ntSave(); ntStat = {code: "ok", key: j.key, cron: j.cron || 0};
    await ntSync(true);
