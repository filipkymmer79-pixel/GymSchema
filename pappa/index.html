<style>
/* Layout: one-column phone app – sticky header with this week's four sessions, logging cards, bottom tab bar.
   Plate colours code the three weekly sessions: Gym 1 (tis, red), Gym 2 (fre, blue), Löprundan (sön or any day, green). */
:root{
  --bg:#ECEEF1; --surface:#FFFFFF; --surface2:#F4F5F7; --ink:#13161B; --muted:#5D6570; --faint:#8A929C; --line:#DADEE4;
  --red:#D32F2F; --blue:#2356D4; --yellow:#E2A900; --green:#1E9A55;
  --on-red:#FFFFFF; --on-blue:#FFFFFF; --on-yellow:#1A1400; --on-green:#FFFFFF;
  --good:#1B8A4C; --good-bg:#E2F3E9; --warn:#A35F00; --warn-bg:#FBEFD9; --bad:#C62828; --bad-bg:#FBE4E4;
  --shadow:0 1px 2px rgba(15,20,30,.05),0 8px 24px rgba(15,20,30,.06);
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Archivo","Helvetica Neue",Arial,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1013; --surface:#171A1F; --surface2:#1F232A; --ink:#ECEFF3; --muted:#A0A8B3; --faint:#6E7782; --line:#2A2F37;
  --red:#FF5B52; --blue:#6B95FF; --yellow:#FFC93A; --green:#3CCB7C;
  --on-red:#1A0605; --on-blue:#050B1C; --on-yellow:#1A1400; --on-green:#03150A;
  --good:#3CCB7C; --good-bg:#11301F; --warn:#F2A33A; --warn-bg:#33240D; --bad:#FF6B6B; --bad-bg:#3A1717;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1013; --surface:#171A1F; --surface2:#1F232A; --ink:#ECEFF3; --muted:#A0A8B3; --faint:#6E7782; --line:#2A2F37;
  --red:#FF5B52; --blue:#6B95FF; --yellow:#FFC93A; --green:#3CCB7C;
  --on-red:#1A0605; --on-blue:#050B1C; --on-yellow:#1A1400; --on-green:#03150A;
  --good:#3CCB7C; --good-bg:#11301F; --warn:#F2A33A; --warn-bg:#33240D; --bad:#FF6B6B; --bad-bg:#3A1717;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:14px 12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.logo{font-family:var(--display);font-weight:900;font-size:34px;line-height:.9;letter-spacing:.01em;text-transform:uppercase}
.logo span{color:var(--faint)}
.wk{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;text-align:right;line-height:1.35}
.wk b{display:block;color:var(--ink);font-weight:800}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.day{display:flex;align-items:center;gap:8px;padding:8px 9px;border-radius:12px;background:var(--surface);border:1px solid var(--line);min-width:0}
.day.today{border-color:var(--ink)}
.day.skip{opacity:.45}
.day.skip .plate{border-style:dashed}
.plate{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:3px solid var(--c);display:grid;place-items:center;background:transparent}
.plate::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--surface);box-shadow:0 0 0 1.5px var(--c)}
.day.done .plate{background:var(--c)}
.day.done .plate::after{background:var(--c);box-shadow:none;width:auto;height:auto;content:"✓";color:var(--onc);font-size:11px;font-weight:800;line-height:1}
.day-t{min-width:0}
.day-d{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);line-height:1.1}
.day-s{font-family:var(--display);font-weight:800;font-size:17px;line-height:1.05;white-space:nowrap}

/* Views */
.view{display:flex;flex-direction:column;gap:14px;padding-top:16px}
.view[hidden]{display:none}
body.timer-on .app{padding-bottom:calc(170px + env(safe-area-inset-bottom,0px))}
.h2{font-family:var(--display);font-weight:800;font-size:28px;line-height:1;letter-spacing:.005em;margin:6px 0 0;text-wrap:balance}
.lead{color:var(--muted);margin:0;font-size:14px}
.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--warn-bg);color:var(--ink);font-size:14px}
.banner b{font-weight:700}
.banner.info{background:var(--surface2)}

/* Session picker */
.picker{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface);padding:5px;border-radius:16px;box-shadow:var(--shadow)}
.pick{border:0;background:transparent;border-radius:12px;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.pick .ab{font-family:var(--display);font-weight:900;font-size:22px;line-height:1}
.pick .dd{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pick[aria-pressed="true"]{background:var(--c);color:var(--onc)}
.pick[aria-pressed="true"] .dd{color:inherit;opacity:.85}

.sess-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.sess-head .h2{font-size:34px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.pill.good{background:var(--good-bg);border-color:transparent;color:var(--good)}

/* Exercise card */
.ex{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:15px 14px 12px;display:flex;flex-direction:column;gap:10px}
.ex-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ex-n{font-weight:700;font-size:16px;line-height:1.25;margin:0;text-wrap:balance}
.ex-m{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--muted);background:var(--surface2);padding:3px 8px;border-radius:999px}
.count{font-family:var(--display);font-weight:800;font-size:22px;line-height:1;color:var(--faint);white-space:nowrap}
.count.full{color:var(--good)}
.shakeadv{display:flex;flex-direction:column;gap:4px}
.shakeadv .big{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.05;letter-spacing:.005em}
.shakeadv.up .big{color:var(--good)}
.shakeadv.down .big{color:var(--bad)}
.ex{transition:background .25s,box-shadow .25s}
.ex.full{background:var(--good-bg);background:color-mix(in srgb,var(--good) 20%,var(--surface));box-shadow:0 0 0 2.5px var(--good),var(--shadow)}
.ex.full .ex-n{color:var(--good)}
.ex.full .set.done{background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.last{font-size:13px;color:var(--muted)}
.last b{color:var(--ink);font-weight:600}
.sugg{align-self:flex-start;font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.sugg.up{background:var(--good-bg);color:var(--good)}
.sets{display:flex;flex-direction:column;gap:7px}
.set{display:grid;grid-template-columns:22px minmax(0,1fr) 58px 44px;gap:8px;align-items:center;padding:6px;border-radius:14px;background:var(--surface2);transition:background .2s}
.set.hdr{background:transparent;padding:0 6px;margin-bottom:-3px}
.ch{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:center;white-space:nowrap}
.set.one .fld input{width:100%}
.set.one{grid-template-columns:22px minmax(0,1fr) 44px}
.set.lr{grid-template-columns:22px minmax(0,1fr) 44px}
.lrrows{display:flex;flex-direction:column;gap:6px;min-width:0}
.lrrow{display:grid;grid-template-columns:18px minmax(0,1fr) 58px;gap:8px;align-items:center}
.side{font-family:var(--display);font-weight:800;font-size:15px;color:var(--muted);text-align:center}
.set.done{background:var(--good-bg)}
.sn{font-family:var(--display);font-weight:800;font-size:18px;text-align:center;color:var(--muted)}
.fld{display:flex;align-items:center;gap:4px;min-width:0}
.fld input{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 6px;text-align:center;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.fld.r input{width:58px}
.fld input::placeholder{font-size:14px;font-weight:600;color:var(--faint);opacity:1}
.fld .u{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.03em;white-space:nowrap}
.step{flex:0 0 auto;width:32px;height:36px;border:0;border-radius:10px;background:var(--surface);font-size:19px;font-weight:700;line-height:1;box-shadow:inset 0 0 0 1px var(--line)}
.step:active{transform:scale(.94)}
.chk{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-size:20px;font-weight:800;color:var(--faint);display:grid;place-items:center}
.set.done .chk{background:var(--good);border-color:var(--good);color:var(--surface)}
.set.need .fld input:placeholder-shown{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-bg)}

.note-f{display:flex;flex-direction:column;gap:6px}
.note-f label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.note-f textarea{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;min-height:64px;resize:vertical}

.savebar{display:flex;align-items:center;gap:12px;justify-content:space-between}
.sum{display:flex;flex-direction:column}
.sum-a{font-family:var(--display);font-weight:800;font-size:24px;line-height:1}
.sum-b{font-size:12.5px;color:var(--muted)}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:800;font-size:15px;background:var(--ink);color:var(--bg);letter-spacing:.01em}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.sm{padding:9px 12px;font-size:13.5px;border-radius:12px}
.awake{font-size:11.5px;font-weight:700;color:var(--good)}

.donecard{display:flex;flex-direction:column;gap:10px;text-align:left}
.donecard .big{font-family:var(--display);font-weight:900;font-size:40px;line-height:.95}
.pr{display:flex;gap:8px;align-items:center;font-weight:600}
.pr i{font-style:normal;font-size:11px;font-weight:800;letter-spacing:.06em;background:var(--yellow);color:var(--on-yellow);padding:3px 7px;border-radius:999px}

/* Progress */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface2);border-radius:12px;padding:9px 10px;min-width:0}
.stat-l{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.stat-v{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.1;white-space:nowrap}
.stat-v.good{color:var(--good)}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--body);font-size:10px;fill:var(--muted)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .end{font-weight:800;font-size:11px;fill:var(--ink)}
.empty{display:flex;flex-direction:column;gap:6px;align-items:flex-start;color:var(--muted);font-size:14px;padding:6px 2px}
.empty b{color:var(--ink);font-size:15px}
.rows{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px;align-items:center}
.row:first-child{border-top:0}
.row .d{color:var(--muted);font-size:13px;white-space:nowrap}

/* Weight */
.wform{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr) auto;gap:8px;align-items:end}
.wform label{display:flex;flex-direction:column;gap:5px;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:0}
.wform input{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:10px;font-size:17px;font-weight:700;width:100%;min-width:0;font-variant-numeric:tabular-nums}
.x{border:0;background:transparent;color:var(--faint);font-size:18px;width:32px;height:32px;border-radius:8px}
.x:hover{background:var(--surface2);color:var(--bad)}

/* History */
.hist{display:flex;flex-direction:column;gap:10px}
.hcard{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.hcard>button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 14px;cursor:pointer}
.hcard>button:focus-visible{outline:2.5px solid var(--blue);outline-offset:-3px;border-radius:var(--r)}
.badge{width:40px;height:40px;border-radius:50%;background:var(--c);color:var(--onc);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:17px}
.h-t{font-weight:700}
.h-s{font-size:12.5px;color:var(--muted)}
.h-v{font-family:var(--display);font-weight:800;font-size:19px;text-align:right;white-space:nowrap}
.h-v small{display:block;font-family:var(--body);font-size:11px;font-weight:600;color:var(--muted)}
.hbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:6px}
.hl{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;border-top:1px solid var(--line);padding-top:7px}
.hl span:last-child{color:var(--muted);text-align:right}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tab{border:0;background:transparent;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--ink)}

/* Rest timer */
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:26;width:min(calc(100% - 32px),420px);background:var(--ink);color:var(--bg);border-radius:20px;padding:10px 12px;display:flex;align-items:center;gap:12px;box-shadow:0 12px 32px rgba(0,0,0,.28)}
.timer[hidden]{display:none}
.ring{width:46px;height:46px;flex:0 0 auto}
.ring circle{fill:none;stroke-width:5}
.ring .bgc{stroke:color-mix(in srgb,var(--bg) 25%,transparent)}
.ring .fgc{stroke:var(--green);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .25s linear}
.t-main{flex:1;min-width:0}
.t-big{font-family:var(--display);font-weight:900;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.t-sub{font-size:12px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer .tb{border:0;border-radius:12px;padding:9px 11px;font-weight:800;font-size:13px;background:color-mix(in srgb,var(--bg) 16%,transparent);color:var(--bg)}
.timer.go{background:var(--green);color:var(--on-green)}
.timer.go .tb{color:var(--on-green)}

.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px)}

/* Uppvärmning & stretch */
.rcard{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px;border:1.5px dashed var(--line)}
.rcard.done{border-style:solid;border-color:var(--good)}
.rc-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rc-h h3{margin:3px 0 0;font-family:var(--display);font-weight:800;font-size:23px;line-height:1}
.rc-k{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.rc-st{flex:0 0 auto;font-size:12px;font-weight:800;padding:7px 11px;border-radius:999px;background:var(--surface2);color:var(--muted);border:0}
.rcard.done .rc-st{background:var(--good-bg);color:var(--good)}
.rc-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.rc-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rc-list li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px;font-weight:600}
.rc-list li:first-child{border-top:0}
.rc-list .dose{font-size:12px;font-weight:600;color:var(--muted);text-align:right}
.yt{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:#fff;background:#D93025;border-radius:999px;padding:5px 10px;text-decoration:none;white-space:nowrap}
.yt[hidden]{display:none}
.linkbtn{border:0;background:none;color:var(--muted);font-size:13px;font-weight:700;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
.guide{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.guide[hidden]{display:none}
.g-top{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:560px;margin:0 auto;width:100%}
.g-title{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.g-x{width:42px;height:42px;border-radius:12px;border:0;background:var(--surface);font-size:24px;line-height:1;box-shadow:var(--shadow)}
.g-dots{display:flex;gap:5px;max-width:560px;margin:12px auto 0;width:100%}

(function(){
"use strict";

/* ---------- Programmet ---------- */

const K = {draft: "gymstart.draft.v1", sessions: "gymstart.sessions.v1", weights: "gymstart.matt.v1", habits: "gymstart.vanor.v1", backup: "gymstart.lastBackup", build: "gymstart.build"};

/* Löprundan: jogg och gång om vartannat. Kändes rundan lätt eller lagom går nästa runda upp en nivå – var den tung står nivån kvar.
   Målet är nivå 11: 30 minuter utan att stanna. */
const LEVELS = [
  {n:6, j:60, w:120}, {n:6, j:90, w:90}, {n:6, j:120, w:90}, {n:5, j:180, w:90}, {n:4, j:240, w:90}, {n:3, j:360, w:120},
  {n:2, j:600, w:120}, {n:2, j:720, w:120}, {n:1, j:1200, w:0}, {n:1, j:1500, w:0}, {n:1, j:1800, w:0}
];
const WARM_S = 300, COOL_S = 300;
const FEEL = {latt: "Lätt", lagom: "Lagom", tungt: "Tungt"};
const minTxt = s => fmt(s / 60, 1) + " min";
const lvl = i => LEVELS[Math.max(1, Math.min(LEVELS.length, i || 1)) - 1];
const lvlMain = i => { const L = lvl(i); return L.n > 1 ? L.n + " × " + minTxt(L.j) + " jogg" : minTxt(L.j) + " jogg"; };
const lvlSub = i => { const L = lvl(i); return L.n > 1 ? minTxt(L.w) + " gång mellan varje" : "utan att gå – i pratfart"; };
function lvlTotals(i){ const L = lvl(i), jog = L.n * L.j, walk = (L.n - 1) * L.w; return {jog, longest: L.j, tot: WARM_S + jog + walk + COOL_S}; }
function runRoutine(i){
  const L = lvl(i), steps = [{n: "Rask promenad", t: WARM_S, ph: "Gå rask", cue: "Värm upp med rask gång. Axlarna avslappnade, armarna med.", tip: "Telefonen piper när det är dags att jogga."}];
  for (let k = 1; k <= L.n; k++){
    steps.push({n: L.n > 1 ? "Jogga · " + k + " av " + L.n : "Jogga", t: L.j, ph: "Jogga", cue: "Pratfart: du ska kunna prata i hela meningar. Korta steg, landa mjukt under kroppen.", tip: k === L.n ? "Sista joggen – sen är det bara promenad kvar." : "Flåsar du? Sakta ner. Långsamt är rätt."});
    if (k < L.n) steps.push({n: "Gå", t: L.w, ph: "Gå", cue: "Gå i rask takt och hämta andan.", tip: "Nästa jogg börjar när det piper."});
  }
  steps.push({n: "Gå lugnt", t: COOL_S, ph: "Varva ner", cue: "Lugn promenad – pulsen får gå ner.", tip: "Sen trycker du på hur det kändes, så sparas rundan."});
  return {name: "Löprundan · nivå " + i, min: Math.round(lvlTotals(i).tot / 60), flow: true, steps};
}

/* Upptrappning mot träningsvärk: pass 1–2 ett set per övning, pass 3–4 två set, sen fullt.
   Efter tre veckor utan gym blir det två set igen en gång, så att värken inte kommer tillbaka. */
function gymBefore(){ const t = iso(today()); return sessions.filter(s => isGym(s.type) && s.date < t); }
function rampStage(){
  const b = gymBefore(), n = b.length;
  let st = n < 2 ? 1 : n < 4 ? 2 : 3;
  if (st > 2){ const last = b.reduce((a, s) => s.date > a ? s.date : a, ""); if ((today() - parseIso(last)) / 864e5 >= 21) st = 2; }
  return st;
}
const setsNow = ex => Math.min(ex.sets, rampStage());

/* ---------- Hjälpare ---------- */
const $ = id => document.getElementById(id);
const MON = ["jan","feb","mar","apr","maj","jun","jul","aug","sep","okt","nov","dec"];
const DOW = ["sön","mån","tis","ons","tor","fre","lör"];
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const pad = n => String(n).padStart(2, "0");
const iso = d => d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
const parseIso = s => { const [y,m,d] = String(s).split("-").map(Number); return new Date(y, (m||1)-1, d||1); };
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const dLabel = s => { const d = parseIso(s); return d.getDate() + " " + MON[d.getMonth()]; };
const dLong = s => { const d = parseIso(s); return DOW[d.getDay()] + " " + d.getDate() + " " + MON[d.getMonth()]; };
const fmt = (n, dec) => n == null || isNaN(n) ? "–" : Number(n).toLocaleString("sv-SE", {maximumFractionDigits: dec == null ? 1 : dec});
const num = v => { if (v == null) return null; const s = String(v).trim().replace(",", "."); if (s === "") return null; const n = Number(s); return isFinite(n) ? n : null; };
const mmss = sec => { sec = Math.max(0, Math.ceil(sec)); return Math.floor(sec/60) + ":" + pad(sec % 60); };
const weekStart = d => addDays(d, -((d.getDay() + 6) % 7)); // veckan börjar på måndag
const sessColor = t => "--c:var(--" + PROGRAM[t].c + ");--onc:var(--on-" + PROGRAM[t].c + ")";

function store(key, val){ try { if (val === undefined) return JSON.parse(localStorage.getItem(key) || "null"); if (val === null) localStorage.removeItem(key); else localStorage.setItem(key, JSON.stringify(val)); } catch(e){ return null; } }

let toastT = 0;
function toast(msg){ const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600); }


/* ---------- Tillstånd ---------- */
let sessions = [];   // från db, nyast först
let weights = [];    // från db, äldst först
let db = null, readOnly = false, dbStatus = "loading", gotS = false, gotW = false;
let view = "pass";
let selType = null;
let draft = null;
let justSaved = null;

let openHist = null, confirmDel = null, confirmW = null;
let armed = null, armedT = 0;


/* ---------- Statistik ---------- */
function exOf(session, k){ return (session.exercises || []).find(x => x.k === k) || null; }
function setsOf(session, k){ const e = exOf(session, k); return e ? (e.sets || []) : null; }
function lastFor(k, beforeTs){
  for (const s of sessions){ if (beforeTs && s.ts >= beforeTs) continue; const e = exOf(s, k); if (e && e.sets && e.sets.length) return {s, sets: e.sets, plan: e.plan || null}; }
  return null;
}
function setText(ex, st){
  if (ex.unit === "sek") return fmt(st.s, 0) + " s";
  if (ex.unit === "reps") return fmt(st.r, 0) + " st";
  return fmt(st.w) + " × " + fmt(st.r, 0);
}
function suggestion(ex){
  const last = lastFor(ex.k), easy = rampStage() < 3;
  if (!last) return {val: null, text: ex.unit === "sek" ? "Börja på " + ex.lo + " sekunder – på knäna går bra" : "Välj en lätt vikt: du ska klara " + ex.hi + " reps och ha 3–4 kvar", up: false};
  const st = last.sets, full = st.length >= (last.plan || ex.sets);
  if (ex.unit === "sek"){
    const m = Math.min.apply(null, st.map(x => x.s || 0));
    if (m >= ex.hi) return {val: ex.hi, text: "Taket på " + ex.hi + " s är nått – håll formen perfekt", up: false};
    if (full) return {val: Math.min(ex.hi, m + 5), text: "↑ Håll " + Math.min(ex.hi, m + 5) + " sekunder idag", up: true};
    return {val: m, text: "= Samma tid – klara alla set", up: false};
  }
  const top = Math.max.apply(null, st.map(x => x.w || 0));
  const hit = full && st.every(x => (x.r || 0) >= ex.hi && x.w === top);
  if (hit){ const nv = +(top + ex.step).toFixed(1); return {val: nv, text: "↑ Öka till " + fmt(nv) + " kg idag", up: true}; }
  return {val: top, text: "= Samma vikt – sikta på " + ex.hi + " reps i alla set" + (easy ? ", med 2–3 kvar" : ""), up: false};
}
// Ett mått per set: uppskattat max (Epley) för kg, sekunder för plankan.
function setScore(ex, x){
  if (ex.unit === "kg") return x.w != null && x.r ? x.w * (1 + x.r / 30) : null;
  if (ex.unit === "sek") return x.s || null;
  return x.r || null;
}
function bestSet(ex, st){
  let best = null, bs = null;
  (st || []).forEach(x => { const s = setScore(ex, x); if (s == null) return; if (bs == null || s > bs){ bs = s; best = x; } });
  return best ? {set: best, score: bs} : null;
}
function chartVal(ex, st){
  if (!st || !st.length) return null;
  if (ex.unit === "kg"){ const w = st.filter(x => x.w != null).map(x => x.w); return w.length ? Math.max.apply(null, w) : null; }
  const b = bestSet(ex, st); return b ? b.score : null;
}
function findPRs(doc){
  const out = [];
  doc.exercises.forEach(e => {
    const ex = EXMAP[e.k]; if (!ex) return;
    const now = bestSet(ex, e.sets); if (!now) return;
    let prev = null;
    sessions.forEach(s => { const b = bestSet(ex, setsOf(s, e.k)); if (!b) return; if (prev == null || b.score > prev) prev = b.score; });
    if (prev == null) return;
    if (now.score > prev + 0.001) out.push(ex.n + ": " + setText(ex, now.set));
  });
  return out;
}
function volumeOf(exs){ let v = 0; exs.forEach(e => { const ex = EXMAP[e.k]; if (ex && ex.unit === "kg") e.sets.forEach(x => { if (x.w && x.r) v += x.w * x.r; }); }); return Math.round(v); }

/* ---------- Utkast (sparas bara på den här enheten tills du sparar passet) ---------- */
function newDraft(type){
  if (!isGym(type)) return {type, date: iso(today()), sets: {}, plan: {}, note: "", started: false, lvl: nextLevel(), ran: false};
  const sets = {}, plan = {};
  PROGRAM[type].ex.forEach(ex => {
    const sug = suggestion(ex), n = setsNow(ex);
    plan[ex.k] = n;
    sets[ex.k] = Array.from({length: n}, () => ({w: ex.unit === "kg" ? sug.val : null, s: ex.unit === "sek" ? sug.val : null, r: null, done: false}));
  });
  return {type, date: iso(today()), sets, plan, note: "", started: false};
}
let saveDraftT = 0;
function persistDraft(){ clearTimeout(saveDraftT); saveDraftT = setTimeout(() => store(K.draft, draft), 300); }
function restoreDraft(){
  const d = store(K.draft);
  if (!d || !d.type || !PROGRAM[d.type] || d.date !== iso(today())) return null;
  if (!isGym(d.type)) return Object.assign({sets: {}, plan: {}, note: "", lvl: nextLevel(), ran: false}, d);
  if (!d.sets) return null;
  d.plan = d.plan || {};
  PROGRAM[d.type].ex.forEach(ex => {
    const n = d.plan[ex.k] || setsNow(ex); d.plan[ex.k] = n;
    let arr = Array.isArray(d.sets[ex.k]) ? d.sets[ex.k] : [];
    while (arr.length < n){ const pv = arr[arr.length - 1] || {}; arr.push({w: pv.w == null ? null : pv.w, s: null, r: null, done: false}); }
    if (arr.length > n) arr = arr.filter((x, i) => i < n || x.done);
    d.sets[ex.k] = arr;
  });
  return d;
}

/* ---------- Veckan ---------- */
function weekInfo(){
  const t = today(), ws = weekStart(t), we = addDays(ws, 7);
  const n = Math.max(1, Math.round((ws - weekStart(START)) / 864e5 / 7) + 1);
  const doneTypes = {};
  sessions.forEach(s => { const d = parseIso(s.date); if (d >= ws && d < we) doneTypes[s.type] = true; });
  return {ws, we, n, doneTypes};
}
function renderStrip(){
  const w = weekInfo(), t = today();
  const from = w.ws < START ? START : w.ws;
  $("wk").innerHTML = "<b>Vecka " + w.n + "</b>" + from.getDate() + " " + MON[from.getMonth()] + " – " + addDays(w.ws, 6).getDate() + " " + MON[addDays(w.ws, 6).getMonth()];
  $("strip").innerHTML = ORDER.map(k => {
    const p = PROGRAM[k], isToday = BY_DOW[t.getDay()] === k, done = !!w.doneTypes[k];
    const dayDate = addDays(w.ws, (p.dow + 6) % 7), skip = dayDate < START && !done;
    return '<div class="day' + (done ? " done" : "") + (isToday && !skip ? " today" : "") + (skip ? " skip" : "") + '" style="' + sessColor(k) + '" title="' + esc(p.name) + (done ? " – klart" : skip ? " – programmet startar " + dLong(iso(START)) : k === "lop" ? " – vilken dag som helst i veckan" : "") + '">' +
      '<span class="plate" aria-hidden="true"></span><span class="day-t"><span class="day-d">' + p.day + '</span><br><span class="day-s">' + (skip ? "–" : p.ab) + '</span></span></div>';
  }).join("");
}
function nextScheduled(){
  const t = today();
  for (let i = 0; i < 14; i++){ const d = addDays(t, i); if (d < START) continue; const k = BY_DOW[d.getDay()]; if (k) return {k, d, i}; }
  return {k: "gA", d: t, i: 0};
}

/* ---------- Vy: Pass ---------- */
function renderPass(){
  const el = $("v-pass");
  if (justSaved){ el.innerHTML = justSaved.type === "lop" ? doneRunHTML(justSaved) : doneHTML(justSaved); return; }
  const preStart = today() < START;
  if (!selType){
    const tk = BY_DOW[today().getDay()];
    selType = draft ? draft.type : (preStart ? nextScheduled().k : (tk || nextScheduled().k));
  }
  if (!draft || draft.type !== selType) { draft = newDraft(selType); }
  const p = PROGRAM[selType], tk = preStart ? null : BY_DOW[today().getDay()];
  let banner = "";
  if (preStart){
    const nx = nextScheduled();
    banner += '<div class="banner info"><span>▶</span><span><b>Första passet ' + (nx.i === 1 ? "imorgon" : DOW[nx.d.getDay()] + "dag " + nx.d.getDate() + " " + MON[nx.d.getMonth()]) + '</b> – ' + esc(PROGRAM[nx.k].name) + '. Kika gärna på övningarna redan nu – vikterna väljer du på plats.</span></div>';
  } else if (!tk){
    const nx = nextScheduled();
    banner += '<div class="banner info"><span>☾</span><span><b>Vilodag.</b> Nästa: ' + DOW[nx.d.getDay()] + 'dag – ' + esc(PROGRAM[nx.k].name) + '. En promenad på 20 minuter räknas som dagens rörelse.</span></div>';
  }
  const picker = '<div class="picker" role="group" aria-label="Välj pass">' + ORDER.map(k => '<button class="pick" type="button" data-type="' + k + '" aria-pressed="' + (k === selType) + '" style="' + sessColor(k) + '"><span class="ab">' + PROGRAM[k].ab + '</span><span class="dd">' + PROGRAM[k].day + '</span></button>').join("") + '</div>';
  if (selType === "lop"){ el.innerHTML = banner + picker + runHTML(tk === "lop"); return; }
  const loggedToday = sessions.some(s => s.date === iso(today()) && s.type === selType);
  el.innerHTML = banner + picker +
    '<div class="sess-head"><div><div class="lead">' + (preStart ? "Första passet" : tk === selType ? "Dagens pass" : "Valt pass") + '</div><h2 class="h2">' + esc(p.name) + '</h2></div>' +
    (loggedToday ? '<span class="pill good">✓ Loggat idag</span>' : '<span class="pill num">' + p.ex.length + ' övningar</span>') + '</div>' +
    rampBanner() +
    rcardHTML("w") +
    p.ex.map(exHTML).join("") +
    rcardHTML("s") +
    '<div class="card note-f"><label for="note">Anteckning</label><textarea id="note" placeholder="Hur kändes det? Ont någonstans?">' + esc(draft.note) + '</textarea></div>' +
    '<div class="card savebar"><div class="sum"><span class="sum-a num" id="sumA"></span><span class="sum-b" id="sumB"></span></div>' +
    '<button class="btn" type="button" id="saveBtn">Spara passet</button></div>';
  updateSummary();
}
function rampBanner(){
  const st = rampStage(), n = gymBefore().length;
  if (st >= 3) return "";
  if (n >= 4) return '<div class="banner"><span>↺</span><span><b>Välkommen tillbaka!</b> Efter ett uppehåll blir det 2 set per övning idag – så att träningsvärken inte kommer tillbaka.</span></div>';
  if (st === 1) return '<div class="banner"><span>1</span><span><b>Startpass: 1 set per övning.</b> Lätta vikter, sluta med 3–4 reps kvar. Det ska kännas för lätt – det är meningen. Då slipper du gå stel i flera dagar.</span></div>';
  return '<div class="banner"><span>2</span><span><b>2 set per övning idag.</b> Fortfarande 2–3 reps kvar i varje set. Fullt program från pass 5.</span></div>';
}
function exHTML(ex){
  const st = draft.sets[ex.k], n = st.length;
  const last = lastFor(ex.k), sug = suggestion(ex);
  const lastTxt = last ? 'Förra gången · ' + dLabel(last.s.date) + ': <b class="num">' + last.sets.map(x => esc(setText(ex, x))).join(", ") + '</b>' : 'Första gången – inget att jämföra med än.';
  const target = n + " × " + (ex.lo === ex.hi ? ex.lo : ex.lo + "–" + ex.hi) + (ex.unit === "sek" ? " s" : "");
  const done = st.filter(x => x.done).length;
  return '<article class="ex' + (done === n ? ' full' : '') + '" data-k="' + ex.k + '">' +
    '<header class="ex-h"><div><h3 class="ex-n">' + esc(ex.n) + '</h3><div class="ex-m"><span class="tag num">' + target + '</span><span class="tag num">Vila ' + mmss(ex.rest) + '</span></div></div>' +
    '<span class="count num' + (done === n ? ' full' : '') + '" data-count="' + ex.k + '">' + done + '/' + n + '</span></header>' +
    '<div class="last" data-last="' + ex.k + '">' + lastTxt + '</div>' +
    '<div class="sugg' + (sug.up ? ' up' : '') + '" data-sugg="' + ex.k + '">' + esc(sug.text) + '</div>' +
    (KEYMAP[ex.k] ? '<a class="exlink" href="#program/' + KEYMAP[ex.k] + '">Bild, steg för steg och video →</a>' : '') +
    '<div class="sets">' + setsHead(ex) + st.map((x, i) => setHTML(ex, x, i)).join("") + '</div></article>';

function setsHead(ex){

/* ---------- Löprundan ---------- */
function runBest(){ let b = null; sessions.forEach(s => { if (s.type === "lop" && s.run && (b == null || s.run.longest > b)) b = s.run.longest; }); return b; }
function nextLevel(){
  const runs = sessions.filter(s => s.type === "lop" && s.run && s.date < iso(today())); // nyast först
  if (!runs.length) return 1;
  const last = runs[0];
  let l = (last.run.lvl || 1) + (last.run.feel === "tungt" ? 0 : 1);
  if ((today() - parseIso(last.date)) / 864e5 >= 21) l -= 1; // tre veckor utan löpning: ett steg tillbaka
  return Math.max(1, Math.min(LEVELS.length, l));
}
function runTimeline(i){

}

function tip(h, t){ return '<div class="tip"><b>' + esc(h) + '</b><span>' + esc(t) + '</span></div>'; }
function openRun(){

/* ---------- Interaktion: Pass ---------- */
$("v-pass").addEventListener("click", e => {
  const rn = e.target.closest("[data-run]");
  if (rn){ openRun(); return; }
  const lv = e.target.closest("[data-lvl]");
  if (lv && draft && draft.type === "lop"){ draft.lvl = Math.max(1, Math.min(LEVELS.length, (draft.lvl || nextLevel()) + +lv.dataset.lvl)); persistDraft(); renderPass(); return; }
  const fl = e.target.closest("[data-feel]");
  if (fl){ saveRun(fl.dataset.feel); return; }
  const rs = e.target.closest("[data-rstart]");
  if (rs){ openGuide(rs.dataset.rstart); return; }
  const rd = e.target.closest("[data-rdone]");
  if (rd && draft && isGym(draft.type)){ const f = RFLAG[rd.dataset.rdone]; draft[f] = !draft[f]; persistDraft(); renderPass(); return; }
  const rl = e.target.closest("[data-rlist]");
  if (rl && draft && isGym(draft.type)){ const key = RFOR[draft.type][rl.dataset.rlist]; openList[key] = !openList[key]; renderPass(); return; }
  const pick = e.target.closest("[data-type]");
  if (pick){
    const t = pick.dataset.type;
    if (t === selType) return;
    if (draft && draft.started && armed !== t){ armed = t; clearTimeout(armedT); armedT = setTimeout(() => { armed = null; }, 4000); toast("Tryck igen för att byta – det du loggat i det här passet försvinner"); return; }
    armed = null; selType = t; draft = newDraft(t); persistDraft(); renderPass(); window.scrollTo({top: 0}); return;
  }
  const act = e.target.closest("[data-act]");
  if (act){ const wasRun = justSaved && justSaved.type === "lop"; justSaved = null; if (act.dataset.act === "prog"){ if (wasRun) progEx = "lop"; go("framsteg"); } else { draft = null; selType = null; renderPass(); } return; }
  if (e.target.closest("#saveBtn")){ saveSession(); return; }
  if (!draft || !isGym(draft.type)) return;
  const card = e.target.closest(".ex"); if (!card) return;
  const ex = PROGRAM[draft.type].ex.find(x => x.k === card.dataset.k);
  const row = e.target.closest(".set"); if (!row || !ex) return;
  const i = +row.dataset.i, st = draft.sets[ex.k][i];
  if (!st) return;
  const stepBtn = e.target.closest("[data-step]");
  if (stepBtn){
    const dir = +stepBtn.dataset.step;
    if (ex.unit === "sek"){ st.s = Math.max(0, (st.s || ex.lo) + dir * ex.step); $("s-" + ex.k + "-" + i).value = st.s; }
    else { st.w = Math.max(0, +((st.w != null ? st.w : 0) + dir * ex.step).toFixed(2)); $("w-" + ex.k + "-" + i).value = String(st.w).replace(".", ","); }
    st.edited = true; row.classList.remove("need");
    draft.started = true; persistDraft(); updateSummary(); return;
  }
  if (e.target.closest("[data-chk]")){
    ensureAudio();
    if (!st.done){
      const needW = ex.unit === "kg" && st.w == null;
      const need = ex.unit === "sek" ? st.s == null : st.r == null;
      if (needW || need){
        row.classList.add("need");
        const f = row.querySelector(needW ? '[data-f="w"]' : ex.unit === "sek" ? '[data-f="s"]' : '[data-f="r"]'); if (f) f.focus();
        toast(needW ? "Skriv vikten först" : ex.unit === "sek" ? "Skriv hur många sekunder du höll" : "Skriv hur många reps du gjorde");
        return;
      }
      st.done = true; row.classList.remove("need"); row.classList.add("done");
      draft.started = true; keepAwake();
      // Samma vikt i nästa set, om du inte redan ändrat den själv
      const nx = draft.sets[ex.k][i+1];
      if (nx && !nx.done && !nx.edited){ if (ex.unit === "kg" && st.w != null){ nx.w = st.w; const inp = $("w-" + ex.k + "-" + (i+1)); if (inp) inp.value = String(st.w).replace(".", ","); } if (ex.unit === "sek" && st.s != null){ nx.s = st.s; const inp = $("s-" + ex.k + "-" + (i+1)); if (inp) inp.value = st.s; } }
      const nextIdx = draft.sets[ex.k].findIndex(x => !x.done);
      startTimer(ex.rest, nextIdx < 0 ? "Nästa övning" : ex.n + " · set " + (nextIdx + 1));
    } else { st.done = false; row.classList.remove("done"); }
    row.querySelector("[data-chk]").setAttribute("aria-pressed", st.done);
    persistDraft(); updateSummary();
  }
});
$("v-pass").addEventListener("input", e => {
  if (!draft || !isGym(draft.type)) return;
  if (e.target.id === "note"){ draft.note = e.target.value.slice(0, 1000); persistDraft(); return; }
  const f = e.target.dataset.f; if (!f) return;
  const card = e.target.closest(".ex"), row = e.target.closest(".set");
  if (!card || !row) return;
  const st = draft.sets[card.dataset.k][+row.dataset.i];
  const v = num(e.target.value);
  st[f] = v == null ? null : (f === "r" || f === "s" ? Math.max(0, Math.round(v)) : Math.max(0, v));
  if (f === "w" || f === "s") st.edited = true;
  row.classList.remove("need");
  draft.started = true; persistDraft(); updateSummary();
});

async function saveSession(){
  if (!db || readOnly || !draft || !isGym(draft.type)) return;
  const p = PROGRAM[draft.type];
  const exercises = p.ex.map(ex => ({k: ex.k, unit: ex.unit, plan: draft.sets[ex.k].length, sets: draft.sets[ex.k].filter(x => x.done).map(x => ({w: x.w == null ? null : x.w, r: x.r == null ? null : x.r, s: x.s == null ? null : x.s}))})).filter(e => e.sets.length);
  if (!exercises.length){ toast("Bocka av minst ett set först"); return; }
  const first = !sessions.some(s => isGym(s.type));
  const doc = {date: draft.date, ts: Date.now(), type: draft.type, exercises, note: (draft.note || "").trim(), volume: volumeOf(exercises), warm: !!draft.warm, stretch: !!draft.stretch};
  const prs = findPRs(doc);

  const b = $("saveBtn"); b.disabled = true; b.textContent = "Sparar…";
  try {

    justSaved = {id: ref && ref.id, type: doc.type, date: doc.date, volume: doc.volume, prs, sets: exercises.reduce((a, e) => a + e.sets.length, 0), warm: doc.warm, stretch: doc.stretch, first};
    clearTimeout(saveDraftT); draft = null; selType = null; store(K.draft, null); releaseAwake(); stopTimer();
    renderPass(); renderStrip(); window.scrollTo({top: 0});
  } catch(err){

/* ---------- Vilotimer ---------- */
let tEnd = 0, tTotal = 0, tTimer = 0, audio = null, wakeLock = null;
function ensureAudio(){ try { if (!audio){ const A = window.AudioContext || window.webkitAudioContext; if (A) audio = new A(); } if (audio && audio.state === "suspended") audio.resume(); } catch(e){} }
function beep(){ try { if (!audio) return; [0, .28].forEach(off => { const o = audio.createOscillator(), g = audio.createGain(); o.frequency.value = 880; g.gain.setValueAtTime(.0001, audio.currentTime + off); g.gain.exponentialRampToValueAtTime(.25, audio.currentTime + off + .02); g.gain.exponentialRampToValueAtTime(.0001, audio.currentTime + off + .2); o.connect(g); g.connect(audio.destination); o.start(audio.currentTime + off); o.stop(audio.currentTime + off + .22); }); } catch(e){} }
function startTimer(sec, label){
  tTotal = sec * 1000; tEnd = Date.now() + tTotal;
  const t = $("timer"); t.classList.remove("go"); t.hidden = false; document.body.classList.add("timer-on"); $("tsub").textContent = "Vila · " + label;
  tick();
}
function tick(){
  clearTimeout(tTimer);
  const left = tEnd - Date.now();
  const frac = Math.max(0, Math.min(1, left / tTotal));
  $("ringfg").style.strokeDashoffset = String(119.38 * (1 - frac));
  if (left <= 0){
    $("tbig").textContent = "Kör!"; $("tsub").textContent = "Dags för nästa set"; $("timer").classList.add("go");
    beep(); try { navigator.vibrate && navigator.vibrate([180, 90, 180]); } catch(e){}
    tTimer = setTimeout(stopTimer, 6000); return;
  }
  $("tbig").textContent = mmss(left / 1000);
  tTimer = setTimeout(tick, 250);
}
function stopTimer(){ clearTimeout(tTimer); $("timer").hidden = true; document.body.classList.remove("timer-on"); }
$("tplus").addEventListener("click", () => { if ($("timer").classList.contains("go")){ tEnd = Date.now() + 30000; tTotal = 30000; $("timer").classList.remove("go"); } else { tEnd += 30000; tTotal += 30000; } tick(); });
$("tskip").addEventListener("click", stopTimer);
async function keepAwake(){ try { if ("wakeLock" in navigator && !wakeLock && document.visibilityState === "visible"){ wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; updateSummary(); }); updateSummary(); } } catch(e){ wakeLock = null; } }
function releaseAwake(){ try { if (wakeLock) wakeLock.release(); } catch(e){} wakeLock = null; }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && draft && draft.started && !justSaved) keepAwake(); if (document.visibilityState === "visible" && !$("timer").hidden) tick(); });

let openList = {};
const doseText = st => st.dose || ((st.t >= 60 ? fmt(st.t / 60, 1) + " min" : st.t + " sek") + (st.sides === 2 ? " per sida" : ""));

    (open ? '<ol class="rc-list">' + r.steps.map(st => '<li><span>' + esc(st.n) + '</span><span class="dose">' + esc(doseText(st)) + '</span>' + (st.v ? '<a class="yt" href="' + YT(st.v) + '" target="_blank" rel="noopener">▶ Video</a>' : '<span></span>') + '</li>').join("") + '</ol>' : '') +
    '<div class="rc-row"><button class="btn" type="button" data-rstart="' + kind + '">▶ ' + (done ? "Kör igen" : "Starta guiden") + '</button>' +

}
let G = null, gT = 0;
const RING = 326.73;
function openGuide(kind, key){
  if (!draft && !justSaved) renderPass(); // dagens pass finns även om appen öppnades i en annan flik
  const type = draft ? draft.type : (justSaved ? justSaved.type : null);
  if (!key){ if (!type || !RFOR[type] || !RFOR[type][kind]) return; key = RFOR[type][kind]; }
  G = {kind, key, i: 0, side: 0, phase: "idle", end: 0, total: 1, paused: false, left: 0, auto: false};
  ensureAudio(); keepAwake();
  $("guide").hidden = false; document.body.style.overflow = "hidden";
  renderGuide(); $("gMain").focus();
}
function closeGuide(){ clearTimeout(gT); G = null; $("guide").hidden = true; document.body.style.overflow = ""; }
const gStep = () => ROUTINES[G.key].steps[G.i];
function renderGuide(){
  const r = ROUTINES[G.key], st = gStep(), last = G.i === r.steps.length - 1;
  $("gTitle").textContent = r.name + " · " + (G.i + 1) + "/" + r.steps.length;
  $("gDots").innerHTML = r.steps.map((_, k) => '<i class="' + (k < G.i ? "ok" : k === G.i ? "on" : "") + '"></i>').join("");
  $("gName").textContent = st.n;
  $("gDose").textContent = doseText(st);
  $("gCue").textContent = st.cue;
  $("gTip").innerHTML = st.tip ? "<b>Proffstips:</b> " + esc(st.tip) : "";
  const v = $("gVid"); v.hidden = !st.v; if (st.v) v.href = YT(st.v);
  $("gRingWrap").hidden = !st.t;
  let phase, main;
  if (st.t){
    const sideTxt = st.ph || (st.sides === 2 ? (G.side === 0 ? "Ena sidan" : "Andra sidan") : "Håll");
    if (G.phase === "idle"){ phase = st.sides === 2 ? "Ena sidan först" : "Redo?"; main = "▶ Starta"; $("gRing").style.strokeDashoffset = "0"; $("gTime").textContent = mmss(st.t); }
    else if (G.phase === "prep"){ phase = G.side === 1 ? "Byt sida" : "Gör dig redo"; main = G.paused ? "▶ Fortsätt" : "❚❚ Paus"; }
    else { phase = sideTxt; main = G.paused ? "▶ Fortsätt" : "❚❚ Paus"; }
  } else { phase = "Gör " + doseText(st); main = last ? "✓ Klar" : "Klar → nästa"; }
  $("gPhase").textContent = phase;
  $("gMain").textContent = main;
  $("gPrev").disabled = G.i === 0;
  $("gNext").textContent = last ? "Avsluta ✓" : "Hoppa →";
}
function gStartPhase(phase, sec){ G.phase = phase; G.total = sec * 1000; G.end = Date.now() + G.total; G.paused = false; renderGuide(); gTick(); }
function gTick(){
  clearTimeout(gT);
  if (!G || G.paused || (G.phase !== "prep" && G.phase !== "hold")) return;
  const left = G.end - Date.now(), frac = Math.max(0, Math.min(1, left / G.total));
  $("gRing").style.strokeDashoffset = String(RING * (1 - frac));
  $("gTime").textContent = G.phase === "prep" ? String(Math.max(1, Math.ceil(left / 1000))) : mmss(left / 1000);
  if (left <= 0){ gPhaseEnd(); return; }
  gT = setTimeout(gTick, 200);
}
function beep1(){ try { if (!audio) return; const o = audio.createOscillator(), g = audio.createGain(); o.frequency.value = 1320; g.gain.setValueAtTime(.0001, audio.currentTime); g.gain.exponentialRampToValueAtTime(.2, audio.currentTime + .02); g.gain.exponentialRampToValueAtTime(.0001, audio.currentTime + .15); o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime + .17); } catch(e){} }
function gPhaseEnd(){
  const st = gStep();
  if (G.phase === "prep"){ beep1(); gStartPhase("hold", st.t); return; }
  beep(); try { navigator.vibrate && navigator.vibrate([150, 80, 150]); } catch(e){}
  if (st.sides === 2 && G.side === 0){ G.side = 1; gStartPhase("prep", 5); return; }
  gNextStep(true);
}
function gNextStep(auto){
  if (G.i >= ROUTINES[G.key].steps.length - 1){ gFinish(); return; }
  G.i++; G.side = 0; G.phase = "idle"; G.paused = false;
  if (auto && G.auto && gStep().t){ if (ROUTINES[G.key].flow) gStartPhase("hold", gStep().t); else gStartPhase("prep", 5); } else renderGuide();
}
function gFinish(){
  if (G.key === "run"){ closeGuide(); if (draft && draft.type === "lop"){ draft.ran = true; draft.started = true; persistDraft(); } renderPass(); toast("Bra jobbat! Tryck på hur det kändes"); setTimeout(() => { const f = $("feelCard"); if (f) jumpTo(f); }, 80); return; }
  const name = ROUTINES[G.key].name, f = {[RFLAG[G.kind]]: true};
  if (draft){ if (RFOR[draft.type] && RFOR[draft.type][G.kind] === G.key){ Object.assign(draft, f); persistDraft(); } }
  else if (justSaved && justSaved.id && db && !readOnly && RFOR[justSaved.type] && RFOR[justSaved.type][G.kind] === G.key){ Object.assign(justSaved, f); db.doc("sessions/" + justSaved.id).update(f).catch(() => toast("Kunde inte spara – försök igen")); }
  closeGuide(); renderPass(); toast(name + " klar ✓");
}
$("gMain").addEventListener("click", () => {
  if (!G) return;
  ensureAudio();
  const st = gStep();
  if (!st.t){ gNextStep(false); return; }
  if (G.phase === "idle"){ G.auto = true; gStartPhase("prep", 5); return; }
  if (G.paused){ G.paused = false; G.end = Date.now() + G.left; renderGuide(); gTick(); }
  else { G.paused = true; G.left = G.end - Date.now(); clearTimeout(gT); renderGuide(); }
});
$("gNext").addEventListener("click", () => { if (!G) return; clearTimeout(gT); gNextStep(false); });
$("gPrev").addEventListener("click", () => { if (!G || G.i === 0) return; clearTimeout(gT); G.i--; G.side = 0; G.phase = "idle"; G.paused = false; renderGuide(); });
$("gClose").addEventListener("click", closeGuide);
document.addEventListener("keydown", e => { if (e.key === "Escape" && G) closeGuide(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && G){ keepAwake(); gTick(); } });


/* ---------- Diagram ---------- */
let gradN = 0;
function niceStep(range){ const raw = range / 4, p = Math.pow(10, Math.floor(Math.log10(raw || 1))), m = raw / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p; }
function lineChart(o){
  // o: {pts:[{t,y}], color, unit, extra:[{pts,dash,color,label}], goal}
  const W = 340, H = 196, L = 38, R = 14, T = 16, B = 26;
  const all = o.pts.concat(...(o.extra || []).map(e => e.pts));
  if (!o.pts.length) return "";
  let ymin = Math.min.apply(null, all.map(p => p.y)), ymax = Math.max.apply(null, all.map(p => p.y));
  if (o.goal != null){ ymax = Math.max(ymax, o.goal); ymin = Math.min(ymin, o.goal); }
  if (ymax - ymin < 1){ ymax += 1; ymin -= 1; }
  const st = niceStep(ymax - ymin); ymin = Math.floor(ymin / st) * st; ymax = Math.ceil(ymax / st) * st;
  let tmin = Math.min.apply(null, all.map(p => p.t)), tmax = Math.max.apply(null, all.map(p => p.t));
  if (tmax - tmin < 864e5){ tmin -= 864e5 * 3; tmax += 864e5 * 3; }
  const X = t => L + (t - tmin) / (tmax - tmin) * (W - L - R);
  const Y = y => T + (1 - (y - ymin) / (ymax - ymin)) * (H - T - B);
  const id = "g" + (++gradN);
  let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(o.label || "Diagram") + '"><defs><linearGradient id="' + id + '" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="' + o.color + '" stop-opacity=".28"/><stop offset="1" stop-color="' + o.color + '" stop-opacity="0"/></linearGradient></defs>';
  for (let v = ymin; v <= ymax + st / 2; v += st){ const y = Y(v).toFixed(1); s += '<line class="gl" x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '"/><text x="' + (L - 6) + '" y="' + (+y + 3.5) + '" text-anchor="end">' + fmt(v) + '</text>'; }
  s += '<text x="' + L + '" y="' + (H - 6) + '">' + dLabel(iso(new Date(tmin))) + '</text><text x="' + (W - R) + '" y="' + (H - 6) + '" text-anchor="end">' + dLabel(iso(new Date(tmax))) + '</text>';
  if (o.goal != null){ const gy = Y(o.goal).toFixed(1); s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + gy + '" y2="' + gy + '" stroke="var(--faint)" stroke-width="1.2" stroke-dasharray="2 4"/><text x="' + (W - R) + '" y="' + (gy - 5) + '" text-anchor="end" fill="var(--muted)">Mål ' + fmt(o.goal) + ' ' + (o.unit || '') + '</text>'; }
  (o.extra || []).forEach(e => { if (e.pts.length < 2) return; s += '<path d="' + e.pts.map((p, i) => (i ? "L" : "M") + X(p.t).toFixed(1) + " " + Y(p.y).toFixed(1)).join(" ") + '" fill="none" stroke="' + e.color + '" stroke-width="1.6" stroke-dasharray="' + (e.dash || "5 4") + '"/>'; });
  const line = o.pts.map((p, i) => (i ? "L" : "M") + X(p.t).toFixed(1) + " " + Y(p.y).toFixed(1)).join(" ");
  if (o.pts.length > 1) s += '<path d="' + line + " L" + X(o.pts[o.pts.length-1].t).toFixed(1) + " " + (H - B) + " L" + X(o.pts[0].t).toFixed(1) + " " + (H - B) + ' Z" fill="url(#' + id + ')"/><path d="' + line + '" fill="none" stroke="' + o.color + '" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>';
  o.pts.forEach((p, i) => { const last = i === o.pts.length - 1; s += '<circle cx="' + X(p.t).toFixed(1) + '" cy="' + Y(p.y).toFixed(1) + '" r="' + (last ? 5 : 2.6) + '" fill="' + (last ? o.color : "var(--surface)") + '" stroke="' + o.color + '" stroke-width="2"/>'; });
  const lp = o.pts[o.pts.length - 1], lx = X(lp.t), ly = Y(lp.y);
  s += '<text class="end" x="' + (lx > W - 60 ? lx - 9 : lx + 9).toFixed(1) + '" y="' + (ly - 9).toFixed(1) + '" text-anchor="' + (lx > W - 60 ? "end" : "start") + '">' + fmt(lp.y) + (o.unit ? " " + o.unit : "") + '</text>';
  return s + '</svg>';
}
function barChart(rows){
  const W = 340, H = 130, L = 8, R = 8, T = 18, B = 22, n = rows.length;
  const max = Math.max(1, Math.max.apply(null, rows.map(r => r.v)));
  const bw = (W - L - R) / n;
  let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Volym per vecka">';
  s += '<line class="gl" x1="' + L + '" x2="' + (W - R) + '" y1="' + (H - B) + '" y2="' + (H - B) + '"/>';
  rows.forEach((r, i) => {
    if (r.n < 1) return; // veckor före start: tom plats så staplarna behåller sin bredd
    const h = (H - T - B) * r.v / max, w = Math.min(bw * .64, 30), x = L + i * bw + (bw - w) / 2, y = H - B - h;
    s += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + Math.max(0, h).toFixed(1) + '" rx="4" fill="' + (r.cur ? "var(--ink)" : "var(--faint)") + '" opacity="' + (r.cur ? 1 : .55) + '"/>';
    s += '<text x="' + (x + w / 2).toFixed(1) + '" y="' + (H - 7) + '" text-anchor="middle">v' + r.n + '</text>';
    if (r.v) s += '<text x="' + (x + w / 2).toFixed(1) + '" y="' + (y - 5).toFixed(1) + '" text-anchor="middle" class="' + (r.cur ? "end" : "") + '">' + fmt(r.v / 1000, 1) + 't</text>';
  });
  return s + '</svg>';
}

function renderProg(){
  const el = $("v-framsteg");
  if (!progEx){ const withData = EXERCISES.find(e => e.run ? sessions.some(s => s.type === "lop") : sessions.some(s => setsOf(s, e.k))); progEx = (withData || EXERCISES[0]).k; }
  const ex = EXMAP[progEx];
  const colorVar = "var(--" + ex.c + ")";
  let body;
  if (ex.run){
    const runs = sessions.filter(s => s.type === "lop" && s.run).slice().reverse();
    const pts = runs.map(s => ({t: parseIso(s.date).getTime(), y: s.run.longest / 60, s}));
    if (!pts.length) body = '<div class="card empty"><b>Ingen löprunda sparad än</b><span>Spara rundan i Pass-fliken så ritas kurvan här – längsta joggen utan att gå, i minuter.</span></div>';
    else {
      const first = pts[0].y, cur = pts[pts.length - 1].y, best = Math.max.apply(null, pts.map(p => p.y)), diff = cur - first;
      body = '<div class="card"><div class="stats">' + stat("Start", fmt(first)) + stat("Nu", fmt(cur)) + stat("Ökning", (diff > 0 ? "+" : diff < 0 ? "−" : "±") + fmt(Math.abs(diff)), diff > 0) + stat("Rekord", fmt(best)) + '</div>' +
        '<div style="margin-top:12px">' + lineChart({pts: pts.map(p => ({t: p.t, y: p.y})), color: colorVar, unit: "min", goal: 30, label: "Längsta joggen"}) + '</div>' +
        '<div class="lead" style="margin-top:6px">Längsta joggen utan att gå, per runda · målet är 30 min</div></div>' +
        '<div class="card rows">' + pts.slice(-6).reverse().map(p => '<div class="row"><span class="num">Nivå ' + p.s.run.lvl + ' · ' + esc(lvlMain(p.s.run.lvl)) + ' · ' + esc((FEEL[p.s.run.feel] || "").toLowerCase()) + '</span><span class="d">' + dLabel(p.s.date) + '</span></div>').join("") + '</div>';
    }
  } else {
    const pts = sessions.slice().reverse().map(s => ({t: parseIso(s.date).getTime(), y: chartVal(ex, setsOf(s, ex.k)), s})).filter(p => p.y != null);
    const unit = ex.unit === "sek" ? "s" : "kg";
    if (!pts.length){
      body = '<div class="card empty"><b>Ingen data för ' + esc(ex.n.toLowerCase()) + ' än</b><span>Logga ett pass med övningen så ritas kurvan här – varje pass blir en punkt.</span></div>';
    } else {
      const first = pts[0].y, cur = pts[pts.length - 1].y, best = Math.max.apply(null, pts.map(p => p.y)), diff = cur - first;
      const pct = first ? Math.round(Math.abs(diff) / first * 100) : 0;
      body = '<div class="card"><div class="stats">' + stat("Start", fmt(first)) + stat("Nu", fmt(cur)) + stat("Ökning", (diff > 0 ? "+" : diff < 0 ? "−" : "±") + fmt(Math.abs(diff)), diff > 0) + stat("Rekord", fmt(best)) + '</div>' +
        '<div style="margin-top:12px">' + lineChart({pts: pts.map(p => ({t: p.t, y: p.y})), color: colorVar, unit, label: ex.n}) + '</div>' +
        '<div class="lead" style="margin-top:6px">' + (ex.unit === "kg" ? "Tyngsta set per pass" + (pct && diff > 0 ? " · +" + pct + " % sedan start" : "") : "Längsta hållning per pass") + '</div></div>' +
        '<div class="card rows">' + pts.slice(-6).reverse().map(p => '<div class="row"><span class="num">' + setsOf(p.s, ex.k).map(x => esc(setText(ex, x))).join(", ") + '</span><span class="d">' + dLabel(p.s.date) + '</span></div>').join("") + '</div>';
    }
  }
  // Veckovolym på gymmet
  const w0 = weekStart(START), wsNow = weekStart(today());

  const rows = [];
  for (let n = nNow - 7; n <= nNow; n++){ if (n < 1){ rows.push({n, v: 0, cur: false}); continue; } const ws = addDays(w0, (n - 1) * 7), we = addDays(ws, 7); let v = 0; sessions.forEach(s => { const d = parseIso(s.date); if (d >= ws && d < we) v += s.volume || 0; }); rows.push({n, v, cur: n === nNow}); }
  const gymCount = sessions.filter(s => isGym(s.type)).length, runCount = sessions.filter(s => s.type === "lop").length;
  el.innerHTML = '<div><div class="lead">Hur du blir starkare</div><h2 class="h2">Framsteg</h2></div>' +
    '<div class="chips" role="group" aria-label="Välj övning">' + EXERCISES.map(e => '<button class="chip" type="button" data-ex="' + e.k + '" aria-pressed="' + (e.k === progEx) + '" style="--c:var(--' + e.c + ')"><span class="dot"></span>' + esc(SHORT[e.k] || e.n) + '</button>').join("") + '</div>' +
    body +
    '<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px"><b>Volym per vecka</b><span class="lead num">' + gymCount + ' gympass · ' + runCount + (runCount === 1 ? ' runda' : ' rundor') + '</span></div>' +
    (gymCount ? barChart(rows) : '<div class="empty"><span>Staplarna fylls på när du sparar gympass. Volym = vikt × reps, i ton.</span></div>') + '</div>';

function stat(l, v, good){ return '<div class="stat"><div class="stat-l">' + esc(l) + '</div><div class="stat-v num' + (good ? " good" : "") + '">' + esc(v) + '</div></div>'; }

/* ---------- Vy: Magen (midjemått + vikt) ---------- */
// Midjemåttet är det som visar ölmagen bäst. Planen: −2 cm i månaden ner mot 94 cm. Vikten loggas bredvid om man vill.
function magePts(key){ return weights.filter(w => typeof w[key] === "number").map(w => ({t: parseIso(w.date).getTime(), y: w[key], date: w.date})); }
function rate30(pts){ const cur = pts[pts.length - 1], rec = pts.filter(p => p.t >= cur.t - 28 * 864e5); if (rec.length < 2) return null; const days = (cur.t - rec[0].t) / 864e5; return days >= 6 ? (cur.y - rec[0].y) / days * 30 : null; }
const signed = (v, d) => (v > 0 ? "+" : v < 0 ? "−" : "±") + fmt(Math.abs(v), d);
function resultCard(cm, kg){
  let tone = "", big, small;
  const kgTxt = kg.length >= 2 ? " Vikten: " + signed(kg[kg.length - 1].y - kg[0].y) + " kg." : "";
  if (cm.length < 2 || (cm[cm.length - 1].t - cm[0].t) / 864e5 < 6){
    big = cm.length ? "Mät igen om en vecka" : "Mät midjan också";
    small = cm.length ? "Samma morgon varje vecka, före frukost, i höjd med naveln. Det första som brukar hända är att magen blir mindre svullen när ölen och läsken minskar." : "Midjemåttet visar magen bättre än vågen – det är där resultatet syns först.";
  } else {
    const first = cm[0], cur = cm[cm.length - 1], diff = cur.y - first.y, days = (cur.t - first.t) / 864e5, wk = Math.max(1, Math.round(days / 7));
    if (diff <= -1){ tone = "up"; big = "−" + fmt(Math.abs(diff)) + " cm runt magen"; small = "På " + wk + (wk === 1 ? " vecka" : " veckor") + ". Det är magfett som försvinner – precis det som ska bort." + kgTxt; }
    else if (days < 21){ big = "Snart syns det"; small = "Ge det tre veckor. Ölen och läsken först – det är där kalorierna sitter. Träningen gör resten." + kgTxt; }
    else if (diff < 1){ tone = "down"; big = "Magen står still"; small = "Börja med det som ger mest: varannan öl alkoholfri och inget sött att dricka. Bocka av ärligt under Vanor." + kgTxt; }
    else { tone = "down"; big = signed(diff) + " cm sedan start"; small = "Kolla vanorna: öl, läsk och godis. Det är där det sitter – inte i träningen." + kgTxt; }
  }

const okW = w => w && w.date && (typeof w.kg === "number" || typeof w.cm === "number");
class LocalDB {
  constructor(){ this.subs = {sessions: [], weights: []}; this.sessions = store(K.sessions) || []; this.weights = store(K.weights) || {}; }
  _save(col){ if (col === "sessions") store(K.sessions, this.sessions); else store(K.weights, this.weights); this._emit(col); }
  _emit(col){ const snap = this._snap(col); this.subs[col].forEach(cb => { try { cb(snap); } catch(e){} }); }
  _snap(col){
    let docs;
    if (col === "sessions") docs = this.sessions.slice().sort((a, b) => (b.ts || 0) - (a.ts || 0)).map(d => ({id: d.id, data: () => d}));
    else docs = Object.values(this.weights).sort((a, b) => a.date < b.date ? -1 : 1).map(d => ({id: d.date, data: () => d}));
    return {docs, metadata: {fromCache: false}};
  }
  collection(name){
    const self = this;
    return {
      add: async doc => { const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8); self.sessions.push(Object.assign({id}, doc)); self._save("sessions"); return {id}; },
      onSnapshot(cb){ self.subs[name].push(cb); cb(self._snap(name)); return () => { self.subs[name] = self.subs[name].filter(x => x !== cb); }; }
    };
  }
  doc(path){
    const [col, id] = path.split("/"); const self = this;
    return {
      set: async obj => { if (col === "weights"){ self.weights[id] = obj; self._save("weights"); } },
      update: async f => { if (col === "sessions"){ const x = self.sessions.find(y => y.id === id); if (x) Object.assign(x, f); self._save("sessions"); } },
      delete: async () => { if (col === "sessions") self.sessions = self.sessions.filter(y => y.id !== id); else delete self.weights[id]; self._save(col); }
    };
  }
  importData(data){
    let n = 0;
    (data.sessions || []).forEach(sx => { if (!sx || !sx.date || !sx.type || !PROGRAM[sx.type]) return; if (!sx.id) sx.id = "imp" + (sx.ts || Date.now()) + Math.random().toString(36).slice(2, 6); if (!this.sessions.some(y => y.id === sx.id)){ this.sessions.push(sx); n++; } });
    (data.weights || []).forEach(w => { if (okW(w) && !this.weights[w.date]){ this.weights[w.date] = w; n++; } });
    const hb = data.habits && typeof data.habits === "object" ? data.habits : {};
    Object.keys(hb).forEach(date => { if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || !hb[date] || typeof hb[date] !== "object") return; const cur = habits[date] || (habits[date] = {}); Object.keys(hb[date]).forEach(k => { if (hb[date][k] === true && !cur[k]){ cur[k] = true; n++; } }); });
    store(K.habits, habits);
    this._save("sessions"); this._save("weights"); return n;
  }
}
function initDb(){
  db = new LocalDB(); dbStatus = "ready"; gotS = true; gotW = true;
  let first = true;
  db.collection("sessions").onSnapshot(snap => {
    sessions = snap.docs.map(d => Object.assign({id: d.id}, d.data())).filter(x => x.date && x.type && PROGRAM[x.type]);
    if (first){ first = false; return; }
    onData();
  });
  db.collection("weights").onSnapshot(snap => { weights = snap.docs.map(d => d.data()).filter(okW); if (view === "mage") renderMage(); });
}

function backupBlob(){
  const data = {app: "GymStart", version: 1, exported: new Date().toISOString(), sessions, weights, habits};
  return new Blob([JSON.stringify(data, null, 1)], {type: "application/json"});
}
async function exportBackup(){
  const name = "gymstart-backup-" + iso(today()) + ".json";
  const blob = backupBlob();
  try {
    const file = new File([blob], name, {type: "application/json"});
    if (navigator.canShare && navigator.canShare({files: [file]})){ await navigator.share({files: [file], title: "GymStart backup"}); store(K.backup, iso(today())); toast("Backup delad"); renderHist(); return; }
  } catch(e){ if (e && e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  store(K.backup, iso(today())); toast("Backup sparad"); renderHist();
}
function importBackup(file){
  const r = new FileReader();
  r.onload = () => { try { const data = JSON.parse(r.result); const n = db.importData(data); toast(n ? n + " poster inlästa" : "Inget nytt att läsa in"); } catch(e){ toast("Kunde inte läsa filen"); } };
  r.readAsText(file);
}

  const gr = e.target.closest("[data-gorun]");
  if (gr){ if (!(draft && draft.started && draft.type !== "lop")){ selType = "lop"; if (draft && draft.type !== "lop") draft = null; } go("pass"); return; }
  const gg = e.target.closest("[data-gguide]");
  if (gg){ openGuide(gg.dataset.gkind, gg.dataset.gguide); return; }
  const gj = e.target.closest("[data-gjump]");
  if (gj){ const t = $(gj.dataset.gjump); if (t){ if (t.tagName === "DETAILS" && t.classList.contains("groutine")) t.open = true; jumpTo(t); } return; }

/* ---------- Vanor (dagliga regler, sparas på enheten) ---------- */
const HABITS = [
  {k: "pass", n: "Dagens rörelse", auto: true},
  {k: "ol", n: "Varannan öl alkoholfri", h: "Eller lättöl. En starköl är ca 215 kcal, en alkoholfri ca 100. Ingen öl alls idag räknas också."},
  {k: "lask", n: "Inget sött att dricka", h: "Läsk, saft, juice och energidryck. Vatten, kaffe, te och Zero eller light går bra."},
  {k: "godis", n: "Godis och chips bara på lördag", sat: true, h: "Gäller bullar och kakor också. På lördag är det fritt – en påse, inte tre."},
  {k: "tallrik", n: "Middagen enligt tallriken", h: "Halva tallriken grönsaker, en kvart kött, fisk eller kyckling, en kvart potatis, ris eller pasta. Ingen andra portion."}
];
let habits = store(K.habits) || {};
let habitDate = iso(today());
const isSat = date => parseIso(date).getDay() === 6;
function habitPlan(date){
  const d = parseIso(date), k = BY_DOW[d.getDay()];
  if (sessions.some(s => s.date === date && s.type === "lop")) return {kind: "done", n: "Löprundan ✓", h: "Sparad i Pass-fliken."};
  if (k && isGym(k)) return {kind: "gym", n: PROGRAM[k].name, h: "Bockas av av sig själv när du sparar passet."};
  if (k === "lop") return {kind: "run", n: "Löprundan eller en promenad", h: "Rundan finns i Pass-fliken. Hinner du inte – 20 minuters promenad räknas också idag."};
  return {kind: "walk", n: "Promenad 20 min", h: "Rask takt, gärna efter middagen. Löprundan räknas också."};
}
function habitDone(date, hb){
  const flag = !!(habits[date] && habits[date][hb.k]);
  if (hb.sat && isSat(date)) return true;
  if (hb.k !== "pass") return flag;
  const plan = habitPlan(date);
  if (plan.kind === "done") return true;
  if (plan.kind === "gym") return flag || sessions.some(s => s.date === date && isGym(s.type));
  return flag;
}
const dayScore = date => HABITS.reduce((a, hb) => a + (habitDone(date, hb) ? 1 : 0), 0);
function habitStreak(){
  let d = today(), n = 0;
  if (dayScore(iso(d)) < HABITS.length) d = addDays(d, -1); // dagen är inte slut än
  for (let i = 0; i < 400; i++){ if (dayScore(iso(d)) < HABITS.length) break; n++; d = addDays(d, -1); }
  return n;
}
function renderVanor(){
  const el = $("v-vanor"), t = iso(today()), min = iso(addDays(today(), -13));
  if (habitDate > t) habitDate = t; if (habitDate < min) habitDate = min;
  const score = dayScore(habitDate), total = HABITS.length, streak = habitStreak();
  const isT = habitDate === t, isY = habitDate === iso(addDays(today(), -1));
  const title = isT ? "Idag" : isY ? "Igår" : dLong(habitDate);
  const week = Array.from({length: 7}, (_, i) => iso(addDays(parseIso(habitDate), i - 6))).map(d => {
    const sc = dayScore(d), pd = parseIso(d), pre = pd < START;
    return '<div class="hw' + (d === habitDate ? ' cur' : '') + '"><i class="' + (pre ? '' : sc >= total ? 'full' : sc > 0 ? 'part' : '') + '">' + (pre ? '–' : sc >= total ? '✓' : sc) + '</i><span>' + DOW[pd.getDay()] + '</span></div>';
  }).join("");
  const rows = HABITS.map(hb => {
    const done = habitDone(habitDate, hb), plan = hb.auto ? habitPlan(habitDate) : null, sat = hb.sat && isSat(habitDate);
    const name = plan ? plan.n : sat ? "Lördag – godis är okej idag" : hb.n, help = plan ? plan.h : sat ? "En påse, inte tre. Från söndag gäller regeln igen." : hb.h;
    const dots = Array.from({length: 7}, (_, i) => iso(addDays(parseIso(habitDate), i - 6))).map(d => '<i class="' + (habitDone(d, hb) ? 'on' : '') + (d === habitDate ? ' cur' : '') + '"></i>').join("");
    return '<button type="button" class="hrow' + (hb.auto || sat ? ' auto' : '') + '" data-h="' + hb.k + '" aria-pressed="' + done + '"><span class="hchk" aria-hidden="true">✓</span><span class="ht"><b>' + esc(name) + '</b><small>' + esc(help) + '</small><span class="hdots">' + dots + '<small>7 dagar</small></span></span></button>';
  }).join("");
  el.innerHTML = '<div class="hhead"><div><div class="lead">' + (isT ? "Bocka av på kvällen" : "Du kan fylla i 14 dagar bakåt") + '</div><h2 class="h2">' + esc(title) + '</h2></div>' +
    '<div class="hnav"><button type="button" data-hnav="-1" aria-label="Föregående dag"' + (habitDate <= min ? ' disabled' : '') + '>‹</button><button type="button" data-hnav="1" aria-label="Nästa dag"' + (isT ? ' disabled' : '') + '>›</button></div></div>' +
    '<div class="card"><div class="hsum"><div><div class="stat-l">' + (isT ? "Idag" : "Den dagen") + '</div><div class="hbig num' + (score >= total ? ' full' : '') + '">' + score + '<small>/' + total + '</small></div></div>' +
    '<div><div class="stat-l">Perfekta dagar i rad</div><div class="hbig num' + (streak > 0 ? ' full' : '') + '">' + streak + '<small> ' + (streak === 1 ? "dag" : "dagar") + '</small></div></div></div>' +
    '<div class="hweek">' + week + '</div></div>' +
    '<div class="hlist">' + rows + '</div>' +
    '<div class="card hrules"><div class="stat-l">Reglerna</div><div class="big">Varannan öl alkoholfri. Inget sött att dricka. Godis på lördag. Rör på dig varje dag.</div><div class="small">En perfekt dag är alla ' + total + ' bockade. Serien räknar perfekta dagar i rad – missar du en dag börjar en ny serie dagen efter. Det som syns mest på magen är ölen och läsken.</div></div>';
}
$("v-vanor").addEventListener("click", e => {
  const nav = e.target.closest("[data-hnav]"), b = e.target.closest("[data-h]");
  if (nav){ habitDate = iso(addDays(parseIso(habitDate), +nav.dataset.hnav)); renderVanor(); return; }
  if (!b) return;
  const k = b.dataset.h, hb = HABITS.find(x => x.k === k);
  if (hb.auto && habitPlan(habitDate).kind === "done") return;
  if (hb.sat && isSat(habitDate)) return;
  const day = habits[habitDate] || (habits[habitDate] = {});
  const was = habitDone(habitDate, hb);
  if (hb.auto && was && !day[k]) return; // gympasset är sparat – bocken sitter kvar
  if (was) delete day[k]; else day[k] = true;
  if (!Object.keys(day).length) delete habits[habitDate];
  store(K.habits, habits);
  renderVanor();
  if (!was && dayScore(habitDate) >= HABITS.length) toast("Perfekt dag ✓");
});

})();
