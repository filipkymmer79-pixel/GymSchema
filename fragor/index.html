<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frågor till din gymapp</title>
<meta name="description" content="Svara på frågorna, så bygger Filip en gymapp som passar dig.">
<meta name="robots" content="noindex">
<meta property="og:title" content="Frågor till din gymapp">
<meta property="og:description" content="Svara på frågorna, så bygger Filip en gymapp som passar dig.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gymfrågor">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FF5B52">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preload" href="fonts/big-shoulders-latin-900.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Big Shoulders Display";font-style:normal;font-display:swap;font-weight:900;src:url("fonts/big-shoulders-latin-900.woff2") format("woff2")}
@font-face{font-family:"Manrope";font-style:normal;font-display:swap;font-weight:200 800;src:url("fonts/manrope-latin.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Manrope";font-style:normal;font-display:swap;font-weight:200 800;src:url("../vendor/manrope-latin-ext.woff2") format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
:root{
  /* Plan: en gymaffisch som lever. Hela skärmen har delens färg, rubriken står i stor smal idrottsstil,
     teckningarna är svart bläck och vitt med hård skugga, och svaren ligger på en vit matta som studsar upp.
     Det som landar har tyngd: skivor slår i, skärmen skakar till och knappar trycks ner.
     Färgerna är GymSchemas sex, och mobilen i bilden ser ut som appen. */
  color-scheme:light;
  --ink:#111214;
  --paper:#FFFFFF;
  --muted:#5B616B;
  --red:#FF5B52; --blue:#6B95FF; --yellow:#FFC93A; --green:#3CCB7C; --orange:#FF8A4C; --purple:#A48BFF;
  --bg:#FF5B52;
  --on-bg:#111214;
  --display:"Big Shoulders Display","Arial Narrow","Helvetica Neue Condensed",Impact,sans-serif;
  --body:"Manrope",-apple-system,"Segoe UI",system-ui,sans-serif;
  --studs:cubic-bezier(.2,1.5,.4,1);
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:600;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow:hidden;transition:background .2s}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
p,h1,h2{margin:0}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.top :focus-visible,.scen :focus-visible{outline-color:var(--on-bg)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{position:relative;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;transition:background .2s}
@keyframes skak{0%,100%{transform:none}20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-3px)}60%{transform:translate(-3px,-1px)}80%{transform:translate(2px,2px)}}
.app.skak{animation:skak .26s linear}

/* ---------- Bakgrunden: skivor och tecken som driver ---------- */
.deko{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;color:var(--on-bg)}
.deko svg{position:absolute;opacity:.13;animation:deko-svav 16s ease-in-out infinite alternate}
.deko .d1{width:270px;height:270px;right:-96px;top:-70px;animation-duration:24s}
.deko .d2{width:128px;height:128px;left:-46px;top:232px;animation-duration:18s;animation-delay:-6s}
.deko .d3{width:44px;height:44px;left:46%;top:70px;animation-duration:13s;animation-delay:-3s}
.deko .d4{width:70px;height:70px;right:18px;top:318px;animation-duration:15s;animation-delay:-9s}
@keyframes deko-svav{from{transform:translate(0,0) rotate(0deg)}to{transform:translate(16px,24px) rotate(55deg)}}

/* ---------- Toppen ---------- */
.top{position:relative;z-index:3;flex:none;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 4px;min-height:62px}
.rund{flex:none;width:44px;height:44px;border-radius:50%;background:#fff;border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;padding:0;transition:transform .08s ease,box-shadow .08s ease}
.rund:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.app.mork .rund{box-shadow:0 3px 0 rgba(255,255,255,.4)}
.rund svg{display:block}
.back svg{width:18px;height:18px;stroke:var(--ink)}
.peek svg{width:22px;height:22px}
.pk-sk{fill:var(--red);transition:fill .2s}
.stang{flex:1;min-width:0;height:34px}
.stang svg{display:block;width:100%;height:100%;overflow:visible}
.st-jarn{fill:var(--on-bg);transition:fill .2s}
.sk{stroke:var(--ink);stroke-width:1.5}
@keyframes sk-in-v{0%{transform:translateX(-34px);opacity:0}65%{transform:translateX(2px);opacity:1}}
@keyframes sk-in-h{0%{transform:translateX(34px);opacity:0}65%{transform:translateX(-2px);opacity:1}}
.sk.ny.v{animation:sk-in-v .5s var(--studs) .1s backwards}
.sk.ny.h{animation:sk-in-h .5s var(--studs) .1s backwards}

/* ---------- Scenen: färgen, rubriken, siffran och teckningen ---------- */
.stage{position:relative;z-index:2;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column}
.stage.ut > *{opacity:0;transform:translateY(-12px);transition:opacity .12s ease,transform .12s ease}
.scen{--kant:18px;flex:none;padding:6px var(--kant) 0;color:var(--on-bg)}
.ogon{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:900;font-size:15px;letter-spacing:.09em;text-transform:uppercase;animation:in-v .4s ease backwards}
.ogon-prick{flex:none;width:10px;height:10px;border-radius:50%;background:var(--on-bg);animation:puls 1.6s ease-in-out infinite}
@keyframes puls{50%{transform:scale(1.6);opacity:.45}}
.scen h1{margin-top:6px;font-family:var(--display);font-weight:900;font-size:clamp(40px,12.4vw,54px);line-height:.92;letter-spacing:.01em;text-transform:uppercase;overflow-wrap:break-word}
.scen h1:focus{outline:none}
.ord{display:inline-block;animation:ord-in .5s var(--studs) backwards;animation-delay:calc(var(--n) * 55ms + 40ms)}
@keyframes ord-in{from{transform:translateY(55%) rotate(6deg);opacity:0}}
.scen-rad{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;align-items:start;margin-top:10px;min-height:128px}
.scen-v{display:flex;flex-direction:column;gap:8px;min-width:0;padding-bottom:16px}
.nr{display:flex;align-items:baseline;gap:5px;animation:in-v .45s var(--studs) .12s backwards}
.nr b{font-family:var(--display);font-weight:900;font-size:84px;line-height:.82;letter-spacing:.01em;color:transparent;-webkit-text-stroke:3px var(--on-bg)}
@supports not (-webkit-text-stroke:1px #000){.nr b{color:var(--on-bg)}}
.nr span{font-family:var(--display);font-weight:900;font-size:24px;letter-spacing:.04em}
.hint{font-size:14.5px;font-weight:700;line-height:1.3;animation:in-v .45s ease .2s backwards}
@keyframes in-v{from{transform:translateX(-16px);opacity:0}}

.art{position:relative;z-index:2;flex:none;width:138px;height:138px;border:0;background:none;padding:0;margin:0 -2px -30px 0;border-radius:24px;color:inherit;transition:transform .1s ease;animation:art-in .55s var(--studs) .1s backwards}
.art:active{transform:scale(.93)}
@keyframes art-in{from{transform:scale(.3) rotate(-20deg);opacity:0}}
.art > svg{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(3px 5px 0 rgba(17,18,20,.26));animation:svav 3.4s ease-in-out infinite}
@keyframes svav{0%,100%{transform:translateY(0) rotate(-1.4deg)}50%{transform:translateY(-5px) rotate(1.4deg)}}
.art-phone{z-index:0;width:auto;height:auto;margin:0 6px -100px 0;border-radius:22px}
.tips{position:absolute;right:2px;bottom:-24px;z-index:3;display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:99px;border:2px solid #fff;background:var(--ink);color:#fff;font-size:12px;font-weight:800;pointer-events:none;white-space:nowrap;animation:pop-in .4s var(--studs) .7s backwards}
.tips::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--yellow);animation:puls 1.4s ease-in-out infinite}

/* ---------- Mattan: det vita arket med svaren ---------- */
.matta{position:relative;z-index:1;flex:1 0 auto;margin-top:16px;background:#fff;color:var(--ink);border-top:3px solid var(--ink);border-radius:30px 30px 0 0;padding:28px 16px 22px;display:flex;flex-direction:column;gap:24px;animation:matta-in .55s ease-out backwards}
@keyframes matta-in{0%{transform:translateY(120px)}55%{transform:translateY(0)}75%{transform:translateY(10px)}100%{transform:none}}
.grupp{display:flex;flex-direction:column;gap:12px}
.grupp-topp{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.rubrik{font-family:var(--display);font-weight:900;font-size:18px;letter-spacing:.07em;text-transform:uppercase}
.link{border:0;background:none;padding:6px 0;font-size:14px;font-weight:800;text-decoration:underline;text-underline-offset:3px}
@keyframes pop-in{from{transform:scale(.55);opacity:0}}
@keyframes vald{0%{transform:scale(1)}35%{transform:scale(1.13,.88)}65%{transform:scale(.95,1.06)}100%{transform:none}}

.chips{display:flex;flex-wrap:wrap;gap:12px 8px}
.chip{border:2.5px solid var(--ink);border-radius:99px;background:#fff;min-height:46px;padding:10px 16px;font-size:15px;font-weight:800;line-height:1.15;text-align:left;box-shadow:0 4px 0 var(--ink);transition:transform .08s ease,box-shadow .08s ease,background .15s ease,color .15s ease}
.matta.in .chip{animation:pop-in .38s var(--studs) backwards;animation-delay:calc(var(--n,0) * 24ms + 160ms)}
.chip:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:0 4px 0 var(--bg)}
.matta .chip.nu,.matta .row.nu{animation:vald .32s ease-out}

.rows{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:2.5px solid var(--ink);border-radius:20px;background:#fff;box-shadow:0 4px 0 var(--ink);padding:12px 14px;transition:transform .08s ease,box-shadow .08s ease,background .15s ease}
.matta.in .row{animation:pop-in .38s var(--studs) backwards;animation-delay:calc(var(--n,0) * 22ms + 160ms)}
.row:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.row[aria-pressed="true"]{background:var(--bg)}
.row .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row b{font-size:16px;font-weight:800;line-height:1.2}
.row .d{font-size:13.5px;font-weight:600;line-height:1.3;color:var(--muted);transition:color .15s}
.row[aria-pressed="true"] .d{color:var(--ink)}
.check{flex:none;width:30px;height:30px;border-radius:50%;border:2.5px solid var(--ink);background:#fff;display:grid;place-items:center;transition:background .12s ease}
.check svg{width:15px;height:15px;stroke:#fff;stroke-dasharray:16;stroke-dashoffset:16;transition:stroke-dashoffset .25s ease .05s}
.row[aria-pressed="true"] .check{background:var(--ink)}
.row[aria-pressed="true"] .check svg{stroke-dashoffset:0}

.swatches{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px 10px}
.swatch{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:9px;font-size:13px;font-weight:800}
.matta.in .swatch{animation:pop-in .38s var(--studs) backwards;animation-delay:calc(var(--n,0) * 30ms + 160ms)}
.swatch i{width:100%;aspect-ratio:1;border-radius:20px;border:2.5px solid var(--ink);box-shadow:0 4px 0 var(--ink);display:grid;place-items:center;transition:transform .16s var(--studs),box-shadow .16s ease}
.swatch:active i{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.swatch[aria-pressed="true"] i{transform:translateY(-5px) rotate(-5deg);box-shadow:0 9px 0 var(--ink)}
.swatch i svg{width:24px;height:24px;stroke:var(--ink);opacity:0;transform:scale(.3);transition:transform .2s var(--studs),opacity .1s}
.swatch i.dark svg{stroke:#fff}
.swatch[aria-pressed="true"] i svg{opacity:1;transform:none}

.field{display:flex;flex-direction:column;gap:8px}
.field label{font-family:var(--display);font-weight:900;font-size:18px;letter-spacing:.07em;text-transform:uppercase}
.field .help{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field textarea{-webkit-appearance:none;appearance:none;width:100%;border:2.5px solid var(--ink);border-radius:18px;background:#fff;padding:13px 14px;font-size:16px;font-weight:700;line-height:1.35;outline:none;box-shadow:0 0 0 var(--ink);transition:box-shadow .12s ease,transform .12s ease}
.field input:focus,.field textarea:focus{box-shadow:0 5px 0 var(--ink);transform:translateY(-3px)}
.field textarea{min-height:104px;resize:vertical}
::placeholder{color:var(--muted);opacity:1;font-weight:600}

/* ---------- Knappraden ---------- */
.bar{position:relative;z-index:3;flex:none;display:flex;gap:10px;padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px));background:#fff}
.app.oppen .bar{background:transparent}
.primary{flex:1;min-width:0;min-height:60px;border:2.5px solid var(--ink);border-radius:99px;background:var(--ink);color:#fff;font-family:var(--display);font-weight:900;font-size:25px;letter-spacing:.06em;text-transform:uppercase;padding:0 22px;box-shadow:0 5px 0 rgba(17,18,20,.3);transition:transform .08s ease,box-shadow .08s ease,background .15s ease,color .15s ease}
.ghost{flex:none;min-height:60px;border:2.5px solid var(--ink);border-radius:99px;background:#fff;font-family:var(--display);font-weight:900;font-size:21px;letter-spacing:.06em;text-transform:uppercase;padding:0 18px;box-shadow:0 5px 0 rgba(17,18,20,.3);transition:transform .08s ease,box-shadow .08s ease}
.primary:active,.ghost:active{transform:translateY(5px);box-shadow:0 0 0 rgba(17,18,20,.3)}
.primary.tom{background:#fff;color:var(--ink)}
.primary.fylld{animation:vald .32s ease-out}
@keyframes lock{0%,100%{transform:none}50%{transform:scale(1.04)}}
.app.oppen .primary{animation:pop-in .45s var(--studs) 1.25s backwards,lock 1.8s ease-in-out 2.6s infinite}

/* ---------- Öppningen ---------- */
.oppen .scen h1{font-size:clamp(60px,20vw,88px);line-height:.86}
@keyframes slam{0%{transform:scale(2.6) rotate(-7deg);opacity:0}55%{transform:scale(.92) rotate(1deg);opacity:1}75%{transform:scale(1.05)}100%{transform:none}}
.oppen .ord,.final .ord{animation:slam .5s cubic-bezier(.2,.9,.3,1) backwards;animation-delay:calc(var(--n) * 150ms + 150ms)}
.ingress{font-size:16px;font-weight:700;line-height:1.35;margin-top:12px;max-width:30ch;animation:in-v .5s ease .65s backwards}
.yta{position:relative;height:256px;margin-top:8px}
.yta .mobil-in{position:absolute;right:4px;top:2px;border:0;background:none;padding:0;border-radius:30px;animation:mobil-in .9s cubic-bezier(.2,1.2,.3,1) .5s backwards}
@keyframes mobil-in{from{transform:translateY(360px) rotate(40deg)}}
.klister{position:absolute;z-index:2;display:inline-block;border:2.5px solid var(--ink);border-radius:99px;padding:7px 14px 8px;color:var(--ink);font-family:var(--display);font-weight:900;font-size:19px;letter-spacing:.05em;line-height:1.1;text-transform:uppercase;box-shadow:0 4px 0 var(--ink);white-space:nowrap}
@keyframes klister-in{from{transform:scale(0) rotate(-40deg)}}
.k1{left:0;top:24px;background:var(--yellow);transform:rotate(-7deg);animation:klister-in .5s var(--studs) .9s backwards}
.k2{left:8px;top:84px;background:var(--blue);transform:rotate(4deg);animation:klister-in .5s var(--studs) 1.02s backwards}
.marke{position:absolute;z-index:2;left:26px;top:140px;width:108px;height:108px;animation:klister-in .55s var(--studs) 1.14s backwards}
.marke svg{display:block;width:100%;height:100%;filter:drop-shadow(0 4px 0 #111214)}
.marke-ring{transform-origin:60px 60px;animation:snurr 16s linear infinite}
.marke text{font-family:var(--display);font-weight:900;fill:#111214}
@keyframes snurr{to{transform:rotate(360deg)}}
.kort{flex:none;margin:8px 18px 14px;background:#fff;color:var(--ink);border:2.5px solid var(--ink);border-radius:20px;box-shadow:0 4px 0 var(--ink);padding:13px 15px;font-size:13.5px;font-weight:600;line-height:1.4;animation:kort-in .5s cubic-bezier(.2,1.25,.35,1) 1.05s backwards}
@keyframes kort-in{from{transform:translateY(70px);opacity:0}}

/* ---------- Finalen ---------- */
.final .scen h1{font-size:clamp(54px,17vw,76px);line-height:.88}
.fyta{position:relative;height:388px;margin:2px calc(var(--kant) * -1) 0;display:grid;place-items:center;overflow:hidden}
.sol{position:absolute;left:50%;top:50%;width:600px;height:600px;margin:-300px 0 0 -300px;animation:sol-in .9s cubic-bezier(.2,1.2,.3,1) backwards}
.sol-ring{display:block;width:100%;height:100%;-webkit-mask-image:radial-gradient(circle,#000 28%,transparent 66%);mask-image:radial-gradient(circle,#000 28%,transparent 66%);animation:snurr 60s linear infinite;will-change:transform}
.sol svg{display:block;width:100%;height:100%}
@keyframes sol-in{from{transform:scale(.2);opacity:0}}
.fyta .ph3d{position:relative;z-index:1}
.fyta .mobil-knapp{position:relative;z-index:1;border:0;background:none;padding:0;border-radius:30px}
.k3{left:16px;top:30px;transform:rotate(-8deg);animation:klister-in .5s var(--studs) 1s backwards}
.k4{right:14px;bottom:34px;background:#fff;transform:rotate(5deg);animation:klister-in .5s var(--studs) 1.15s backwards}
.note{background:var(--ink);color:#fff;border-radius:18px;padding:14px 16px;font-size:15px;font-weight:700;line-height:1.35;animation:pop-in .35s var(--studs)}
.ruta{border:2.5px solid var(--ink);border-radius:22px;box-shadow:0 4px 0 var(--ink);padding:16px;display:flex;flex-direction:column;gap:10px;background:#fff}
.lyft-ruta{padding-top:34px;--on-bg:#111214}
.lyft{border:0;background:none;padding:0;width:100%;display:block;border-radius:16px}
.lyft svg{display:block;width:100%;max-width:340px;height:auto;margin:0 auto;overflow:visible}
@keyframes lyft{30%{transform:translateY(-20px) rotate(-1.6deg)}50%{transform:translateY(-24px) rotate(1.3deg)}70%{transform:translateY(-20px) rotate(-.6deg)}}
.lyft.upp svg{animation:lyft .8s cubic-bezier(.3,0,.3,1)}
.lyft-txt{font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:.04em;text-transform:uppercase;text-align:center;min-height:1.3em}
.lyft-txt + p{font-size:13px;font-weight:600;color:var(--muted);text-align:center}
.sum{display:flex;flex-direction:column}
.sum-row{border:0;border-top:2px solid #E3E5EA;background:none;width:100%;text-align:left;padding:12px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center}
.sum-row:first-child{border-top:0;padding-top:2px}
.sum-row:last-child{padding-bottom:2px}
.sum-row .k{grid-column:1;font-size:13px;font-weight:800;color:var(--muted)}
.sum-row .v{grid-column:1;font-size:15px;font-weight:700;overflow-wrap:anywhere;white-space:pre-line}
.sum-row .v.none{color:var(--muted);font-weight:600}
.sum-row .e{grid-column:2;grid-row:1 / span 2;font-size:13px;font-weight:800;text-decoration:underline;text-underline-offset:3px}
details.raw summary{font-size:15px;font-weight:800;cursor:pointer}
details.raw textarea{margin-top:12px;width:100%;min-height:220px;border:2.5px solid var(--ink);border-radius:16px;background:#fff;padding:12px 14px;font-size:14px;font-weight:600;line-height:1.4}

/* ---------- Skivan som slår in mellan delarna och blir nästa färg ---------- */
.wipe{position:fixed;inset:0;z-index:40;overflow:hidden}
.wipe-kant,.wipe-fyll{position:absolute;inset:0;-webkit-clip-path:circle(0px at 50% 44%);clip-path:circle(0px at 50% 44%)}
.wipe-kant{background:#111214}
.wipe-skiva{position:absolute;left:50%;top:44%;width:230px;height:230px;margin:-115px 0 0 -115px;will-change:transform}
.wipe-skiva svg{display:block;width:100%;height:100%;overflow:visible}
.wipe-skiva text{font-family:var(--display);font-weight:900}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}

/* ---------- Arket med mobilen ---------- */
dialog.sheet{position:fixed;inset:auto 0 0 0;margin:0 auto;width:min(100%,520px);max-width:100%;max-height:94%;padding:0;border:0;border-top:3px solid var(--ink);border-radius:30px 30px 0 0;background:#fff;color:var(--ink);overflow:auto}
dialog.sheet::backdrop{background:rgba(17,18,20,.6)}
dialog.sheet[open]{animation:upp .32s cubic-bezier(.2,1.2,.4,1)}
@keyframes upp{from{transform:translateY(90px);opacity:0}}
.sheet-in{padding:20px 16px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;align-items:center}
.sheet-top{align-self:stretch;display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet-top h2{font-family:var(--display);font-weight:900;font-size:32px;letter-spacing:.02em;line-height:1;text-transform:uppercase}
.sheet-visa{align-self:stretch;display:grid;place-items:center;background:var(--bg);border:2.5px solid var(--ink);border-radius:26px;box-shadow:0 4px 0 var(--ink);padding:26px 0 32px;overflow:hidden}
.sheet-in > p{font-size:14px;font-weight:600;color:var(--muted);text-align:center;max-width:32ch}

/* ---------- Mobilen: en liten GymSchema som följer svaren, med baksida så att den går att snurra ---------- */
.ph3d{display:block;perspective:900px}
.ph-tilt{display:block;position:relative;-webkit-transform-style:preserve-3d;transform-style:preserve-3d;animation:ph-svav 5.5s ease-in-out infinite}
.ph-snurr{display:block;position:relative;-webkit-transform-style:preserve-3d;transform-style:preserve-3d}
@keyframes ph-svav{0%,100%{transform:rotateY(-16deg) rotateX(5deg) rotate(3deg) translateY(0)}50%{transform:rotateY(-6deg) rotateX(2deg) rotate(5deg) translateY(-7px)}}
.ph-bak{display:block;position:absolute;inset:0;border-radius:calc(38px * var(--s,1));border:calc(7px * var(--s,1)) solid #111214;background:var(--bak,#FF5B52);box-shadow:-5px 7px 0 rgba(17,18,20,.28);transform:rotateY(180deg);-webkit-backface-visibility:hidden;backface-visibility:hidden}
.ph-bak::before{content:"";position:absolute;left:9%;top:5%;width:42%;aspect-ratio:1;border-radius:28%;background:radial-gradient(circle at 30% 30%,#fff 0 8%,#3A3D44 9% 19%,transparent 20%),radial-gradient(circle at 70% 70%,#fff 0 8%,#3A3D44 9% 19%,transparent 20%),#111214}
.ph-bak::after{content:"";position:absolute;left:50%;top:58%;width:24%;aspect-ratio:1;margin-left:-12%;border-radius:50%;border:calc(6px * var(--s,1)) solid rgba(17,18,20,.85)}
.phone{display:block;position:relative;flex:none;width:calc(220px * var(--s,1));height:calc(var(--h,440px) * var(--s,1));overflow:hidden;border-radius:calc(38px * var(--s,1));box-shadow:5px 7px 0 rgba(17,18,20,.28);transform:translateZ(0);-webkit-backface-visibility:hidden;backface-visibility:hidden}
.ph{display:block;position:absolute;left:0;top:0;width:220px;height:440px;transform:scale(var(--s,1));transform-origin:0 0;border:7px solid #111214;border-radius:38px;overflow:hidden;text-align:left;font-family:var(--body);font-weight:600;line-height:1.2;letter-spacing:0;text-transform:none;
  --p-ground:#E8E9ED;--p-tile:#FFFFFF;--p-ink:#111214;--p-muted:#5B616B;--p-on:#FFFFFF;--p-line:#C9CBD2;--ac:#FF5B52;--on-ac:#111214;
  background:var(--p-ground);color:var(--p-ink)}
.ph.dark{--p-ground:#0D0E11;--p-tile:#1B1D22;--p-ink:#F2F3F5;--p-muted:#A3A8B1;--p-on:#111214;--p-line:#3B3F47}
.ph b,.ph i{font-style:normal}
.ph-app,.ph-hej,.ph-eb,.ph-sub,.ph-play,.ph-bubbla,.ph-o,.ph-pass b,.ph-ruta b,.ph-ruta i,.ph-flikar i{display:block}
.ph-o{position:absolute;z-index:2;left:50%;top:9px;width:62px;height:18px;margin-left:-31px;border-radius:99px;background:#111214}
.ph.dark .ph-o{background:#000;box-shadow:0 0 0 1px #2A2D33}
.ph.android .ph-o{width:12px;height:12px;margin-left:-6px;top:12px}
.ph-screen{display:flex;flex-direction:column;gap:8px;padding:38px 10px 0}
.ph-app{font-size:10.5px;font-weight:800;color:var(--p-muted);padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-hej{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.05;padding:0 4px 2px;overflow-wrap:anywhere;max-height:48px;overflow:hidden}
.ph-pass{position:relative;display:flex;flex-direction:column;gap:3px;background:var(--ac);color:var(--on-ac);border-radius:22px;padding:13px 14px 14px;min-height:100px}
.ph-eb{font-size:10px;font-weight:800}
.ph-pass b{font-size:18px;font-weight:800;letter-spacing:-.02em;line-height:1.08;max-width:132px}
.ph-sub{font-size:10.5px;font-weight:700;margin-top:auto;max-width:132px}
.ph-play{position:absolute;right:12px;bottom:12px;width:34px;height:34px;border-radius:50%;background:var(--on-ac)}
.ph-play::after{content:"";position:absolute;left:13px;top:10px;border-style:solid;border-width:7px 0 7px 11px;border-color:transparent transparent transparent var(--ac)}
.ph-vecka{display:flex;justify-content:space-between;background:var(--p-tile);border-radius:18px;padding:9px 10px}
.ph-vecka i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:9.5px;font-weight:800;color:var(--p-muted);background:var(--p-ground)}
.ph-vecka i.on{background:var(--p-ink);color:var(--p-on)}
.ph-bubbla{background:var(--p-tile);border-radius:6px 18px 18px 18px;padding:9px 12px;font-size:11.5px;font-weight:700;line-height:1.25}
.ph-rutor{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ph-ruta{display:flex;flex-direction:column;justify-content:space-between;gap:8px;background:var(--p-tile);border-radius:18px;padding:10px 11px;min-height:58px}
.ph-ruta b{font-size:11px;font-weight:800}
.ph-ruta i{width:16px;height:16px;border-radius:50%;background:var(--ac)}
.ph-ruta.tom{background:none;border:2px dashed var(--p-line)}
.ph-flikar{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:2px;background:var(--p-tile);border-radius:99px;padding:5px;box-shadow:0 4px 14px rgba(0,0,0,.14)}
.ph-flikar i{flex:1 1 auto;min-width:0;text-align:center;font-size:8.5px;font-weight:800;padding:8px 4px;border-radius:99px;color:var(--p-muted);white-space:nowrap;overflow:hidden}
.ph-flikar i.on{background:var(--p-ink);color:var(--p-on)}
@keyframes ph-pop{40%{transform:scale(1.08)}}
.ph .pop{animation:ph-pop .35s ease-out}

/* ---------- Teckningarna ---------- */
.art text{font-family:var(--body);fill:var(--ink)}
.d-i{fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.d-o{stroke:var(--ink);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.d-t{stroke-width:3.2}
.d-w{fill:#fff}.d-f{fill:var(--ink)}.d-g{fill:rgba(17,18,20,.17)}

/* måltavlan */
.tg-all{transform-origin:54px 66px}
.tg-pil{opacity:0;transform:translate(24px,-24px);transition:transform .3s var(--studs),opacity .12s}
.n1 .p1,.n2 .p1,.n2 .p2,.n3 .tg-pil{opacity:1;transform:none}
.tg-star{transform-box:fill-box;transform-origin:center;transform:scale(0) rotate(-40deg);transition:transform .35s cubic-bezier(.3,1.7,.5,1)}
.star .tg-star{transform:none}
@keyframes tg-wob{25%{transform:rotate(-8deg)}60%{transform:rotate(6deg)}85%{transform:rotate(-2deg)}}
.go .tg-all{animation:tg-wob .55s ease-in-out}

/* trappan */
.st-boll{opacity:.3;transition:transform .4s cubic-bezier(.3,1.4,.5,1),opacity .2s}
.l1 .st-boll,.l2 .st-boll,.l3 .st-boll,.l4 .st-boll,.l5 .st-boll{opacity:1}
.l2 .st-boll{transform:translate(20px,-16px)}.l3 .st-boll{transform:translate(40px,-32px)}.l4 .st-boll{transform:translate(60px,-48px)}.l5 .st-boll{transform:translate(80px,-64px)}
@keyframes st-hopp{40%{transform:translateY(-16px)}70%{transform:translateY(0)}85%{transform:translateY(-5px)}}
.go .st-boll circle{animation:st-hopp .55s ease-out}
.st-flagga{transform-origin:110px 26px}
@keyframes st-vaj{30%{transform:rotate(-10deg)}70%{transform:rotate(8deg)}}
.go .st-flagga{animation:st-vaj .55s ease-in-out}

/* pulsen */
.pu{display:none;stroke-dasharray:100;stroke-dashoffset:0}
.s0 .pu0,.s1 .pu1,.s2 .pu2{display:inline}
@keyframes pu-rita{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
.go .pu{animation:pu-rita .8s ease-out}
.pu-prick{transform-box:fill-box;transform-origin:center}
@keyframes pu-blink{50%{transform:scale(1.8)}}
.go .pu-prick{animation:pu-blink .4s .7s ease-out}

/* häckarna */
.hk{opacity:0;transition:opacity .2s}
.c0 .hk.h2{opacity:.3}
.c1 .hk.h1,.c2 .hk.h1,.c2 .hk.h2,.c3 .hk{opacity:1}
.rull .hk{opacity:.22}
.hk-ok{transform-box:fill-box;transform-origin:center;transform:scale(0);transition:transform .3s cubic-bezier(.3,1.7,.5,1)}
.rull .hk-ok{transform:none}
@keyframes hk-fall{35%{transform:rotate(26deg)}70%{transform:rotate(-6deg)}}
.go .hk{animation:hk-fall .6s ease-in-out;animation-delay:calc(var(--i) * 90ms)}

/* platserna */
.pl{opacity:.45;transition:opacity .2s;transform-box:fill-box;transform-origin:50% 100%}
.pl .pl-f{fill:rgba(17,18,20,.14);transition:fill .2s}
.pl.on{opacity:1}.pl.on .pl-f{fill:#fff}
@keyframes pl-hopp{40%{transform:translateY(-9px) scale(1.04)}}
.go .pl{animation:pl-hopp .45s ease-out;animation-delay:calc(var(--i) * 80ms)}

/* kettlebellen */
.kb{transform-origin:60px 14px;transition:opacity .2s}
.tom .kb{opacity:.3}
@keyframes kb-sving{20%{transform:rotate(15deg)}50%{transform:rotate(-13deg)}75%{transform:rotate(7deg)}}
.go .kb{animation:kb-sving .9s ease-in-out}
.kb-antal{transform-box:fill-box;transform-origin:center;transform:scale(0);transition:transform .3s cubic-bezier(.3,1.7,.5,1)}
.har .kb-antal{transform:none}

/* veckan */
.vk-b{opacity:0;transform:scaleY(.3);transform-box:fill-box;transform-origin:50% 100%;transition:transform .3s var(--studs),opacity .12s}
.vk.on .vk-b{opacity:1;transform:none}
@keyframes vk-hopp{45%{transform:translateY(-9px)}}
.go .vk{animation:vk-hopp .45s ease-out;animation-delay:calc(var(--i) * 45ms)}

/* tidtagaruret */
.sw-visare{transform-origin:60px 68px;transform:rotate(var(--a,0deg));transition:transform .5s cubic-bezier(.3,1.3,.5,1)}
@keyframes sw-snurr{from{transform:rotate(var(--a,0deg))}to{transform:rotate(calc(var(--a,0deg) + 360deg))}}
.go .sw-visare{animation:sw-snurr .7s cubic-bezier(.4,0,.2,1)}
.sw-sol,.sw-mane{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.4);transition:transform .3s cubic-bezier(.3,1.7,.5,1),opacity .15s}
.sol-pa .sw-sol,.mane-pa .sw-mane{opacity:1;transform:none}

/* hanteln */
.db{transform-box:fill-box;transform-origin:center}
.db-p{fill:rgba(17,18,20,.17);transition:fill .2s}
.v1 .db-p.p1,.v2 .db-p{fill:var(--ink)}
@keyframes db-lyft{30%,55%{transform:translateY(-22px) rotate(-12deg)}}
.go .db{animation:db-lyft .8s cubic-bezier(.3,0,.3,1)}
.db-fart{opacity:0}
@keyframes db-fart{30%,55%{opacity:.6}}
.go .db-fart{animation:db-fart .8s}
.db-q{opacity:0;transition:opacity .2s}
.vet .db-q{opacity:1}

/* kroppen */
.kr{transform-box:fill-box;transform-origin:50% 100%}
.kr-d{fill:#fff;stroke:var(--ink);stroke-width:4;stroke-linejoin:round;transition:fill .15s}
.kr-d.on{fill:var(--ink)}
.kr-va{transform-origin:32px 49px}.kr-ha{transform-origin:88px 49px}
@keyframes kr-v{35%,65%{transform:rotate(125deg)}}
@keyframes kr-h{35%,65%{transform:rotate(-125deg)}}
@keyframes kr-hopp{35%,65%{transform:translateY(-6px)}}
.go .kr-va{animation:kr-v .8s ease-in-out}
.go .kr-ha{animation:kr-h .8s ease-in-out}
.go .kr{animation:kr-hopp .8s ease-in-out}

/* hjärtat */
.hj{transform-origin:60px 68px;transition:opacity .2s}
.b0 .hj{opacity:.35}
@keyframes hj-slag{0%,100%{transform:scale(1)}18%{transform:scale(1.12)}36%{transform:scale(1)}54%{transform:scale(1.07)}}
.b1 .hj{animation:hj-slag 1.7s ease-in-out infinite}
.b2 .hj{animation:hj-slag 1.15s ease-in-out infinite}
.b3 .hj{animation:hj-slag .75s ease-in-out infinite}
@keyframes hj-pop{40%{transform:scale(1.25)}}
.go .hj{animation:hj-pop .45s ease-out}

/* tummarna */
.tm{transform-box:fill-box;transform-origin:center}
.tm-f{fill:#fff;transition:fill .15s}.tm-l{stroke:var(--ink);transition:stroke .15s}
.tm.on .tm-f{fill:var(--ink)}.tm.on .tm-l{stroke:#fff}
@keyframes tm-vicka{30%{transform:rotate(-16deg)}65%{transform:rotate(10deg)}}
.go .tm{animation:tm-vicka .6s ease-in-out}
.go .tm.ner{animation-delay:.12s}

/* plåstret */
.pls-w{transform-origin:60px 62px}
@keyframes pls-vicka{25%{transform:rotate(-9deg)}60%{transform:rotate(7deg)}85%{transform:rotate(-3deg)}}
.go .pls-w{animation:pls-vicka .6s ease-in-out}
.pls-hj{transform-box:fill-box;transform-origin:center;transform:scale(0);transition:transform .3s cubic-bezier(.3,1.7,.5,1)}
.har .pls-hj{transform:none}

/* pennan */
.pn-rad{stroke-dasharray:100;stroke-dashoffset:0;opacity:.3;transition:opacity .2s}
.har .pn-rad{opacity:1}
@keyframes pn-rita{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
.go .pn-rad{animation:pn-rita .8s ease-out;opacity:1}
@keyframes pn-skriv{from{transform:translate(-60px,0)}to{transform:none}}
.go .pn-w{animation:pn-skriv .8s ease-out}

/* ikonen */
.ik{transform-origin:60px 46px}
.ik-ruta{fill:var(--red);transition:fill .2s}
@keyframes ik-skak{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
.go .ik{animation:ik-skak .22s linear 4}

@media (max-width:350px){
  .scen{--kant:16px}
  .scen h1{font-size:38px}
  .oppen .scen h1{font-size:58px}
  .final .scen h1{font-size:50px}
  .art:not(.art-phone){width:108px;height:108px}
  .nr b{font-size:66px}
  .klister{font-size:16px}
  .primary{font-size:21px;padding:0 14px}
  .ghost{font-size:18px;padding:0 14px}
  .marke{width:92px;height:92px;top:132px}
  .yta{height:232px}
}

  *,*::before,*::after{animation-duration:.01ms !important;animation-delay:0s !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;transition-delay:0s !important}
}

<script>
(function(){

    {name: 'Röd',      c: '#FF5B52'},

  var VANA = ['Har aldrig tränat på gym', 'Har provat några gånger', 'Har tränat i perioder', 'Tränar regelbundet nu', 'Har tränat i flera år'];

  var state = {a: {}, at: 'intro', edit: false, tip: 0};

  /* Frågorna. type: multi (flera val), single (ett val), rows (flera val med förklaring),

    });
    var k3 = el('span', {class: 'klister k3', text: 'Din app'});
    k3.style.background = c.bg === '#111214' ? '#FFFFFF' : c.bg;
    yta.appendChild(k3);
    yta.appendChild(el('span', {class: 'klister k4', text: 'Tryck på mobilen'}));
    s.appendChild(yta);
    stage.appendChild(s);
    if (finalNu){
      slag(s.querySelectorAll('.ord').length);
      anim(snurr, [{transform: 'translateY(300px) rotateY(-560deg) scale(.3)', opacity: 0}, {transform: 'translateY(0) rotateY(-40deg) scale(1.04)', opacity: 1, offset: .8}, {transform: 'translateY(0) rotateY(0deg) scale(1)', opacity: 1}], {duration: 1250, easing: 'cubic-bezier(.2,1,.3,1)', fill: 'backwards'});
    }

    var matta = el('section', {class: 'matta'});
    var note = el('div', {class: 'note', role: 'status', 'aria-live': 'polite', hidden: ''});
    matta.appendChild(note);

    // Stången: fullastad, och den går att lyfta
    var reps = 0;
    var lyftRuta = el('div', {class: 'ruta lyft-ruta'});
    var lyft = el('button', {type: 'button', class: 'lyft', 'aria-label': 'Lyft stången'});
    lyft.innerHTML = stangSvg(6, -1);
    var lyftTxt = el('p', {class: 'lyft-txt', role: 'status', text: '175 kg på stången'});
    lyft.addEventListener('click', function(){
      reps++;
      kor(lyft, 'upp', 820);
      surr([10, 40, 14]);
      setTimeout(skaka, 640);
      if (reps === 1 || reps % 5 === 0) FX.regn(reps % 5 === 0 ? 110 : 50);
      lyftTxt.textContent = reps === 1 ? '1 lyft. En till?' : reps === 5 ? '5 lyft. Bra set!' : reps === 10 ? '10 lyft. Nu är du uppvärmd.' : reps + ' lyft';
    });
    lyftRuta.appendChild(lyft);
    lyftRuta.appendChild(lyftTxt);
    lyftRuta.appendChild(el('p', {text: 'Tryck på stången så lyfter du den.'}));
    matta.appendChild(lyftRuta);

    var g = el('div', {class: 'grupp'});
    g.appendChild(el('div', {class: 'grupp-topp'}, [el('p', {class: 'rubrik', text: 'Dina svar'})]));
    var sum = el('div', {class: 'sum'});
    summary(list).forEach(function(r){
      var b = el('button', {type: 'button', class: 'sum-row', 'aria-label': r.k + ': ' + (r.v || 'inget svar') + '. Ändra'});
      b.appendChild(el('span', {class: 'k', text: r.k}));
      b.appendChild(el('span', {class: 'v' + (r.v ? '' : ' none'), text: r.v || 'Inget svar'}));
      b.appendChild(el('span', {class: 'e', 'aria-hidden': 'true', text: 'Ändra'}));
      b.addEventListener('click', function(){ go(r.step, {edit: true}); });
      sum.appendChild(b);
    });
    g.appendChild(sum);
    matta.appendChild(g);

    var text = summaryText(list);
    var raw = el('textarea', {id: 'raw', readonly: '', 'aria-label': 'Svaren som text'});
    raw.value = text;
    var det = el('details', {class: 'raw'}, [el('summary', {text: 'Visa svaren som text'}), raw]);
    matta.appendChild(det);
    stage.appendChild(matta);

    function say(msg){
      note.textContent = msg;
      note.hidden = false;
      try { matta.scrollIntoView({block: 'start', behavior: STILLA ? 'auto' : 'smooth'}); } catch(e){ stage.scrollTop = matta.offsetTop; }
    }
    function selectRaw(){
      det.open = true;
      try { raw.focus(); raw.select(); raw.setSelectionRange(0, text.length); } catch(e){}
    }
    function copy(btn, vila){
      var done = function(){
        say('Kopierat. Öppna ett meddelande till Filip och klistra in.');
        FX.regn(40);
        btn.textContent = 'Kopierat';
        setTimeout(function(){ if (state.at === 'klar') btn.textContent = vila; }, 2500);
      };
      var manual = function(){
        var ok = false;
        selectRaw();
        try { ok = document.execCommand('copy'); } catch(e){ ok = false; }
        if (ok) done();
        else {
          say('Det gick inte att kopiera av sig självt. Texten är markerad längst ner: håll fingret på den, välj Kopiera och klistra in i ett meddelande till Filip.');
          try { det.scrollIntoView({block: 'start'}); } catch(e){}
        }
      };
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, manual);
        else manual();
      } catch(e){ manual(); }
    }

    if (canShare){
      // Telefonens delningsmeny, som i Önskelistan. Kopiera ger samma text.
      nextBtn.textContent = 'Skicka svaren';
      nextBtn.onclick = function(){
        var miss = function(err){
          if (err && err.name === 'AbortError') return;
          copy(altBtn, 'Kopiera');
        };
        try { navigator.share({text: text}).then(function(){ say('Skickat vidare. Tack!'); FX.regn(60); }, miss); } catch(e){ miss(e); }
      };
      altBtn.hidden = false;
      altBtn.textContent = 'Kopiera';
      altBtn.onclick = function(){ copy(altBtn, 'Kopiera'); };
    } else {
      nextBtn.textContent = 'Kopiera svaren';
      nextBtn.onclick = function(){ copy(nextBtn, 'Kopiera svaren'); };
    }
  }

  // iPhone: :active fungerar först när sidan lyssnar på tryck, och sidan ska ligga rätt igen när tangentbordet stängs
  document.addEventListener('touchstart', function(){}, {passive: true});
  document.addEventListener('focusout', function(){ setTimeout(function(){ try { window.scrollTo(0, 0); } catch(e){} }, 80); });

  backBtn.hidden = true;
  load();
  render(false);

  // Sidan sparas så att den öppnas utan nät. Bara som vanlig sida, inte i en ram.
  try {
    if ('serviceWorker' in navigator && window.self === window.top && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(function(){ /* fungerar utan */ });
  } catch(e){}
})();
</script>
</body>
</html>
