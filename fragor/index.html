<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frågor till din gymapp</title>
<meta name="description" content="Svara på frågorna, så bygger Filip en gymapp som passar dig.">
<meta name="robots" content="noindex">
<meta property="og:title" content="Frågor till din gymapp">
<meta property="og:description" content="Svara på frågorna, så bygger Filip en gymapp som passar dig.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gymfrågor">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E8E9ED">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preload" href="fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Manrope";font-style:normal;font-display:swap;font-weight:200 800;src:url("fonts/manrope-latin.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Manrope";font-style:normal;font-display:swap;font-weight:200 800;src:url("../vendor/manrope-latin-ext.woff2") format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
:root{
  /* Plan: Bento, samma familj som GymSchema. Ljusgrå botten, vita rutor med stora runda hörn,
     en stor färgad ruta per del med svart text, och det som är valt blir svart.
     En kolumn, en fråga per skärm, knappen alltid längst ner. Teckningarna är svart bläck och vitt
     på den färgade rutan. Ett enda ljust läge, som appen. */
  color-scheme:light;
  --ground:#E8E9ED;
  --tile:#FFFFFF;
  --ink:#111214;
  --on-ink:#FFFFFF;
  --muted:#5B616B;
  --line:#DADBE0;
  --ring:#8A8E98;
  --red:#FF5B52; --blue:#6B95FF; --yellow:#FFC93A; --green:#3CCB7C; --orange:#FF8A4C; --purple:#A48BFF;
  --accent:var(--red);
  --on-accent:var(--ink);
  --display:"Manrope",ui-rounded,-apple-system,"Segoe UI",system-ui,sans-serif;
  --body:"Manrope",-apple-system,"Segoe UI",system-ui,sans-serif;
  --r-lg:28px; --r-md:20px; --r-sm:14px;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-weight:500;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
p,h1,h2{margin:0}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

.app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column}

/* ---------- Toppen: tillbaka, stången och mobilen ---------- */
.top{flex:none;display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 8px;min-height:68px}
.rund{flex:none;width:44px;height:44px;border:0;border-radius:50%;background:var(--tile);display:grid;place-items:center;padding:0}
.rund svg{display:block}
.back svg{width:18px;height:18px;stroke:var(--ink)}
.peek svg{width:22px;height:22px}
.pk-sk{fill:var(--red);transition:fill .2s}
.prog{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.stang{flex:1;min-width:0;height:30px}
.stang svg{display:block;width:100%;height:100%;overflow:visible}
.prog-text{flex:none;font-size:13px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.sk{stroke:var(--ink);stroke-width:1.5}
.sk.nasta{fill:none;stroke-dasharray:2.5 2.5;opacity:.55}
@keyframes sk-in-v{from{transform:translateX(-16px);opacity:0}}
@keyframes sk-in-h{from{transform:translateX(16px);opacity:0}}
.sk.ny.v{animation:sk-in-v .45s cubic-bezier(.3,1.5,.5,1)}
.sk.ny.h{animation:sk-in-h .45s cubic-bezier(.3,1.5,.5,1)}

/* ---------- Scenen ---------- */
.stage{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:4px 16px 24px;display:flex;flex-direction:column;gap:12px}
.stage > *{flex:none;animation:rise .18s ease both}
@keyframes rise{from{transform:translateY(8px)}to{transform:none}}

.hero{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;align-items:start;background:var(--accent);color:var(--on-accent);border-radius:var(--r-lg);padding:20px 14px 22px 20px;overflow:hidden;transition:background .2s ease}
.hero-txt{display:flex;flex-direction:column;gap:8px;min-width:0}
.hero .eyebrow{font-size:13px;font-weight:800}
.hero h1{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.1;letter-spacing:-.02em;text-wrap:balance;overflow-wrap:break-word}
.hero h1:focus{outline:none}
.hero .hint{font-size:15px;font-weight:600;line-height:1.35}
.art{flex:none;width:112px;height:112px;border:0;background:none;padding:0;align-self:center;border-radius:20px;color:inherit}
.art-phone{width:auto;height:auto;align-self:end;margin:0 6px -22px 0;border-radius:18px 18px 0 0}
.tips{position:absolute;right:12px;bottom:10px;display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:99px;background:var(--ink);color:#fff;font-size:12px;font-weight:800;pointer-events:none}
.tips::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--yellow);animation:puls 1.4s ease-in-out infinite}
@keyframes puls{50%{transform:scale(1.7);opacity:.5}}

.tile{background:var(--tile);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:12px}
.tile-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.group-label{font-size:15px;font-weight:800}
.link{border:0;background:none;padding:6px 0;font-size:14px;font-weight:800;text-decoration:underline;text-underline-offset:3px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;border-radius:99px;background:var(--ground);min-height:46px;padding:12px 16px;font-size:15px;font-weight:700;line-height:1.15;text-align:left;transition:background .12s ease,color .12s ease,transform .12s ease}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}

.rows{display:flex;flex-direction:column}
.row{border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left;padding:14px 0;display:flex;align-items:center;gap:14px}
.row:first-child{border-top:0;padding-top:2px}
.row:last-child{padding-bottom:2px}
.row .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row b{font-size:16px;font-weight:800;line-height:1.2}
.row .d{font-size:14px;font-weight:600;color:var(--muted);line-height:1.3}
.check{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--ring);display:grid;place-items:center;transition:background .12s ease,border-color .12s ease}
.check svg{width:14px;height:14px;stroke:var(--on-ink);opacity:0}
.row[aria-pressed="true"] .check{background:var(--ink);border-color:var(--ink)}
.row[aria-pressed="true"] .check svg{opacity:1}

.swatches{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 10px}
.swatch{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:700}
.swatch i{width:100%;aspect-ratio:1;border-radius:var(--r-md);display:grid;place-items:center;transition:transform .12s ease}
.swatch:active i{transform:scale(.94)}
.swatch i svg{width:22px;height:22px;stroke:var(--ink);opacity:0}
.swatch i.dark svg{stroke:#FFFFFF}
.swatch[aria-pressed="true"] i{box-shadow:0 0 0 3px var(--tile),0 0 0 6px var(--ink)}
.swatch[aria-pressed="true"] i svg{opacity:1}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:15px;font-weight:800}
.field .help{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field textarea{width:100%;border:2px solid transparent;border-radius:var(--r-sm);background:var(--ground);padding:13px 14px;font-size:16px;font-weight:600;line-height:1.35;outline:none}
.field input:focus,.field textarea:focus{border-color:var(--ink);background:var(--tile)}
.field textarea{min-height:104px;resize:vertical}
::placeholder{color:var(--muted);opacity:1;font-weight:500}

.bento{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini{border-radius:var(--r-lg);padding:16px;min-height:112px;display:flex;flex-direction:column;justify-content:space-between;gap:12px}
.mini b{font-family:var(--display);font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.mini span{font-size:14px;font-weight:700;line-height:1.25}
.mini.blue{background:var(--blue)}
.mini.yellow{background:var(--yellow)}
.mini.wide{grid-column:1 / -1;min-height:0;background:var(--tile)}
.mini.wide span{font-weight:600;line-height:1.4}

.note{background:var(--ink);color:var(--on-ink);border-radius:var(--r-md);padding:14px 16px;font-size:15px;font-weight:700;line-height:1.35}

/* ---------- Sista sidan ---------- */
.visa{align-items:center;gap:14px;padding-bottom:18px}
.visa .tile-head{align-self:stretch}
.visa-knapp{border:0;background:none;padding:0;border-radius:34px}
.visa > p{font-size:14px;font-weight:600;color:var(--muted);text-align:center;max-width:30ch}
.lyft-ruta{gap:8px;padding-top:30px}
.lyft{border:0;background:none;padding:0;width:100%;display:block;border-radius:16px}
.lyft svg{display:block;width:100%;max-width:340px;height:auto;margin:0 auto;overflow:visible}
@keyframes lyft{30%{transform:translateY(-20px) rotate(-1.6deg)}50%{transform:translateY(-23px) rotate(1.3deg)}70%{transform:translateY(-20px) rotate(-.6deg)}}
.lyft.upp svg{animation:lyft .8s cubic-bezier(.3,0,.3,1)}
.lyft-txt{font-size:15px;font-weight:800;text-align:center;min-height:1.4em}
.lyft-txt + p{font-size:13px;font-weight:600;color:var(--muted);text-align:center}

.sum{display:flex;flex-direction:column}
.sum-row{border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left;padding:12px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center}
.sum-row:first-child{border-top:0;padding-top:2px}
.sum-row:last-child{padding-bottom:2px}
.sum-row .k{grid-column:1;font-size:13px;font-weight:800;color:var(--muted)}
.sum-row .v{grid-column:1;font-size:15px;font-weight:700;overflow-wrap:anywhere;white-space:pre-line}
.sum-row .v.none{color:var(--muted);font-weight:600}
.sum-row .e{grid-column:2;grid-row:1 / span 2;font-size:13px;font-weight:800;text-decoration:underline;text-underline-offset:3px}

details.raw summary{font-size:15px;font-weight:800;cursor:pointer}
details.raw textarea{margin-top:12px;width:100%;min-height:220px;border:0;border-radius:var(--r-sm);background:var(--ground);padding:12px 14px;font-size:14px;font-weight:600;line-height:1.4}

.bar{flex:none;display:flex;gap:10px;padding:10px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.primary{flex:1;min-width:0;border:0;border-radius:99px;background:var(--ink);color:var(--on-ink);min-height:56px;padding:0 22px;font-size:17px;font-weight:800;transition:transform .12s ease}
.ghost{flex:none;border:0;border-radius:99px;background:var(--tile);min-height:56px;padding:0 20px;font-size:16px;font-weight:800;transition:transform .12s ease}
.primary:active,.ghost:active{transform:scale(.97)}

/* ---------- Arket med mobilen ---------- */
dialog.sheet{position:fixed;inset:auto 0 0 0;margin:0 auto;width:min(100%,520px);max-width:100%;max-height:94%;padding:0;border:0;border-radius:28px 28px 0 0;background:var(--ground);color:var(--ink);overflow:auto}
dialog.sheet::backdrop{background:rgba(17,18,20,.55)}
dialog.sheet[open]{animation:upp .28s cubic-bezier(.3,1.1,.4,1)}
@keyframes upp{from{transform:translateY(60px);opacity:0}}
.sheet-in{padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;align-items:center}
.sheet-top{align-self:stretch;display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet-top h2{font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.sheet-in > p{font-size:14px;font-weight:600;color:var(--muted);text-align:center;max-width:32ch}

/* ---------- Mobilen: en liten GymSchema som följer svaren ---------- */
.phone{display:block;position:relative;flex:none;width:calc(220px * var(--s,1));height:calc(var(--h,440px) * var(--s,1));overflow:hidden}
.ph{display:block;position:absolute;left:0;top:0;width:220px;height:440px;transform:scale(var(--s,1));transform-origin:0 0;border:7px solid #111214;border-radius:38px;overflow:hidden;text-align:left;font-family:var(--body);line-height:1.2;
  --p-ground:#E8E9ED;--p-tile:#FFFFFF;--p-ink:#111214;--p-muted:#5B616B;--p-on:#FFFFFF;--p-line:#C9CBD2;--ac:#FF5B52;--on-ac:#111214;
  background:var(--p-ground);color:var(--p-ink)}
.ph.dark{--p-ground:#0D0E11;--p-tile:#1B1D22;--p-ink:#F2F3F5;--p-muted:#A3A8B1;--p-on:#111214;--p-line:#3B3F47}
.ph b,.ph i{font-style:normal}
.ph-app,.ph-hej,.ph-eb,.ph-sub,.ph-play,.ph-bubbla,.ph-o,.ph-pass b,.ph-ruta b,.ph-ruta i,.ph-flikar i{display:block}
.ph-o{position:absolute;z-index:2;left:50%;top:9px;width:62px;height:18px;margin-left:-31px;border-radius:99px;background:#111214}
.ph.dark .ph-o{background:#000;box-shadow:0 0 0 1px #2A2D33}
.ph.android .ph-o{width:12px;height:12px;margin-left:-6px;top:12px}
.ph-screen{display:flex;flex-direction:column;gap:8px;padding:38px 10px 0}
.ph-app{font-size:10.5px;font-weight:800;color:var(--p-muted);padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-hej{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.05;padding:0 4px 2px;overflow-wrap:anywhere;max-height:48px;overflow:hidden}
.ph-pass{position:relative;display:flex;flex-direction:column;gap:3px;background:var(--ac);color:var(--on-ac);border-radius:22px;padding:13px 14px 14px;min-height:100px}
.ph-eb{font-size:10px;font-weight:800}
.ph-pass b{font-size:18px;font-weight:800;letter-spacing:-.02em;line-height:1.08;max-width:132px}
.ph-sub{font-size:10.5px;font-weight:700;margin-top:auto;max-width:132px}
.ph-play{position:absolute;right:12px;bottom:12px;width:34px;height:34px;border-radius:50%;background:var(--on-ac)}
.ph-play::after{content:"";position:absolute;left:13px;top:10px;border-style:solid;border-width:7px 0 7px 11px;border-color:transparent transparent transparent var(--ac)}
.ph-vecka{display:flex;justify-content:space-between;background:var(--p-tile);border-radius:18px;padding:9px 10px}
.ph-vecka i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:9.5px;font-weight:800;color:var(--p-muted);background:var(--p-ground)}
.ph-vecka i.on{background:var(--p-ink);color:var(--p-on)}
.ph-bubbla{background:var(--p-tile);border-radius:6px 18px 18px 18px;padding:9px 12px;font-size:11.5px;font-weight:700;line-height:1.25}
.ph-rutor{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ph-ruta{display:flex;flex-direction:column;justify-content:space-between;gap:8px;background:var(--p-tile);border-radius:18px;padding:10px 11px;min-height:58px}
.ph-ruta b{font-size:11px;font-weight:800}
.ph-ruta i{width:16px;height:16px;border-radius:50%;background:var(--ac)}
.ph-ruta.tom{background:none;border:2px dashed var(--p-line)}
.ph-flikar{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:2px;background:var(--p-tile);border-radius:99px;padding:5px;box-shadow:0 4px 14px rgba(0,0,0,.14)}
.ph-flikar i{flex:1 1 auto;min-width:0;text-align:center;font-size:8.5px;font-weight:800;padding:8px 4px;border-radius:99px;color:var(--p-muted);white-space:nowrap;overflow:hidden}
.ph-flikar i.on{background:var(--p-ink);color:var(--p-on)}
@keyframes ph-pop{40%{transform:scale(1.07)}}
.ph .pop{animation:ph-pop .35s ease-out}

/* ---------- Teckningarna ---------- */
.art svg{display:block;width:100%;height:100%;overflow:visible;transition:transform .12s ease}
.art:active svg{transform:scale(.95)}
.art text{font-family:var(--body);fill:var(--ink)}
.d-i{fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.d-o{stroke:var(--ink);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.d-t{stroke-width:3.2}
.d-w{fill:#fff}.d-f{fill:var(--ink)}.d-g{fill:rgba(17,18,20,.17)}

/* måltavlan */
.tg-all{transform-origin:54px 66px}
.tg-pil{opacity:0;transform:translate(24px,-24px);transition:transform .3s cubic-bezier(.3,1.5,.5,1),opacity .12s}
.n1 .p1,.n2 .p1,.n2 .p2,.n3 .tg-pil{opacity:1;transform:none}
.tg-star{transform-box:fill-box;transform-origin:center;transform:scale(0) rotate(-40deg);transition:transform .35s cubic-bezier(.3,1.7,.5,1)}
.star .tg-star{transform:none}
@keyframes tg-wob{25%{transform:rotate(-8deg)}60%{transform:rotate(6deg)}85%{transform:rotate(-2deg)}}
.go .tg-all{animation:tg-wob .55s ease-in-out}

/* trappan */
.st-boll{opacity:.3;transition:transform .4s cubic-bezier(.3,1.4,.5,1),opacity .2s}
.l1 .st-boll,.l2 .st-boll,.l3 .st-boll,.l4 .st-boll,.l5 .st-boll{opacity:1}
.l2 .st-boll{transform:translate(20px,-16px)}.l3 .st-boll{transform:translate(40px,-32px)}.l4 .st-boll{transform:translate(60px,-48px)}.l5 .st-boll{transform:translate(80px,-64px)}
@keyframes st-hopp{40%{transform:translateY(-16px)}70%{transform:translateY(0)}85%{transform:translateY(-5px)}}
.go .st-boll circle{animation:st-hopp .55s ease-out}
.st-flagga{transform-origin:110px 26px}
@keyframes st-vaj{30%{transform:rotate(-10deg)}70%{transform:rotate(8deg)}}
.go .st-flagga{animation:st-vaj .55s ease-in-out}

/* pulsen */
.pu{display:none;stroke-dasharray:100;stroke-dashoffset:0}
.s0 .pu0,.s1 .pu1,.s2 .pu2{display:inline}
@keyframes pu-rita{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
.go .pu{animation:pu-rita .8s ease-out}
.pu-prick{transform-box:fill-box;transform-origin:center}
@keyframes pu-blink{50%{transform:scale(1.8)}}
.go .pu-prick{animation:pu-blink .4s .7s ease-out}

/* häckarna */
.hk{opacity:0;transition:opacity .2s}
.c0 .hk.h2{opacity:.3}
.c1 .hk.h1,.c2 .hk.h1,.c2 .hk.h2,.c3 .hk{opacity:1}
.rull .hk{opacity:.22}
.hk-ok{transform-box:fill-box;transform-origin:center;transform:scale(0);transition:transform .3s cubic-bezier(.3,1.7,.5,1)}
.rull .hk-ok{transform:none}
@keyframes hk-fall{35%{transform:rotate(26deg)}70%{transform:rotate(-6deg)}}
.go .hk{animation:hk-fall .6s ease-in-out;animation-delay:calc(var(--i) * 90ms)}

/* platserna */
.pl{opacity:.45;transition:opacity .2s;transform-box:fill-box;transform-origin:50% 100%}
.pl .pl-f{fill:rgba(17,18,20,.14);transition:fill .2s}
.pl.on{opacity:1}.pl.on .pl-f{fill:#fff}
@keyframes pl-hopp{40%{transform:translateY(-9px) scale(1.04)}}
.go .pl{animation:pl-hopp .45s ease-out;animation-delay:calc(var(--i) * 80ms)}

/* kettlebellen */
.kb{transform-origin:60px 14px;transition:opacity .2s}
.tom .kb{opacity:.3}
@keyframes kb-sving{20%{transform:rotate(15deg)}50%{transform:rotate(-13deg)}75%{transform:rotate(7deg)}}
.go .kb{animation:kb-sving .9s ease-in-out}
.kb-antal{transform-box:fill-box;transform-origin:center;transform:scale(0);transition:transform .3s cubic-bezier(.3,1.7,.5,1)}
.har .kb-antal{transform:none}

/* veckan */

    },
    body: {
      svg: '<g class="kr"><path class="kr-d k-rygg" d="M38 32H82L72 74H48Z"/><circle class="d-w d-o" style="stroke-width:4" cx="60" cy="15" r="10"/><rect class="kr-d k-armar kr-va" x="26.5" y="46" width="11" height="34" rx="5.5"/><rect class="kr-d k-armar kr-ha" x="82.5" y="46" width="11" height="34" rx="5.5"/><circle class="kr-d k-axlar" cx="37" cy="37" r="9"/><circle class="kr-d k-axlar" cx="83" cy="37" r="9"/><rect class="kr-d k-brost" x="46" y="30" width="28" height="20" rx="7"/><rect class="kr-d k-mage" x="49" y="52" width="22" height="20" rx="6"/><rect class="kr-d k-rumpa" x="45" y="74" width="30" height="14" rx="7"/><rect class="kr-d k-ben" x="45" y="90" width="13" height="28" rx="6.5"/><rect class="kr-d k-ben" x="62" y="90" width="13" height="28" rx="6.5"/></g>',
      ms: 850,
      sync: function(r){
        var f = arr('fokus'), alla = f.indexOf('Hela kroppen lika') >= 0;
        Object.keys(KROPP).forEach(function(n){ var on = alla || f.indexOf(n) >= 0; each(r.querySelectorAll('.' + KROPP[n]), function(e){ e.classList.toggle('on', on); }); });
      }
    },
    heart: {
      svg: '<g class="hj"><path class="d-w d-o" d="M60 104C22 78 12 52 26 38c12-12 28-6 34 8c6-14 22-20 34-8c14 14 4 40-34 66Z"/><path class="d-i d-t" d="M32 64h13l5-11 9 22 6-13h23"/></g>',
      ms: 480,
      sync: function(r){ klass(r, 'b', ['Nej, bara styrka', 'Lite, som uppvärmning', 'Ja, ett pass i veckan', 'Ja, flera pass i veckan'].indexOf(str('kondition')), 3); }
    },
    thumbs: {
      svg: '<g class="tm upp"><g transform="translate(10 32)">' + tumme() + '</g></g><g class="tm ner"><g transform="translate(64 30) rotate(180 22.5 27)">' + tumme() + '</g></g>',
      ms: 760,
      sync: function(r){ r.querySelector('.upp').classList.toggle('on', !!str('gillar').trim()); r.querySelector('.ner').classList.toggle('on', !!str('slipper').trim()); }
    },
    plaster: {
      svg: '<g class="pls-w"><g transform="rotate(-28 60 62)"><rect class="d-w d-o" x="12" y="46" width="96" height="32" rx="16"/><rect class="d-g" x="45" y="48.5" width="30" height="27"/><path class="d-i d-t" d="M45 48v28M75 48v28"/><g class="d-f"><circle cx="24" cy="57" r="2.3"/><circle cx="33" cy="62" r="2.3"/><circle cx="24" cy="67" r="2.3"/><circle cx="96" cy="57" r="2.3"/><circle cx="87" cy="62" r="2.3"/><circle cx="96" cy="67" r="2.3"/></g></g></g><g class="pls-hj"><path class="d-f" d="M98 36c-10-7-13-13-9-17c3-3 8-1 9 3c1-4 6-6 9-3c4 4 1 10-9 17Z"/></g>',
      ms: 650,
      sync: function(r){ r.classList.toggle('har', !!str('hansyn').trim()); }
    },
    pencil: {
      svg: '<path class="d-i pn-rad" pathLength="100" d="M12 102c7-12 13 9 21 0s13 9 21 0s13 9 20-2"/><g class="pn-w"><g transform="translate(76 98) rotate(28)"><rect class="d-w d-o" x="-10" y="-72" width="20" height="52"/><rect class="d-f" x="-10" y="-74" width="20" height="13" rx="3"/><path class="d-w d-o" d="M-10-20L0 0L10-20Z"/><path class="d-f" d="M-3.6-7.2L0 0L3.6-7.2Z"/></g></g>',
      ms: 850,
      sync: function(r){ r.classList.toggle('har', !!str('ovrigt').trim()); }
    },
    icon: {
      svg: '<g class="ik"><rect class="ik-ruta d-o" x="30" y="16" width="60" height="60" rx="17"/><text class="ik-bokstav" x="60" y="59" text-anchor="middle" font-size="36" font-weight="800">?</text></g><text class="ik-namn" x="60" y="98" text-anchor="middle" font-size="13" font-weight="800">Din app</text><circle class="d-f" cx="50" cy="113" r="2.6"/><circle class="d-g" cx="60" cy="113" r="2.6"/><circle class="d-g" cx="70" cy="113" r="2.6"/>',
      ms: 900,
      sync: function(r){
        var c = appFarg(), n = str('appnamn').trim(), tecken = n ? (Array.from ? Array.from(n) : n.split('')) : [];
        r.querySelector('.ik-ruta').style.fill = c.bg;
        var b = r.querySelector('.ik-bokstav');
        b.style.fill = c.on;
        b.textContent = tecken.length ? tecken[0].toUpperCase() : '?';
        r.querySelector('.ik-namn').textContent = !n ? 'Din app' : tecken.length > 12 ? tecken.slice(0, 11).join('') + '…' : n;
      }
    }
  };

  /* ---------- fält ---------- */
  var current = null;   // steget som visas
  var artBtn = null;    // knappen med teckningen eller mobilen
  var hintEl = null;
  var armTimer = null;  // Börja om: andra trycket inom fyra sekunder rensar

  function accentFor(s){
    if (s && s.id === 'utseende'){
      var sw = farg();
      if (sw) return {bg: sw.c, on: sw.dark ? '#FFFFFF' : '#111214'};
    }
    return {bg: 'var(--' + (s ? SECTIONS[secIndex(s.sec)].color : 'red') + ')', on: 'var(--ink)'};
  }
  function setAccent(a){
    root.style.setProperty('--accent', a.bg);
    root.style.setProperty('--on-accent', a.on);
  }
  function hero(eyebrow, title, hint, art){
    var h = el('section', {class: 'hero'});
    var t = el('div', {class: 'hero-txt'});
    t.appendChild(el('p', {class: 'eyebrow', text: eyebrow}));
    t.appendChild(el('h1', {id: 'q', tabindex: '-1', text: title}));
    hintEl = el('p', {class: 'hint', text: hint || ''});
    hintEl.hidden = !hint;
    t.appendChild(hintEl);
    h.appendChild(t);
    if (art) h.appendChild(art);
    return h;
  }
  function phoneBtn(part){
    var b = el('button', {type: 'button', class: 'art art-phone', 'aria-label': 'Din app hittills. Tryck för att se den större.'});
    b.appendChild(phone(.47, 320, part));
    b.addEventListener('click', openSheet);
    return b;
  }
  function artFor(s){
    if (s.art === 'phone') return phoneBtn(null);
    var a = ART[s.art];
    if (!a) return null;
    var b = el('button', {type: 'button', class: 'art', 'aria-label': 'Bilden rör sig när du trycker på den'});
    b.innerHTML = '<svg viewBox="0 0 120 120" aria-hidden="true" focusable="false">' + a.svg + '</svg>';
    b.addEventListener('click', function(){
      kor(b.firstChild, 'go', a.ms);
      surr(8);
      if (!state.tip){ state.tip = 1; save(); var t = stage.querySelector('.tips'); if (t) t.parentNode.removeChild(t); }
    });
    return b;
  }
  function syncArt(pop){
    if (!current || !artBtn) return;
    if (current.art === 'phone'){
      artBtn.textContent = '';
      artBtn.appendChild(phone(.47, 320, pop ? current.part : null));
    } else if (ART[current.art]) ART[current.art].sync(artBtn.firstChild);
  }
  function changed(pop){
    save();
    paintPeek();
    if (!current) return;
    nextBtn.textContent = state.edit ? 'Klar' : (stepHas(current) ? 'Nästa' : 'Hoppa över');
    setAccent(accentFor(current));
    syncArt(pop);
    if (current.id === 'ton' && hintEl){
      var t = tonRad();
      hintEl.textContent = t ? '”' + t + '”' : current.hint;
    }
  }
  function paint(box, f){
    each(box.querySelectorAll('[data-o]'), function(b){
      b.setAttribute('aria-pressed', String(isOn(f, b.getAttribute('data-o'))));
    });
  }
  function wire(box, f, after){
    box.addEventListener('click', function(ev){
      var b = ev.target.closest ? ev.target.closest('[data-o]') : null;
      if (!b || !box.contains(b)) return;
      pick(f, b.getAttribute('data-o'));
      paint(box, f);
      surr(6);
      if (after) after();
      changed(true);
    });
    paint(box, f);
  }
  function fieldTile(f){
    var tile = el('div', {class: 'tile'});
    var labelId = 'q';

    if (f.type === 'text' || f.type === 'area'){
      var id = 'f-' + f.key;
      var w = el('div', {class: 'field'});
      w.appendChild(el('label', {'for': id, text: f.label}));
      var inp = f.type === 'area'
        ? el('textarea', {id: id, rows: '4', maxlength: String(f.max || 600), placeholder: f.placeholder || ''})
        : el('input', {id: id, type: 'text', maxlength: String(f.max || 80), placeholder: f.placeholder || '', autocomplete: f.auto || 'off', enterkeyhint: 'next'});
      inp.value = str(f.key);
      inp.addEventListener('input', function(){
        if (inp.value.trim()) state.a[f.key] = inp.value; else delete state.a[f.key];
        changed(true);
      });
      if (f.type === 'text') inp.addEventListener('keydown', function(ev){
        if (ev.key === 'Enter'){ ev.preventDefault(); inp.blur(); nextBtn.click(); }
      });
      w.appendChild(inp);
      if (f.help) w.appendChild(el('p', {class: 'help', text: f.help}));
      tile.appendChild(w);
      return tile;
    }

    if (f.label){
      labelId = 'l-' + f.key;
      tile.appendChild(el('div', {class: 'tile-head'}, [el('p', {class: 'group-label', id: labelId, text: f.label})]));
    }
    var box;
    if (f.type === 'multi' || f.type === 'single'){
      box = el('div', {class: 'chips', role: 'group', 'aria-labelledby': labelId});
      opts(f).forEach(function(o){ box.appendChild(el('button', {type: 'button', class: 'chip', 'aria-pressed': 'false', 'data-o': o, text: o})); });
      wire(box, f);
    } else if (f.type === 'rows' || f.type === 'pick'){
      box = el('div', {class: 'rows', role: 'group', 'aria-labelledby': labelId});
      opts(f).forEach(function(o){
        var b = el('button', {type: 'button', class: 'row', 'aria-pressed': 'false', 'data-o': o.t});
        b.appendChild(el('span', {class: 'txt'}, [el('b', {text: o.t}), el('span', {class: 'd', text: o.d})]));
        var c = el('span', {class: 'check', 'aria-hidden': 'true'});
        c.innerHTML = CHECK;
        b.appendChild(c);
        box.appendChild(b);
      });
      var allBtn = null;
      var syncAll = function(){ if (allBtn) allBtn.textContent = arr(f.key).length === optNames(f).length ? 'Rensa' : 'Välj alla'; };
      if (f.all){
        allBtn = el('button', {type: 'button', class: 'link'});
        allBtn.addEventListener('click', function(){
          if (arr(f.key).length === optNames(f).length) delete state.a[f.key];
          else state.a[f.key] = optNames(f);
          paint(box, f); syncAll(); changed(true);
        });
        tile.appendChild(el('div', {class: 'tile-head'}, [el('p', {class: 'group-label', text: 'Välj så många du vill'}), allBtn]));
      }
      wire(box, f, syncAll);
      syncAll();
    } else if (f.type === 'color'){
      box = el('div', {class: 'swatches', role: 'group', 'aria-labelledby': labelId});
      SWATCHES.forEach(function(s){
        var b = el('button', {type: 'button', class: 'swatch', 'aria-pressed': 'false', 'data-o': s.name});
        var i = el('i', {'aria-hidden': 'true', class: s.dark ? 'dark' : ''});
        i.style.background = s.c;
        i.innerHTML = CHECK;
        b.appendChild(i);
        b.appendChild(el('span', {text: s.name}));
        box.appendChild(b);
      });
      wire(box, f);
    }
    tile.appendChild(box);
    return tile;
  }

  /* ---------- skärmarna ---------- */
  function go(at, edit, fest){
    state.at = at;
    state.edit = !!edit;
    tidy();
    save();
    render(true);
    if (fest){ konfetti(110); surr([12, 60, 18]); }
  }
  function render(focus){
    tidy();
    var list = steps();
    if (state.at !== 'intro' && state.at !== 'klar' && !list.some(function(s){ return s.id === state.at; })) state.at = 'intro';
    stage.textContent = '';
    current = null;
    artBtn = null;
    hintEl = null;
    altBtn.hidden = true;
    altBtn.onclick = null;
    clearTimeout(armTimer);
    paintPeek();
    if (state.at === 'intro') drawIntro(list);
    else if (state.at === 'klar') drawDone(list);
    else drawStep(list);
    stage.scrollTop = 0;
    if (focus){
      var h = $('q');
      if (h) try { h.focus({preventScroll: true}); } catch(e){ h.focus(); }
    }
  }

  function drawIntro(list){
    setAccent(accentFor(null));
    setProgress(0, -1, 'Drygt 20 frågor');
    backBtn.hidden = true;
    artBtn = phoneBtn(null);
    current = null;
    stage.appendChild(hero('Din egen gymapp', 'Hur vill du ha din gymapp?', 'Filip bygger en gymapp åt dig. Den blir som hans, fast gjord för dig. Mobilen här visar hur den blir medan du svarar.', artBtn));
    var g = el('div', {class: 'bento'});
    g.appendChild(el('div', {class: 'mini blue'}, [el('b', {text: 'Ca 5 min'}), el('span', {text: 'Mest att trycka på, lite att skriva.'})]));
    g.appendChild(el('div', {class: 'mini yellow'}, [el('b', {text: 'Hoppa över'}), el('span', {text: 'det du inte vill svara på.'})]));
    g.appendChild(el('div', {class: 'mini wide'}, [el('span', {text: 'På slutet skickar du svaren själv till Filip. Fram till dess sparas de bara här, på din egen mobil eller dator. Filip bygger appen ihop med Claude, en AI, som läser svaren.'})]));
    stage.appendChild(g);

    var started = anyAnswer();
    nextBtn.textContent = started ? 'Fortsätt' : 'Börja';
    nextBtn.onclick = function(){ go(list[0].id); };
    if (started){
      var armed = false;
      altBtn.hidden = false;
      altBtn.textContent = 'Börja om';
      altBtn.onclick = function(){
        if (!armed){
          armed = true;
          altBtn.textContent = 'Rensa allt?';
          armTimer = setTimeout(function(){ armed = false; altBtn.textContent = 'Börja om'; }, 4000);
          return;
        }
        state.a = {};
        go('intro');
      };
    }
  }

  function drawStep(list){
    var i = 0;
    list.forEach(function(s, n){ if (s.id === state.at) i = n; });
    var s = list[i], si = secIndex(s.sec);
    current = s;
    setAccent(accentFor(s));
    setProgress(si, si, (i + 1) + ' av ' + list.length);
    backBtn.hidden = false;
    backBtn.onclick = function(){
      if (state.edit) go('klar');
      else go(i > 0 ? list[i - 1].id : 'intro');
    };
    artBtn = artFor(s);
    var h = hero(SECTIONS[si].name, s.title, s.hint, artBtn);
    if (artBtn && s.art !== 'phone' && !state.tip) h.appendChild(el('span', {class: 'tips', text: 'Tryck på bilden'}));
    stage.appendChild(h);
    s.fields.forEach(function(f){ stage.appendChild(fieldTile(f)); });
    nextBtn.onclick = function(){
      if (state.edit) go('klar');
      else {
        var now = steps(), at = 0;
        now.forEach(function(x, n){ if (x.id === s.id) at = n; });
        if (at < now.length - 1) go(now[at + 1].id); else go('klar', false, true);
      }
    };
    changed(false);
  }

  function drawDone(list){
    setAccent({bg: 'var(--purple)', on: 'var(--ink)'});
    setProgress(6, -1, 'Klart');
    backBtn.hidden = false;
    backBtn.onclick = function(){ go(list[list.length - 1].id); };

    var canShare = false;
    try { canShare = window.self === window.top && typeof navigator.share === 'function'; } catch(e){ canShare = false; }

    var name = str('namn').trim();
    stage.appendChild(hero(name ? 'Tack, ' + name : 'Klart', 'Skicka svaren till Filip',
      canShare ? 'Tryck på Skicka svaren här nere och välj Filip.' : 'Tryck på Kopiera svaren här nere och klistra in dem i ett meddelande till Filip.', null));

    var note = el('div', {class: 'note', role: 'status', 'aria-live': 'polite', hidden: ''});
    stage.appendChild(note);

    // Mobilen: appen som svaren har byggt
    var visa = el('div', {class: 'tile visa'});
    visa.appendChild(el('div', {class: 'tile-head'}, [el('p', {class: 'group-label', text: 'Din app'})]));
    var vb = el('button', {type: 'button', class: 'visa-knapp', 'aria-label': 'Din app. Tryck för att se den större.'});
    vb.appendChild(phone(.8, 0, null));
    vb.addEventListener('click', openSheet);
    visa.appendChild(vb);
    visa.appendChild(el('p', {text: 'Så här ser den ut med det du har svarat. Filip bygger den riktiga.'}));
    stage.appendChild(visa);

    // Stången: fullastad, och den går att lyfta
    var reps = 0;
    var lyftRuta = el('div', {class: 'tile lyft-ruta'});
    var lyft = el('button', {type: 'button', class: 'lyft', 'aria-label': 'Lyft stången'});
    lyft.innerHTML = stangSvg(6, -1, -1);
    var lyftTxt = el('p', {class: 'lyft-txt', role: 'status', text: 'Sex delar klara. 175 kg på stången.'});
    lyft.addEventListener('click', function(){
      reps++;
      kor(lyft, 'upp', 820);
      surr([10, 40, 14]);
      if (reps === 1 || reps % 5 === 0) konfetti(reps % 5 === 0 ? 100 : 50);
      lyftTxt.textContent = reps === 1 ? '1 lyft. En till?' : reps === 5 ? '5 lyft. Bra set!' : reps === 10 ? '10 lyft. Nu är du uppvärmd.' : reps + ' lyft.';
    });
    lyftRuta.appendChild(lyft);
    lyftRuta.appendChild(lyftTxt);
    lyftRuta.appendChild(el('p', {text: 'Tryck på stången så lyfter du den.'}));
    stage.appendChild(lyftRuta);

    var tile = el('div', {class: 'tile'});
    tile.appendChild(el('div', {class: 'tile-head'}, [el('p', {class: 'group-label', text: 'Dina svar'})]));
    var sum = el('div', {class: 'sum'});
    summary(list).forEach(function(r){
      var b = el('button', {type: 'button', class: 'sum-row', 'aria-label': r.k + ': ' + (r.v || 'inget svar') + '. Ändra'});
      b.appendChild(el('span', {class: 'k', text: r.k}));
      b.appendChild(el('span', {class: 'v' + (r.v ? '' : ' none'), text: r.v || 'Inget svar'}));
      b.appendChild(el('span', {class: 'e', 'aria-hidden': 'true', text: 'Ändra'}));
      b.addEventListener('click', function(){ go(r.step, true); });
      sum.appendChild(b);
    });
    tile.appendChild(sum);
    stage.appendChild(tile);

    var text = summaryText(list);
    var raw = el('textarea', {id: 'raw', readonly: '', 'aria-label': 'Svaren som text'});
    raw.value = text;
    var det = el('details', {class: 'raw'}, [el('summary', {text: 'Visa svaren som text'}), raw]);
    stage.appendChild(el('div', {class: 'tile'}, [det]));

    function say(msg){ note.textContent = msg; note.hidden = false; stage.scrollTop = 0; }
    function selectRaw(){
      det.open = true;
      try { raw.focus(); raw.select(); raw.setSelectionRange(0, text.length); } catch(e){}
    }
    function copy(btn, vila){
      var done = function(){
        say('Kopierat. Öppna ett meddelande till Filip och klistra in.');
        btn.textContent = 'Kopierat';
        setTimeout(function(){ if (state.at === 'klar') btn.textContent = vila; }, 2500);
      };
      var manual = function(){
        var ok = false;
        selectRaw();
        try { ok = document.execCommand('copy'); } catch(e){ ok = false; }
        if (ok) done();
        else {
          say('Det gick inte att kopiera av sig självt. Texten är markerad längst ner: håll fingret på den, välj Kopiera och klistra in i ett meddelande till Filip.');
          try { det.scrollIntoView({block: 'start'}); } catch(e){}
        }
      };
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, manual);
        else manual();
      } catch(e){ manual(); }
    }

    if (canShare){
      // Telefonens delningsmeny, som i Önskelistan. Kopiera ger samma text.
      nextBtn.textContent = 'Skicka svaren';
      nextBtn.onclick = function(){
        var miss = function(err){
          if (err && err.name === 'AbortError') return;
          copy(altBtn, 'Kopiera');
        };
        try { navigator.share({text: text}).then(function(){ say('Skickat vidare. Tack!'); }, miss); } catch(e){ miss(e); }
      };
      altBtn.hidden = false;
      altBtn.textContent = 'Kopiera';
      altBtn.onclick = function(){ copy(altBtn, 'Kopiera'); };
    } else {
      nextBtn.textContent = 'Kopiera svaren';
      nextBtn.onclick = function(){ copy(nextBtn, 'Kopiera svaren'); };
    }
  }

  // iPhone: :active fungerar först när sidan lyssnar på tryck, och sidan ska ligga rätt igen när tangentbordet stängs
  document.addEventListener('touchstart', function(){}, {passive: true});
  document.addEventListener('focusout', function(){ setTimeout(function(){ try { window.scrollTo(0, 0); } catch(e){} }, 80); });

  backBtn.hidden = true;
  load();
  render(false);

  // Sidan sparas så att den öppnas utan nät. Bara som vanlig sida, inte i en ram.
  try {
    if ('serviceWorker' in navigator && window.self === window.top && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(function(){ /* fungerar utan */ });
  } catch(e){}
})();
</script>
